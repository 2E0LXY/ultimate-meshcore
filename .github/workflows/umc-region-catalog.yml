name: Refresh MeshCore region catalogue

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_region_catalog.py
      - name: Commit catalogue changes
        run: |
          if git diff --quiet -- flasher/regions-gb.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flasher/regions-gb.json
          git commit -m "chore: refresh GB MeshCore region catalogue"
          git push
