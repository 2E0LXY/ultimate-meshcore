name: minisign

# Signs every release asset that lacks a .minisig and uploads the signature.
# Needs repo secrets MINISIGN_KEY (secret key file contents) and MINISIGN_PASSWORD.
# No-op until MINISIGN_KEY is set. The schedule covers releases created by
# GITHUB_TOKEN, which do not fire the "release" event.

on:
  release:
    types: [published]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: minisign
  cancel-in-progress: false

jobs:
  sign:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
      MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$MINISIGN_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::MINISIGN_KEY not set; skipping"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install minisign
        if: steps.cfg.outputs.enabled == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq minisign

      - name: Sign unsigned assets
        if: steps.cfg.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/minisign.key"
          printf '%s\n' "$MINISIGN_KEY" > "$key"
          trap 'rm -f "$key"' EXIT
          for tag in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 5 --json tagName,isDraft --jq '.[] | select(.isDraft | not) | .tagName'); do
            names=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            work=$(mktemp -d)
            while IFS= read -r name; do
              [ -z "$name" ] && continue
              case "$name" in *.minisig) continue ;; esac
              grep -Fxq "$name.minisig" <<<"$names" && continue
              gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir "$work" --clobber
              printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$key" -m "$work/$name" -t "repo=$GITHUB_REPOSITORY tag=$tag file=$name"
              gh release upload "$tag" "$work/$name.minisig" --repo "$GITHUB_REPOSITORY"
            done <<<"$names"
          done
