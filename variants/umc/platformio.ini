; ============================================================================
;  Ultimate MeshCore Client (companion): Bluetooth + USB + WiFi TCP apps + browser
;  messenger + web UI + internet OTA, all in one image
; ============================================================================

[umc_client_common]
extra_scripts = pre:scripts/umc_embed_web.py
build_flags =
  -D UMC_BUILD=1
  -D UMC_VERSION='"0.1.0"'
  -D UMC_NAME='"Ultimate MeshCore Client"'
  -D UMC_WITH_BLE=1
  -D UMC_QUIET_SERIAL=1
  -D CONFIG_MBEDTLS_CERTIFICATE_BUNDLE=1
  -D DEFAULT_NTP_SERVER1='"uk.pool.ntp.org"'
  -D MAX_INTERFACES=6
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=64
  -D BLE_PIN_CODE=123456
  -D UMC_NIMBLE=1
  -D CONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
  -D CONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
  -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
  -D CONFIG_NIMBLE_CPP_LOG_LEVEL=0
  -D ENABLE_USB_INTERFACE=1
  -D AUTO_SHUTDOWN_MILLIVOLTS=3400
  -I examples/companion_radio/ui-new
build_src_filter =
  +<helpers/umc/*.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/esp32/*.cpp>
  -<helpers/esp32/SerialBLEInterface.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>

[env:umc_heltec_v3_client]
extends = Heltec_lora32_v3
extra_scripts =
  ${esp32_base.extra_scripts}
  ${umc_client_common.extra_scripts}
build_flags =
  ${Heltec_lora32_v3.build_flags}
  ${umc_client_common.build_flags}
  -D DISPLAY_CLASS=SSD1306Display
build_src_filter = ${Heltec_lora32_v3.build_src_filter}
  ${umc_client_common.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
lib_deps =
  ${Heltec_lora32_v3.lib_deps}
  ${esp32_ota.lib_deps}
  densaugeo/base64 @ ~1.4.0
  h2zero/NimBLE-Arduino @ 1.4.3

[env:umc_heltec_v4_oled_client]
extends = heltec_v4_oled
extra_scripts =
  ${esp32_base.extra_scripts}
  ${umc_client_common.extra_scripts}
