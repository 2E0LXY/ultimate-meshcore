; ---------------------------------------------------------------- LilyGo T-Deck / T-Deck Plus
;  Touch client: on-screen messenger, contacts, offline maps from the SD card, GPS

[env:umc_lilygo_tdeck_client]
extends = LilyGo_TDeck
extra_scripts =
  ${esp32_base.extra_scripts}
  ${umc_client_common.extra_scripts}
build_flags =
  ${LilyGo_TDeck.build_flags}
  ${umc_client_common.build_flags}
  -D UMC_TDECK_UI=1
  -D UMC_GPS_AUTODETECT=1
  -D UMC_CHATLOG_SIZE=120
  -D UMC_WEBAPP_RING=96
  -D ENV_SKIP_GPS_DETECT=1
  -I examples/companion_radio/ui-tdeck
build_src_filter = ${LilyGo_TDeck.build_src_filter}
  +<helpers/umc/*.cpp>
  +<helpers/esp32/*.cpp>
  -<helpers/esp32/SerialBLEInterface.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-tdeck/*.cpp>
lib_deps =
  ${LilyGo_TDeck.lib_deps}
  ${esp32_ota.lib_deps}
  densaugeo/base64 @ ~1.4.0
  h2zero/NimBLE-Arduino @ 1.4.3
