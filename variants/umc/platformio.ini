; ============================================================================
;  Ultimate MeshCore (UMC) build targets
;  Base: MeshCore 1.17.1 + EastMesh observer stack + UMC network services
;  Env naming: umc_<board>_<role>
; ============================================================================

[umc_common]
extra_scripts = pre:scripts/umc_embed_web.py
build_flags =
  -D UMC_BUILD=1
  -D UMC_VERSION='"0.1.0"'
  -D WITH_MQTT_UPLINK=1
  -D MQTT_DEFAULT_IATA='"UNSET"'
  -D CONFIG_MBEDTLS_CERTIFICATE_BUNDLE=1
  -D DEFAULT_NTP_SERVER1='"uk.pool.ntp.org"'
  -D MAX_NEIGHBOURS=50
  -D ADMIN_PASSWORD='"password"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
build_src_filter =
  +<helpers/umc/*.cpp>
  +<helpers/mqtt/*.cpp>
  +<helpers/web/*.cpp>

; ---------------------------------------------------------------- Heltec V3 / V3.2

[env:umc_heltec_v3_repeater]
extends = Heltec_lora32_v3
extra_scripts =
  ${esp32_base.extra_scripts}
  ${umc_common.extra_scripts}
build_flags =
  ${Heltec_lora32_v3.build_flags}
  ${umc_common.build_flags}
  -D DISPLAY_CLASS=SSD1306Display
  -D ADVERT_NAME='"UMC Repeater"'
  -D WITH_ESPNOW_BRIDGE=1
build_src_filter = ${Heltec_lora32_v3.build_src_filter}
  ${umc_common.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/bridges/ESPNowBridge.cpp>
  +<../examples/simple_repeater>
lib_deps =
  ${Heltec_lora32_v3.lib_deps}
  ${esp32_ota.lib_deps}
  bakercp/CRC32 @ ^2.0.0

