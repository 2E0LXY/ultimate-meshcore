<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>/* ---- Dashboard: dials, charts, connections and data flow ---- */
.dash2{--g:#2fe27a;--g2:#8dffb0;--cd:#0d1b17;--ln:#1b3a30;--tx:#e9f7ef;--mu:#7fa392;--am:#f2c14e;--bl:#4aa8ff;--pu:#a58bff;--rd:#ff5d6c;color:var(--tx);border-radius:16px;padding:16px;
  background:radial-gradient(1100px 480px at 15% -8%,#10301f 0,transparent 62%),radial-gradient(900px 420px at 100% 0,#0b2a2a 0,transparent 60%),#07100d}
.dash2 a{color:var(--g)}
.dash2 .hd{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}
.dash2 .hd h1{margin:0;font-size:26px;letter-spacing:.2px}.dash2 .hd h1 span{color:var(--g)}
.dash2 .hd p{margin:2px 0 0;color:var(--mu);font-size:13px}
.dash2 .hd .sp{flex:1}
.dash2 .pl{display:inline-flex;gap:6px;align-items:center;padding:4px 11px;border-radius:99px;background:#0d2219;border:1px solid var(--ln);color:var(--mu);font-size:12px}
.dash2 .pl.ok{color:var(--g)}.dash2 .pl.warn{color:var(--am)}.dash2 .pl.bad{color:var(--rd)}
.dash2 .dot{width:8px;height:8px;border-radius:50%;background:var(--mu);display:inline-block;box-shadow:0 0 8px currentColor}
.dash2 .dot.ok{background:var(--g);color:var(--g)}.dash2 .dot.warn{background:var(--am);color:var(--am)}.dash2 .dot.bad{background:var(--rd);color:var(--rd)}.dash2 .dot.idle{background:#4d6a5c;color:#4d6a5c;box-shadow:none}
.dash2 .rng button,.dash2 .tool{background:#0d2219;color:var(--mu);border:1px solid var(--ln);border-radius:8px;padding:4px 10px;cursor:pointer;font-size:12px}
.dash2 .rng button.on{color:#06140c;background:var(--g);border-color:var(--g)}
.dash2 .tool:hover,.dash2 .rng button:hover{border-color:var(--g);color:var(--tx)}
.dash2 .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:10px;margin-bottom:12px}
.dash2 .k,.dash2 .pn{background:linear-gradient(180deg,#0e1f19,#0b1814);border:1px solid var(--ln);border-radius:14px;padding:14px;box-shadow:0 0 0 1px #08140f inset,0 8px 24px #0006}
.dash2 .k{display:flex;gap:10px;align-items:center;position:relative;padding:12px}.dash2 .k>div:nth-child(2){min-width:0;flex:1}
.dash2 .k .ic{flex:none;width:40px;height:40px;border-radius:11px;background:#0f3a28;color:var(--g);display:grid;place-items:center;font-size:21px;box-shadow:0 0 16px #22d36a40;border:1px solid #1f6a45}
.dash2 .k small{color:var(--mu);font-size:11.5px;display:block}.dash2 .k b{font-size:24px;line-height:1.15;display:block}
.dash2 .tr{font-size:12px;color:var(--mu)}.dash2 .tr.up{color:var(--g)}.dash2 .tr.down{color:var(--am)}.dash2 .tr.bad{color:var(--rd)}
.dash2 .k svg.sp{position:absolute;right:10px;bottom:8px;width:56px;height:22px;opacity:.85}
.dash2 .panels{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}
.dash2 .s12{grid-column:span 12}.dash2 .s8{grid-column:span 8}.dash2 .s7{grid-column:span 7}.dash2 .s6{grid-column:span 6}.dash2 .s5{grid-column:span 5}.dash2 .s4{grid-column:span 4}
@media(max-width:1000px){.dash2 .s8,.dash2 .s7,.dash2 .s6,.dash2 .s5,.dash2 .s4{grid-column:span 12}}
.dash2 .pn h3{margin:0 0 8px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}.dash2 .pn h3 em{font-style:normal;color:var(--mu);font-weight:400;font-size:12px;margin-left:auto}
.dash2 .chart{position:relative}.dash2 .chart svg{width:100%;height:auto;display:block}
.dash2 .gl{stroke:#17342a;stroke-width:1}.dash2 .ax{fill:#6f9483;font-size:10px}
.dash2 .ln{filter:drop-shadow(0 0 4px currentColor)}
.dash2 .empty{padding:36px 10px;text-align:center;color:var(--mu);font-size:13px}
.dash2 .tip{position:absolute;pointer-events:none;background:#06130d;border:1px solid var(--g);border-radius:8px;padding:6px 9px;font-size:12px;white-space:nowrap;z-index:5;display:none}
.dash2 .lgd{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mu);margin-top:4px}.dash2 .lgd i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.dash2 .dials{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px}
.dash2 .gauge{text-align:center}.dash2 .gauge svg{width:100%;max-width:170px}
.dash2 .gt{fill:none;stroke:#143027;stroke-width:9;stroke-linecap:round}.dash2 .gv{fill:none;stroke-width:9;stroke-linecap:round}
.dash2 .gn{fill:var(--tx);font-size:19px;font-weight:700}.dash2 .gs{fill:var(--mu);font-size:7.5px}
.dash2 .gl2{color:var(--mu);font-size:12px;margin-top:-6px}
.dash2 .dn{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.dash2 .dn svg{width:150px;flex:none}
.dash2 .dn ul{list-style:none;margin:0;padding:0;font-size:12.5px;flex:1;min-width:140px}.dash2 .dn li{display:flex;gap:7px;align-items:center;padding:2px 0}.dash2 .dn li b{margin-left:auto;font-weight:600}.dash2 .dn li s{text-decoration:none;color:var(--mu)}
.dash2 .dn .ct{fill:var(--tx);font-size:18px;font-weight:700}.dash2 .dn .cs{fill:var(--mu);font-size:7px}
.dash2 table{width:100%;border-collapse:collapse;font-size:13px}.dash2 th{color:var(--mu);font-weight:500;text-align:left;font-size:12px;padding:4px 6px}.dash2 td{white-space:nowrap}.dash2 td b{white-space:normal}.dash2 td{padding:6px;border-top:1px solid #12291f}
.dash2 .bar{height:7px;border-radius:4px;background:#12291f;min-width:70px}.dash2 .bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#1fb85c,var(--g2))}
.dash2 .tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;background:#10301f;color:var(--g)}.dash2 .tag.tx{background:#33280f;color:var(--am)}
.dash2 .conn{display:flex;flex-direction:column;gap:2px}.dash2 .conn div{display:flex;gap:10px;align-items:center;padding:7px 4px;border-top:1px solid #12291f}.dash2 .conn div:first-child{border-top:0}
.dash2 .conn b{font-weight:600}.dash2 .conn span{color:var(--mu);font-size:12px;margin-left:auto;text-align:right}
.dash2 .flow svg{width:100%;height:auto}
.dash2 .fn rect{fill:#0c2018;stroke:#1f6a45;stroke-width:1.2}.dash2 .fn.off rect{stroke:#2a3a34;fill:#0a1511}.dash2 .fn text{fill:var(--tx);font-size:12px;font-weight:600}.dash2 .fn .sb{fill:var(--mu);font-size:10px;font-weight:400}
.dash2 .fn.hub rect{stroke:var(--g);stroke-width:2;filter:drop-shadow(0 0 10px #2fe27a66)}
.dash2 .fe{fill:none;stroke:#1d3d31;stroke-width:2.2}.dash2 .fe.on{stroke:var(--g);stroke-dasharray:7 9;animation:dfl var(--d,1.6s) linear infinite;filter:drop-shadow(0 0 3px #2fe27a88)}
.dash2 .fe.tx.on{stroke:var(--am);filter:drop-shadow(0 0 3px #f2c14e88)}.dash2 .fe.net.on{stroke:var(--bl);filter:drop-shadow(0 0 3px #4aa8ff88)}
.dash2 .fl{fill:var(--mu);font-size:10px}
@keyframes dfl{to{stroke-dashoffset:-32}}
.dash2 .digi{white-space:nowrap;font-family:ui-monospace,Consolas,monospace;font-size:30px;letter-spacing:2px;color:var(--g2);text-shadow:0 0 14px #2fe27a88}
.dash2 .qa{display:flex;gap:8px;flex-wrap:wrap}
.dash2 .enrolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#0e2a1d;border:1px solid var(--ac);border-radius:10px;padding:9px 14px;margin:0 0 12px;box-shadow:0 0 0 1px #2fe27a22,0 4px 18px #2fe27a14}.dash2 .enrolbar b{color:var(--ac)}.dash2 .enrolbar .sp{flex:1}
.dash2 .warnb{background:#33280f;border:1px solid var(--am);color:var(--am);border-radius:10px;padding:8px 12px;margin-bottom:12px}
.dash2 .fe.on{marker-end:url(#dar-g)}.dash2 .fe.tx.on{marker-end:url(#dar-a)}.dash2 .fe.net.on{marker-end:url(#dar-b)}


body{margin:0;background:#050d0a;color:#e9f7ef;font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:1500px;margin:0 auto;padding:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}.tabs button{background:#0d2219;color:#7fa392;border:1px solid #1b3a30;border-radius:9px;padding:7px 14px;cursor:pointer;font-size:13px}
.tabs button.on{background:#2fe27a;color:#06140c;border-color:#2fe27a}.tabs button:hover{border-color:#2fe27a;color:#e9f7ef}.tabs button.on:hover{color:#06140c}
.s3{grid-column:span 3}.s5{grid-column:span 5}
@media(max-width:1000px){.dash2 .s3{grid-column:span 12}}
.q{display:inline-grid;place-items:center;width:18px;height:18px;margin-left:7px;border-radius:50%;border:1px solid #2a5a46;background:transparent;color:#8fb3a1;font:700 11px/1 system-ui,sans-serif;cursor:pointer;vertical-align:middle;padding:0}
.q:hover{background:#2fe27a;border-color:#2fe27a;color:#06140c}
.helppop{position:absolute;z-index:60;width:min(380px,92vw);padding:12px 14px;border-radius:12px;background:#07130d;border:1px solid #2fe27a;color:#e9f7ef;box-shadow:0 12px 36px #000a;font-size:13px;line-height:1.45}

.dash2 .tool.danger{border-color:#ff5d6c;color:#ff9aa4}.dash2 .tool.danger:hover{background:#ff5d6c;color:#06140c}
.dash2 .tabs{margin-top:0}.dash2 select,.dash2 input[type=text],.dash2 input:not([type]),.dash2 input[type=password]{background:#0d2219;color:#e9f7ef;border:1px solid #1b3a30;border-radius:8px;padding:6px 8px}
.dash2 a{color:#2fe27a}.dash2 .row a{margin-right:14px}
.dash2 code{background:#0d2219;border:1px solid #1b3a30;border-radius:6px;padding:1px 6px;font-size:12px;color:#8dffb0}
.dash2 .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dash2 .tr{color:var(--mu)}.dash2 .conn b{white-space:nowrap}
.umcpop .leaflet-popup-content-wrapper{background:#0d2219;color:#e9f7ef;border:1px solid #1f4a37;border-radius:12px}.umcpop .leaflet-popup-tip{background:#0d2219}.umcpop .leaflet-popup-content{margin:12px 14px;max-height:430px;overflow:auto}.pop h3{margin:0 0 6px;font-size:15px}.pop h4{margin:10px 0 3px;font-size:12px;color:#9fd8b6}.pp{border-collapse:collapse;width:100%}.pp td{padding:2px 10px 2px 0;font-size:12px;vertical-align:top;border:0;white-space:normal;overflow-wrap:anywhere}.pp td:first-child{white-space:nowrap}
@keyframes newmsg{from{background:#2fe27a33}to{background:transparent}}tr.newmsg td{animation:newmsg 4s ease-out}
/* ---- Messages: chat themes. One set of rules, coloured by the theme chosen above the list (kept in this browser) ---- */

  --txt-rx:#d9ffe9;--txt-tx:#d6fff6;--meta:#9ccfb2;--muted:#7fa392;--panel:linear-gradient(rgba(6,19,13,.94),rgba(6,19,13,.97));--stage:radial-gradient(ellipse at 50% 120%,#2fe27a22,transparent 60%),rgba(4,14,9,.55);

  --txt-rx:#c8fff4;--txt-tx:#ffe1fb;--meta:#c9b8ff;--muted:#8f7fb8;--panel:linear-gradient(rgba(12,4,28,.62),rgba(12,4,28,.74)),url('https://2e0lxy.uk/images/umc-neon-chat-bg.png') center/cover;--stage:radial-gradient(ellipse at 50% 120%,#7a2cff44,transparent 60%),rgba(10,3,24,.38);
  --rain1:#ff4fd855;--rain2:#00e5ff44;--btn:linear-gradient(90deg,#ff4fd8,#7a2cff);--btn-ink:#fff}
.neonchat[data-nc="amber"]{--a:#ffb000;--a2:#ffd27a;--b:#ff7a1a;--b2:#ffc48f;--fill-rx:linear-gradient(135deg,#3a240099,#24160066 60%,#4a2e0033);--fill-tx:linear-gradient(135deg,#3a1a0099,#26100066 60%,#4a220033);--tail-rx:#2e1d00;--tail-tx:#2e1400;
  --txt-rx:#ffd98a;--txt-tx:#ffc9a0;--meta:#d9b06a;--muted:#a3854f;--panel:linear-gradient(rgba(14,9,2,.95),rgba(10,6,1,.97));--stage:repeating-linear-gradient(0deg,#ffb00008 0 2px,transparent 2px 4px),rgba(12,8,2,.6);
  --rain1:#ffb00033;--rain2:#ff7a1a2a;--btn:linear-gradient(90deg,#ffb000,#ff7a1a);--btn-ink:#1a0e00}

  --txt-rx:#dcefff;--txt-tx:#d6fffb;--meta:#9fc3e6;--muted:#7393b3;--panel:linear-gradient(rgba(4,12,26,.94),rgba(3,9,20,.97));--stage:radial-gradient(ellipse at 50% 120%,#4fb3ff2a,transparent 60%),rgba(3,10,22,.55);
  --rain1:#4fb3ff3a;--rain2:#2ee6d62e;--btn:linear-gradient(90deg,#4fb3ff,#2ee6d6);--btn-ink:#03101e}

  --txt-rx:#ffe1e1;--txt-tx:#fff0d9;--meta:#e6a9a9;--muted:#b07a7a;--panel:linear-gradient(rgba(22,6,12,.93),rgba(16,4,10,.97));--stage:radial-gradient(ellipse at 50% 120%,#ff6b6b33,transparent 60%),rgba(18,5,10,.55);
  --rain1:#ff6b6b3a;--rain2:#ffb3472e;--btn:linear-gradient(90deg,#ff6b6b,#ffb347);--btn-ink:#1e0608}

  --txt-rx:#e3efe8;--txt-tx:#e3ecf5;--meta:#9fb3a8;--muted:#7f9388;--panel:#0d1712;--stage:#0b1410;--rain1:transparent;--rain2:transparent;--btn:#2f8a5c;--btn-ink:#fff;--font:system-ui,-apple-system,"Segoe UI",sans-serif;--glow:0}
.neonchat .pn{background:var(--panel);border:1px solid color-mix(in srgb,var(--a) 33%,transparent);box-shadow:0 0 calc(24px * var(--glow)) color-mix(in srgb,var(--a) 14%,transparent)}

.nc-themes{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 10px;font-size:12px;color:var(--muted)}
.nc-themes button{display:inline-flex;align-items:center;gap:6px;border:1px solid #ffffff22;background:#0005;color:#ddd;border-radius:999px;padding:3px 10px 3px 4px;font-size:12px;cursor:pointer}

.nc-themes button.on{border-color:var(--a);color:var(--a2);box-shadow:0 0 10px color-mix(in srgb,var(--a) 45%,transparent)}
.nc-stage{position:relative;border-radius:16px;overflow:hidden;border:1px solid color-mix(in srgb,var(--a) 30%,transparent);background:var(--stage)}
.nc-rain{position:absolute;inset:0;pointer-events:none;opacity:.35;background:repeating-linear-gradient(90deg,transparent 0 46px,var(--rain1) 46px 47px,transparent 47px 93px,var(--rain2) 93px 94px);-webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);animation:ncrain 9s linear infinite;background-size:100% 300%}

.nc-msg.tx{margin-left:auto;align-items:flex-end}

.nc-time{color:var(--muted);font-variant-numeric:tabular-nums}
.nc-bubble{position:relative;padding:12px 16px;border-radius:18px;border:2px solid var(--a);background:var(--fill-rx);box-shadow:0 0 calc(14px * var(--glow)) color-mix(in srgb,var(--a) 65%,transparent),0 0 calc(32px * var(--glow)) color-mix(in srgb,var(--a) 25%,transparent),inset 0 0 calc(20px * var(--glow)) color-mix(in srgb,var(--b) 25%,transparent);backdrop-filter:blur(3px)}

.nc-msg.tx .nc-bubble{border-color:var(--b);background:var(--fill-tx);box-shadow:0 0 calc(14px * var(--glow)) color-mix(in srgb,var(--b) 65%,transparent),0 0 calc(32px * var(--glow)) color-mix(in srgb,var(--b) 25%,transparent),inset 0 0 calc(20px * var(--glow)) color-mix(in srgb,var(--a) 25%,transparent)}
.nc-msg.tx .nc-bubble::after{left:auto;right:22px;border-color:var(--b);background:var(--tail-tx);transform:skewX(-35deg) rotate(45deg) scale(.8)}

.nc-foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 8px 0;font-size:11.5px;color:var(--muted)}
.nc-heard i{font-style:normal;opacity:.85}
.nc-reply{background:transparent;border:1px solid color-mix(in srgb,var(--b) 60%,transparent);color:var(--b2);border-radius:999px;padding:2px 12px;font-size:11.5px;cursor:pointer;box-shadow:0 0 calc(8px * var(--glow)) color-mix(in srgb,var(--b) 25%,transparent)}
.nc-reply:hover{background:color-mix(in srgb,var(--b) 14%,transparent)}
.nc-msg.fresh .nc-bubble{animation:ncin .6s ease-out,ncglow 2.4s ease-in-out 3}
@keyframes ncin{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes ncglow{50%{box-shadow:0 0 26px var(--a),0 0 60px color-mix(in srgb,var(--a) 45%,transparent),inset 0 0 26px color-mix(in srgb,var(--b) 45%,transparent)}}
.nc-empty{color:var(--meta);text-align:center;padding:60px 20px}
.nc-emoji{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0 6px}.nc-emoji button{font-size:17px;line-height:1;background:#0006;border:1px solid color-mix(in srgb,var(--a) 35%,transparent);border-radius:8px;padding:4px 6px;cursor:pointer;color:inherit}.nc-emoji button:hover{background:color-mix(in srgb,var(--a) 16%,transparent)}
@media (prefers-reduced-motion:reduce){.nc-rain,.nc-msg.fresh .nc-bubble{animation:none}}
@media (max-width:700px){.nc-msg{max-width:92%}#msgFeed{height:58vh}}
</style></head>
<body><div class="wrap"><div class="dash2">
<svg width="0" height="0" style="position:absolute"><defs><filter id="dglow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<marker id="dar-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2fe27a"/></marker><marker id="dar-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f2c14e"/></marker><marker id="dar-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4aa8ff"/></marker></defs></svg>
<div class="hd"><div><h1><span>UMC Net</span> Dashboard</h1><p id="sub"></p></div><div class="sp"></div>
<div class="rng" id="rng"><button data-r="3600" class="on">1 h</button> <button data-r="21600">6 h</button> <button data-r="86400">24 h</button> <button data-r="604800">7 d</button></div>
<span class="pl" id="live"><i class="dot"></i> loading</span><button class="tool" id="refresh">Refresh</button></div>
<div class="tabs" id="tabs"></div><div id="enrolBar"></div><div id="body"></div></div></div>
<script>
const D = {uid: 0};
const $ = s => document.querySelector(s), esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const S = {o: null, hist: {}, range: 3600, tab: "overview", ev: [], evKind: "", logq: "", pq: "", t: 0, err: "", sel: "", vals: {}, log: [], audit: [], setup: "", created: null, msg: "", busy: false};
const TABS = [["overview", "Overview"], ["network", "Network"], ["messages", "Messages"], ["repeaters", "Repeaters"], ["control", "Control"], ["clients", "Clients"], ["accounts", "Accounts"], ["traffic", "Traffic"], ["diagnostics", "Diagnostics"], ["broker", "Broker"], ["system", "System"], ["log", "Log"], ["users", "Users"], ["settings", "Settings"]];
const bytes = n => n == null ? "—" : n >= 1e9 ? (n / 1e9).toFixed(2) + " GB" : n >= 1e6 ? (n / 1e6).toFixed(1) + " MB" : n >= 1e3 ? (n / 1e3).toFixed(1) + " kB" : Math.round(n) + " B";
const dur = s => { s = Math.round(s); const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60); return d ? `${d}d ${h}h ${m}m` : h ? `${h}h ${m}m` : m ? `${m}m ${s % 60}s` : `${s}s`; };
const ago = t => !t ? "never" : dur(Math.max(0, Date.now() / 1000 - t)) + " ago";
const clock = t => t ? new Date(t * 1000).toLocaleString([], {day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit", second: "2-digit"}) : "—";
const num = (o, k, d = 0) => { const v = parseFloat(o.sys[k]); return isNaN(v) ? d : v; };
const dot = l => `<i class="dot ${l}"></i>`;

D.fmt = v => v >= 100 ? Math.round(v) : v >= 10 ? v.toFixed(0) : v.toFixed(1).replace(/\.0$/, "");
D.hm = t => new Date(t * 1000).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});
D.nice = v => { const p = 10 ** Math.floor(Math.log10(Math.max(v, 1e-9))); return ([1, 2, 5, 10].find(k => k * p >= v) || 10) * p; };
D.empty = t => `<div class="empty">${esc(t)}</div>`;
D.area = (series, o = {}) => {
  const W = o.w || 640, H = o.h || 230, L = 38, R = 12, T = 12, B = 26, id = "dg" + (++D.uid), pts = series.flatMap(s => s.data);
  if (pts.length < 2) return D.empty("Collecting data. The chart fills in as this page stays open (one point a minute).");
  const x0 = Math.min(...pts.map(p => p[0])), x1 = Math.max(...pts.map(p => p[0])), ym = D.nice(Math.max(...pts.map(p => p[1]), o.min || 1) * 1.05);
  const X = t => L + (t - x0) / ((x1 - x0) || 1) * (W - L - R), Y = v => T + (1 - v / ym) * (H - T - B), f = o.fmt || D.fmt;
  let g = ""; for (let i = 0; i <= 4; i++) { const v = ym * i / 4, y = Y(v); g += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" class="gl"/><text x="${L - 6}" y="${y + 3}" class="ax" text-anchor="end">${f(v)}</text>`; }
  for (let i = 0; i <= 4; i++) { const t = x0 + (x1 - x0) * i / 4; g += `<text x="${X(t)}" y="${H - 7}" class="ax" text-anchor="${i === 0 ? "start" : i === 4 ? "end" : "middle"}">${D.hm(t)}</text>`; }
  const defs = series.map((s, i) => `<linearGradient id="${id}${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s.color}" stop-opacity=".42"/><stop offset="1" stop-color="${s.color}" stop-opacity="0"/></linearGradient>`).join("");
  const body = series.map((s, i) => { if (!s.data.length) return ""; const d = s.data.map((p, j) => (j ? "L" : "M") + X(p[0]).toFixed(1) + " " + Y(p[1]).toFixed(1)).join(" "), last = s.data[s.data.length - 1];
    return `<path d="${d} L${X(last[0]).toFixed(1)} ${Y(0)} L${X(s.data[0][0]).toFixed(1)} ${Y(0)}Z" fill="url(#${id}${i})"/><path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.2" class="ln" style="color:${s.color}"/><circle cx="${X(last[0]).toFixed(1)}" cy="${Y(last[1]).toFixed(1)}" r="3.6" fill="${s.color}"/>`; }).join("");
  const meta = esc(JSON.stringify({x0, x1, L, R, W, f: o.unit || "", s: series.map(s => ({n: s.name, c: s.color, d: s.data}))}));
  return `<div class="chart" data-m="${meta}"><svg viewBox="0 0 ${W} ${H}"><defs>${defs}</defs>${g}${body}</svg><div class="tip"></div></div>
    <div class="lgd">${series.map(s => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join("")}</div>`;
};
D.bars = (rx, tx, o = {}) => {
  const W = 640, H = o.h || 230, L = 38, R = 12, T = 12, B = 26, map = new Map();
  rx.forEach(([t, v]) => map.set(Math.round(t), [v, 0])); tx.forEach(([t, v]) => { const a = map.get(Math.round(t)) || [0, 0]; a[1] = v; map.set(Math.round(t), a); });
  const rows = [...map].sort((a, b) => a[0] - b[0]); if (rows.length < 2) return D.empty("Collecting data.");
  const ym = D.nice(Math.max(...rows.map(r => r[1][0] + r[1][1]), 1) * 1.1), bw = Math.max(2, (W - L - R) / rows.length - 2), Y = v => T + (1 - v / ym) * (H - T - B);
  let g = ""; for (let i = 0; i <= 4; i++) { const v = ym * i / 4; g += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" class="gl"/><text x="${L - 6}" y="${Y(v) + 3}" class="ax" text-anchor="end">${D.fmt(v)}%</text>`; }
  const id = "db" + (++D.uid); const bars = rows.map(([t, [a, b]], i) => { const x = L + i * ((W - L - R) / rows.length) + 1; return `<rect x="${x.toFixed(1)}" y="${Y(a + b).toFixed(1)}" width="${bw.toFixed(1)}" height="${(Y(0) - Y(a + b)).toFixed(1)}" rx="2" fill="url(#${id}a)"/><rect x="${x.toFixed(1)}" y="${Y(b).toFixed(1)}" width="${bw.toFixed(1)}" height="${(Y(0) - Y(b)).toFixed(1)}" rx="2" fill="url(#${id}b)"/>`; }).join("");
  const xs = [0, 1, 2, 3, 4].map(i => { const r = rows[Math.min(rows.length - 1, Math.round((rows.length - 1) * i / 4))]; return `<text x="${L + (W - L - R) * i / 4}" y="${H - 7}" class="ax" text-anchor="${i === 0 ? "start" : i === 4 ? "end" : "middle"}">${D.hm(r[0])}</text>`; }).join("");
  return `<svg viewBox="0 0 ${W} ${H}"><defs><linearGradient id="${id}a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8dffb0"/><stop offset="1" stop-color="#1fb85c"/></linearGradient><linearGradient id="${id}b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2c14e"/><stop offset="1" stop-color="#b8861c"/></linearGradient></defs>${g}${bars}${xs}</svg>
    <div class="lgd"><span><i style="background:#2fe27a"></i>Receiving</span><span><i style="background:#f2c14e"></i>Transmitting</span></div>`;
};
D.spark = (vals, color = "#2fe27a") => {
  if (vals.length < 2) return ""; const mx = Math.max(...vals, 1e-9), mn = Math.min(...vals, 0), W = 70, H = 28;
  const d = vals.map((v, i) => (i ? "L" : "M") + (i / (vals.length - 1) * W).toFixed(1) + " " + (H - 3 - (v - mn) / ((mx - mn) || 1) * (H - 6)).toFixed(1)).join(" ");
  return `<svg class="sp" viewBox="0 0 ${W} ${H}"><path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" style="filter:drop-shadow(0 0 3px ${color})"/></svg>`;
};
D.gauge = (v, min, max, label, text, sub, color) => {
  const pct = v == null || !isFinite(v) ? 0 : Math.max(0, Math.min(1, (v - min) / (max - min))), r = 42, cx = 55, cy = 55, a0 = 135, sw = 270;
  const pt = a => [cx + r * Math.cos(a * Math.PI / 180), cy + r * Math.sin(a * Math.PI / 180)];
  const arc = (a, b) => { const [x1, y1] = pt(a), [x2, y2] = pt(b); return `M${x1.toFixed(2)} ${y1.toFixed(2)} A${r} ${r} 0 ${b - a > 180 ? 1 : 0} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}`; };
  return `<div class="gauge"><svg viewBox="0 0 110 100"><path d="${arc(a0, a0 + sw)}" class="gt"/>${pct > 0.004 ? `<path d="${arc(a0, a0 + sw * Math.min(pct, 0.9999))}" class="gv" stroke="${color}" filter="url(#dglow)"/>` : ""}
    <text x="55" y="55" class="gn" text-anchor="middle">${esc(text)}</text><text x="55" y="67" class="gs" text-anchor="middle">${esc(sub)}</text></svg><div class="gl2">${esc(label)}</div></div>`;
};
D.level = (v, good, warn, higherIsBetter = true) => v == null ? "#7fa392" : (higherIsBetter ? (v >= good ? "#2fe27a" : v >= warn ? "#f2c14e" : "#ff5d6c") : (v <= good ? "#2fe27a" : v <= warn ? "#f2c14e" : "#ff5d6c"));
D.donut = (parts, centre, sub) => {
  const tot = parts.reduce((s, p) => s + p.value, 0); if (!tot) return D.empty("Nothing yet.");
  const r = 42, C = 2 * Math.PI * r; let off = 0;
  const segs = parts.filter(p => p.value > 0).map(p => { const len = p.value / tot * C, s = `<circle cx="60" cy="60" r="${r}" fill="none" stroke="${p.color}" stroke-width="13" stroke-dasharray="${len.toFixed(2)} ${(C - len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 60 60)"/>`; off += len; return s; }).join("");
  return `<div class="dn"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="${r}" fill="none" stroke="#12291f" stroke-width="13"/>${segs}<text x="60" y="62" class="ct" text-anchor="middle">${esc(centre)}</text><text x="60" y="74" class="cs" text-anchor="middle">${esc(sub)}</text></svg>
    <ul>${parts.map(p => `<li><i style="background:${p.color};width:9px;height:9px;border-radius:50%;display:inline-block"></i>${esc(p.label)}<b>${p.value}</b><s>${(p.value / tot * 100).toFixed(0)}%</s></li>`).join("")}</ul></div>`;
};
D.flowEdge = (x1, y1, x2, y2, cls, rate, on, bend = 0) => {
  const dur = Math.max(.5, Math.min(3, 2.6 - Math.log10(1 + (rate || 0)) * 1.1)).toFixed(2), mx = (x1 + x2) / 2;
  return `<path class="fe ${cls} ${on ? "on" : ""}" style="--d:${dur}s" d="M${x1} ${y1} C${mx} ${y1 + bend} ${mx} ${y2 + bend} ${x2} ${y2}"/>`;
};
D.flow = (f) => {
  const W = 720, H = 70 + f.nodes.length * 62, cy = H / 2, hub = [360, cy];
  const right = f.nodes.map((n, i) => ({...n, x: 600, y: 45 + i * ((H - 90) / Math.max(1, f.nodes.length - 1 || 1)) + (f.nodes.length === 1 ? (H - 90) / 2 : 0)}));
  let e = D.flowEdge(170, cy - 22, 270, cy - 22, "rx", f.rx, f.rx > 0, -6) + D.flowEdge(270, cy + 22, 170, cy + 22, "tx", f.tx, f.tx > 0, 6);
  right.forEach(n => { e += D.flowEdge(450, cy, 520, n.y, "net", n.rate || 1, n.ok, 0); });
  const box = (x, y, w, h, title, sub, cls = "") => `<g class="fn ${cls}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="12"/><text x="${x + w / 2}" y="${y + h / 2 - 2}" text-anchor="middle">${esc(title)}</text><text x="${x + w / 2}" y="${y + h / 2 + 13}" text-anchor="middle" class="sb">${esc(sub)}</text></g>`;
  const mk = (id, c) => `<marker id="dar-${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="${c}"/></marker>`;
  return `<div class="flow"><svg viewBox="0 0 ${W} ${H}"><defs>${mk("g", "#2fe27a")}${mk("a", "#f2c14e")}${mk("b", "#4aa8ff")}</defs>${e}
    ${box(30, cy - 36, 140, 72, "LoRa radio", f.freq, f.rx > 0 || f.tx > 0 ? "" : "")}${box(270, cy - 44, 180, 88, f.name, f.role, "hub")}
    <text x="220" y="${cy - 30}" class="fl" text-anchor="middle">in ${D.fmt(f.rx)}/min</text><text x="220" y="${cy + 40}" class="fl" text-anchor="middle">out ${D.fmt(f.tx)}/min</text>
    ${right.map(n => box(520, n.y - 24, 180, 48, n.title, n.sub, n.ok ? "" : "off")).join("")}</svg></div>`;
};



const HELP = {
  users: ["The people who can sign in to this dashboard. The administrator can do everything; an owner sees the whole network and every message and controls only the repeaters ticked for them; a viewer only looks.", "Add a user with a login name and password, tick their repeater(s), and give them the address of this page. Edit to change their repeaters or reset their password; Remove to take the login away.", "Each person signs in as themselves, so they can look after their own repeater without being able to change anyone else's, and the audit log shows who did what."],
  useradd: ["The form for adding a user or changing one.", "Pick a login name (lowercase), a password of 12 or more characters with a capital and a number, the role, the repeaters they control and the name their messages go out under. When editing, leave the password empty to keep it.", "The password is checked by the secure web front (Caddy), never stored in plain text."],
  messages: ["Every group message your repeaters hear in the channels you have set up, and the messages you send from here. Each row shows the channel, the region it was sent into, who sent it and which of your repeaters heard it and how far it had travelled.", "Pick a channel or region to narrow the list, or search. To send, choose a channel and optionally a region, type up to 130 characters and press Send: your repeaters transmit it. Channels and regions are managed in Settings.", "It shows what people are saying across your coverage, and lets you reach the area without a radio in your hand. Messages in channels the dashboard has no key for cannot be read; they are only counted."],
  msgcfg: ["The channels (name, and key for non-hashtag channels) and regions the Messages tab uses, who sends as, and whether sending is allowed.", "List one channel per line and the regions your repeaters use, then press Save messaging. Hashtag channels such as #yorkshire need no key.", "The dashboard can only read a channel whose key it has, and can only name a region it knows; everything else shows as unreadable or other region."],
  neigh: ["The repeaters this one can hear directly over the radio, with how recently and how strongly (SNR, higher is better).", "It reads itself when you open the tab and each minute after. Press Refresh to read again or Discover neighbours to ask for new adverts.", "A missing or weak neighbour shows a link problem long before users notice; a name appears once any repeater here has heard that node's advert."],
  repeaters: ["Repeaters that publish what they hear to this broker. Each has its own account bound to its device id.", "Read the table; open a card for details. Online means data arrived in the last 15 minutes.", "Shows which repeaters are alive, how busy they are and how healthy their radios look."],
  clients: ["Everything connected to the broker right now, taken from the broker's log: repeaters, the dashboard and any app or test tool.", "Read who, from where, since when and how often it reconnects.", "A client that reconnects often has a weak link; one you don't recognise is a security matter."],
  accounts: ["The login accounts on the broker, their role and (for repeaters) the device id they are allowed to write under.", "Manage them on the server with the umcnet-user tool.", "Accounts are what keep a stranger from injecting packets into your mesh."],
  traffic: ["The packets repeaters have just reported, decoded as far as is possible without decrypting.", "From shows an advert's sender, or a short code matched to a known repeater. Via is the repeater that handed it on.", "Shows what is moving through the network and how many repeaters heard each packet."],
  diag: ["Automatic checks of the broker, the server, the certificate and the repeaters.", "Green is fine, amber needs a look, red needs action.", "The quickest way to find out why something stopped working."],
  heard: ["How many repeaters heard each distinct packet in the last 15 minutes.", "Mostly 1 means the repeaters cover different places; many 2s and 3s mean overlapping coverage.", "Overlap is good for reliability but wastes airtime if there is too much."],
  overlap: ["For each pair of repeaters, how many packets both heard.", "Read across a row: a big number means those two repeaters hear the same part of the mesh.", "Shows which repeaters could stand in for each other."],
  broker: ["The broker's own statistics: connections, messages, bandwidth, memory.", "Search the table for a name. Values update every few seconds.", "Tells you how hard the broker is working and whether it is dropping anything."],
  system: ["The server the broker runs on: processor, memory, disk, network, services and certificate.", "Read the dials; green is fine.", "A full disk or a certificate that is about to expire stops the whole network."],
  log: ["The broker's own log: logins, disconnects and warnings.", "Type to filter. Newest lines are first.", "The place to look for why one particular repeater can't connect."],
  flow: ["A picture of the network: repeaters on the left, the secure web front (Caddy) and the broker in the middle, and who listens on the right.", "A line moves while data flows, faster for busier repeaters. Grey means no data lately.", "Shows at a glance who is talking to whom."],
  events: ["Connections, disconnections, refused logins and warnings, kept for 14 days.", "Filter by kind. Refused logins show the address they came from.", "A pattern of refused logins from one address is someone guessing passwords."],
  network: ["A map of the repeaters on this network and every node they hear, with a line for each link coloured by how many hops the packet took: green is heard directly, blue one hop, purple two, amber three, orange four or more.", "Pick which hop counts to show, or one repeater's view. Hover a line or a dot for details. Positions come from the adverts nodes send, so only nodes that share a location are on the map; the rest are in the tables.", "It shows how the repeaters really connect over the air, which repeaters reach furthest, and where the gaps are, from what they actually heard rather than from guesses."],
  journeys: ["Recent packets as a chain: the sender, each repeater that passed it on, and the repeater that reported it.", "Read left to right. A name in the chain is a repeater matched from its one-byte code; a bare code means more than one known node fits.", "Shows the real route a message took across your network."],
  control: ["Remote administration of one repeater through the broker: settings, firmware, adverts and the complete device CLI.", "Pick a repeater. Its settings load automatically; Refresh settings asks for a new copy. Changes and disruptive commands ask you to confirm.", "Every command is signed, recent, rate-limited and recorded. Secret command text and replies are redacted from the audit log."],
  setup: ["The commands to paste into a repeater's Console page so that it joins UMC Net and accepts signed commands from this dashboard.", "Press Control setup, copy the text and paste it into the repeater's Console (or send it over USB). Settings will appear automatically when it answers.", "The control key proves a command came from you. Keep it private; renew it here if it leaks."],
  approve: ["A repeater account that has connected but has not been tied to a device yet. It can listen, but it cannot publish or be controlled until you approve it.", "Check the device id shown matches the repeater you expect (it is on its display, and under Identity as Public key), paste the full 64-character id and approve.", "Without approval a repeater is held at the door, so a leaked password alone cannot add a fake repeater to your network."],
  enrol: ["Repeaters that are switched to join UMC Net but have no account yet, waiting for you to let them in.", "Check the name and device id, then press Approve (the account is made and sent to the repeater) or Decline. A declined repeater is ignored until you press Forget.", "Replaces typing broker settings, passwords and keys into each repeater: it joins with one switch and you stay in control of who is allowed."],
  accts: ["Create, approve, block, reset or remove broker accounts without touching the server, and make the one-line join code that sets a repeater up.", "Add an account, copy the join line it shows, paste it into the repeater's Console and press Enter. Approve the repeater when it connects. Join code on a row makes a fresh code (and gives the account a new password). Block shuts an account out at once.", "One account per repeater means a lost or stolen repeater can be shut out without disturbing the others."],
  audit: ["A record of everything done from this dashboard: commands, account changes, settings and password changes, with the reply.", "Read it, or download it as CSV.", "If something changed and nobody knows why, this tells you who did it and when."],
  settings: ["Limits for the checks, how long history is kept, whether control needs confirmation, and where alerts go.", "Change a value and press Save. Nothing is applied until you save.", "Different networks have different needs: tune the checks so they warn you about what matters to you and stay quiet about what doesn't."],
  alerts: ["A message sent to a web address or an ntfy topic when something needs your attention.", "Paste the address (for example https://ntfy.sh/your-topic), tick what you want to hear about, Save, then press Send a test.", "You find out a repeater went silent from your phone, not by remembering to look."],
  password: ["The password for this dashboard.", "Enter the current one and a new one of at least 12 characters with a capital and a number. You will be asked to sign in again.", "Change it if anyone else has seen it. It is stored only as a hash."],
  latency: ["The difference between the time a repeater put on a message and the time it reached this server.", "Small is good. Large numbers mean a slow link or a repeater whose clock is wrong.", "A wrong clock on a repeater also makes its packets look old to others."],
};
const q = key => HELP[key] ? `<button type="button" class="q" data-hk="${key}" aria-label="What is this?" title="What is this?">?</button>` : "";

function devName(o, id) { const d = o.devices.find(x => x.id === id); return d ? (d.name || id.slice(0, 8)) : id.slice(0, 8); }

function flowNet(o) {
  const devs = o.devices.slice(0, 6), W = 820, H = 92 + Math.max(devs.length, 3) * 56, cy = (H - 22) / 2;

  let e = "", nodes = "";
  const box = (x, y, w, h, t, sub, cls = "") => `<g class="fn ${cls}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="11"/><text x="${x + w / 2}" y="${y + h / 2 - 1}" text-anchor="middle">${esc(t.length > 20 ? t.slice(0, 19) + "…" : t)}</text><text x="${x + w / 2}" y="${y + h / 2 + 13}" text-anchor="middle" class="sb">${esc(sub.length > 26 ? sub.slice(0, 25) + "…" : sub)}</text></g>`;
  devs.forEach((d, i) => {
    const y = 40 + i * ((H - 102) / Math.max(1, devs.length - 1 || 1)) + (devs.length === 1 ? (H - 102) / 2 : 0), on = d.age < 300, br = d.bridge || {}, hear = d.pm || 0, send = br.passed_pm || 0;
    e += edge(190, y - 9, 330, cy - 7, "rx", hear + 1, on && hear > 0) + edge(330, cy + 7, 190, y + 9, "tx", send + 1, on && send > 0);
    nodes += box(10, y - 26, 180, 52, d.name || d.id.slice(0, 8), `in ${hear.toFixed(1)} · out ${send.toFixed(1)} /min`, on ? "" : "off");
  });
  e += `<text x="10" y="${H - 8}" fill="#7fa392" font-size="11">green: heard by radio, sent to the broker · amber: from the broker, sent by radio (bridge)</text>`;
  const msgs = o.rates.messages, cl = num(o, "$SYS/broker/clients/connected"), up = o.mqtt.state === "connected";
  e += edge(450, cy, 520, cy, "net", msgs + 1, msgs > 0 || cl > 0);
  const subs = o.clients.filter(c => c.state === "connected" && c.user !== "dash");
  e += edge(650, cy - 30, 700, cy - 52, "tx", 1, up) + edge(650, cy + 30, 700, cy + 52, "net", subs.length, subs.length > 0);
  nodes += box(330, cy - 36, 120, 72, "Caddy", o.cert && o.cert.days != null ? "TLS " + Math.round(o.cert.days) + " d left" : "TLS ?", "") +
    box(520, cy - 44, 130, 88, "Mosquitto", cl + " clients · " + msgs.toFixed(0) + "/min", "hub") +
    box(700, cy - 76, 112, 48, "This dashboard", up ? "monitoring" : "disconnected", up ? "" : "off") +

async function runCmd(cmd, risky, quiet, fromBox) {
  const flash = t => { const el = $("#ctlMsg"); if (el) el.textContent = t; };
  if (!quiet) { S.msg = "Sending " + cmd + "…"; flash(S.msg); }
  let r = await post("/api/control", {device: S.sel, cmd, confirm: !!risky});
  if (r.needs_confirm) { if (!confirm(r.error + "\n\n" + cmd)) { S.msg = "Cancelled"; draw(); return r; } r = await post("/api/control", {device: S.sel, cmd, confirm: true}); }
  S.log.unshift({t: Date.now() / 1000, dev: S.sel, cmd, ok: !!r.ok, reply: r.ok ? r.reply : r.error}); S.log = S.log.slice(0, 60);
  if (!quiet) S.msg = r.ok ? "Done" : (r.error || "Failed"); if (fromBox) { const i = $("#ctlCmd"); if (i) i.value = ""; }
  await loadAudit(); draw(); return r;
}
async function accountAction(act, name, prefix) {
  if (act === "join") {
    if (!confirm(`Make a join code for ${name}?\n\nThis gives the account a new password. The repeater that uses it must be given the code (or it will be locked out).`)) return;
    const r = await post("/api/join", {name}); if (!r.ok) { alert(r.error || "Could not make a join code"); return; }
    S.created = {title: "Join code ready", name, join: r.join, key: r.has_key}; await tick(); window.scrollTo(0, 0); return;
  }
  if (act === "approve") {
    const id = prompt(`Approve ${name}\n\nPaste the repeater's full device id (64 characters: its Public key under Identity, or the Repeater ID on its display).` + (prefix ? `\nIt must start with ${prefix}.` : "")); if (!id) return;
    const r = await post("/api/accounts/approve", {name, device: id.trim()}); alert(r.ok ? "Approved. It can now publish and be controlled." : (r.error || r.output)); await tick(); return;
  }
  if (act === "remove" && !confirm(`Remove the account ${name}? The repeater using it will be locked out.`)) return;
  if (act === "block" && !confirm(`Block ${name}? It is shut out at once.`)) return;
  if (act === "passwd" && !confirm(`Give ${name} a new password? The repeater using it must be updated or it will be locked out.`)) return;
  const r = await post("/api/accounts/" + act, {name});
  if (act === "passwd" && r.ok) S.created = {title: "New password", name, password: r.password, text: `set mqtt.custom.password ${r.password}`};
  if (!r.ok) alert(r.error || r.output || "Failed"); await tick();
}

  }
  const dir = n.links.filter(l => l.hops === 0).length, one = n.links.filter(l => l.hops === 1).length, more = n.links.filter(l => l.hops >= 2).length;
  const kp = [kpi("◎", "Nodes known", n.nodes.length, `${placed.length} with a position`), kpi("⇄", "Links seen", n.links.length, "pairs that hear each other"), kpi("●", "Heard directly", dir, "green lines", "up"), kpi("◐", "One hop", one, "blue lines"), kpi("○", "Two or more hops", more, "purple, amber, orange"), kpi("✉", "Packets followed", n.journeys.length, "latest 80 below")].join("");
  const name = k => (nodes[k] && nodes[k].name) || k.slice(0, 8);
  const lrows = links.slice().sort((a, b) => a.hops - b.hops || b.n - a.n).slice(0, 200).map(l => `<tr><td><b>${esc(name(l.recv))}</b></td><td>${esc(name(l.node))} <span class="tr">${KINDN[(nodes[l.node] || {}).type] || ""}</span></td><td><span style="color:${HOPC(l.hops)}">●</span> ${HOPN(l.hops)}</td><td>${l.n}</td><td>${l.snr ?? ""}${l.rssi != null ? " / " + l.rssi : ""}</td><td>${Object.entries(l.types).map(([k, v]) => k + " " + v).join(", ")}</td><td>${ago(l.last)}</td></tr>`);
  const jrows = n.journeys.slice(0, 60).map(j => `<tr><td>${clock(j.t).split(", ").pop()}</td><td>${esc(j.type)}</td><td style="white-space:normal"><b>${esc(nodes[j.from] ? nodes[j.from].name : j.from || "?")}</b>${j.path.map(p => ` <span class="tr">→</span> <span style="color:${p.n === p.h ? "#7fa392" : "#e9f7ef"}">${esc(p.n)}</span>`).join("")} <span class="tr">→</span> <b>${esc(name(j.to))}</b></td><td><span style="color:${HOPC(j.hops)}">●</span> ${HOPN(j.hops)}</td><td>${j.snr ?? ""}</td></tr>`);
  const unp = unplaced.length ? panel("Nodes without a position", unplaced.length + " heard, not on the map", `<div class="row" style="gap:6px;flex-wrap:wrap">${unplaced.slice(0, 80).map(x => `<span class="tag">${esc(x.name)}${x.connected ? " ●" : ""}</span>`).join("")}</div><p class="tr" style="margin-top:6px">A node appears on the map once it sends an advert that includes its location, or (for a repeater with control set up) once the dashboard has asked it where it is.</p>`, "", "s12") : "";
  $("#netBody").innerHTML = `<div class="kpis">${kp}</div><div class="panels">${panel("Links", `${links.length} shown`, table(["Heard by", "Node", "Nearest", "Packets", "SNR / RSSI", "Packet types", "Last"], lrows, "No links yet: they appear as the repeaters report adverts."), "network", "s7")}${panel("Packet journeys", "newest first", table(["When", "Type", "Route", "Hops", "SNR"], jrows, "Nothing yet."), "journeys", "s5")}${unp}</div>`;
  S.netUp = true;
}
document.addEventListener("change", async e => {
  const el = e.target.closest("[data-nf]"); if (!el) return;
  S.nf[el.dataset.nf] = el.type === "checkbox" ? el.checked : el.value;
  if (el.dataset.nf === "hours") { try { S.net = await jget("/api/network?hours=" + S.nf.hours); } catch {} }
  netUpdate();
});
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-enrol]"); if (!b) return;
  const act = b.dataset.enrol, id = b.dataset.id;
  if (act === "approve") {
    const nm = ($("#en-" + id.slice(0, 12)) || {}).value || "";
    b.disabled = true; const r = await post("/api/enrol/approve", {id, name: nm});
    if (!r.ok) { alert(r.error || "Could not approve"); b.disabled = false; return; }
    S.enrolMsg = `Approved. Account ${r.account} was made with remote control on, and the repeater will connect within a minute.`;
  } else if (act === "decline") {
    if (!confirm("Decline this repeater? It will be ignored until you press Forget.")) return;
    const r = await post("/api/enrol/decline", {id}); if (!r.ok) { alert(r.error || "Could not decline"); return; } S.enrolMsg = "Declined.";
  } else if (act === "forget") {
    const r = await post("/api/enrol/forget", {id}); S.enrolMsg = r.ok ? "Forgotten: that repeater may ask again." : "";
  }
  await tick();
});
document.addEventListener("click", e => { if (e.target.closest('[data-act="fit"]') && S.net && S.map) { const p = S.net.nodes.filter(x => x.lat != null); if (p.length) S.map.fitBounds(p.map(x => [x.lat, x.lon]), {padding: [40, 40], maxZoom: 12}); } });

const VIEWS = {users: vUsers, network: vNetwork, messages: vMessages, overview: (o) => pendBanner(o) + vOverview(o), repeaters: vRepeaters, control: vControl, clients: vClients, accounts: vAccounts, settings: vSettings, traffic: vTraffic, diagnostics: vDiag, broker: vBroker, system: vSystem, log: vLog};
function draw() {
  const o = S.o; if (!o) return;
  const active = document.activeElement && document.activeElement.id;
  const nEnrol = o.enrol && o.enrol.pending ? o.enrol.pending.length : 0;
  const isAdmin = !o.me || o.me.role === "admin", hideTabs = isAdmin ? [] : ["accounts", "users"]; if (hideTabs.includes(S.tab)) S.tab = "overview";
  const newMsgs = Math.max(0, (o.msg_last || 0) - (S.msgSeen || 0)); if (S.tab === "messages") S.msgSeen = o.msg_last || 0; else if (S.msgSeen == null) S.msgSeen = o.msg_last || 0;
  $("#tabs").innerHTML = TABS.filter(([k]) => !hideTabs.includes(k)).map(([k, l]) => `<button data-t="${k}" class="${S.tab === k ? "on" : ""}">${l}${k === "messages" && newMsgs && S.tab !== "messages" ? ` <span class="tag" style="background:#4aa8ff;color:#06130d">${newMsgs}</span>` : ""}${k === "accounts" && nEnrol ? ` <span class="tag" style="background:#2fe27a;color:#06130d">${nEnrol}</span>` : ""}</button>`).join("");
  $("#enrolBar").innerHTML = nEnrol ? `<div class="enrolbar"><span style="font-size:20px">🔔</span><div><b>${nEnrol} repeater${nEnrol > 1 ? "s" : ""} asking to join</b><div class="tr">${o.enrol.pending.slice(0, 3).map(p => esc(p.name || "unnamed") + " (" + p.id.slice(0, 8) + "…)").join(", ")}${nEnrol > 3 ? " and more" : ""}</div></div><span class="sp"></span><button class="tool" data-t="accounts">Review and approve</button></div>` : "";
  document.title = (o.config && o.config.title || "UMC Net") + " dashboard"; $("#sub").textContent = `${o.host} · broker ${o.sys["$SYS/broker/version"] || ""} · dashboard ${o.version}${o.me ? " · signed in as " + o.me.name + (o.me.role === "admin" ? " (administrator)" : o.me.role === "owner" ? " (controls " + ((o.me.devices || []).length) + " repeater" + ((o.me.devices || []).length === 1 ? "" : "s") + ")" : " (view only)") : ""}`;
  const bad = o.diagnostics.filter(d => d.level === "bad").length, warn = o.diagnostics.filter(d => d.level === "warn").length;
  $("#live").className = "pl " + (S.err ? "bad" : bad ? "bad" : warn ? "warn" : "ok"); $("#live").innerHTML = `${dot(S.err ? "bad" : bad ? "bad" : warn ? "warn" : "ok")} ${S.err ? "not answering" : bad ? bad + " problem(s)" : warn ? warn + " to look at" : "all fine"} · ${new Date().toLocaleTimeString()}`;
  if (S.tab === "messages" && S.msgUp && $("#msgFeed")) { msgUpdate(); }
  else if (S.tab === "network" && S.netUp && $("#netmap")) { netUpdate(); }
  else { $("#body").innerHTML = (VIEWS[S.tab] || vOverview)(o); if (S.tab === "network") netUpdate(); if (S.tab === "messages") { msgLoad(); } }
  if (active && $("#" + active)) { const el = $("#" + active); el.focus(); try { el.setSelectionRange(el.value.length, el.value.length); } catch {} }
}
async function loadHist() {
  const keys = ["pkts_pm", "unique_pm", "msgs_pm", "clients", "repeaters", "bytes_rx_1m", "bytes_tx_1m", "pub_rx_1m", "pub_tx_1m", "dropped_1m", "cpu", "mem_pct", "disk_pct"].concat((S.o ? S.o.devices.slice(0, 6) : []).map(d => "dev:" + d.id.slice(0, 16)));
  try { S.hist = await jget("/api/history?range=" + S.range + "&k=" + keys.join(",")); } catch {}
}
async function loadEv() { try { S.ev = await jget("/api/events?range=86400" + (S.evKind ? "&kind=" + S.evKind : "")); } catch {} }
async function tick(first) {
  try { S.o = await jget("/api/overview"); S.err = ""; } catch (e) { S.err = e.message; }
  if (S.tab === "network") { try { S.net = await jget("/api/network?hours=" + S.nf.hours); } catch {} }
  if (S.tab === "messages") await msgLoad();
  if (S.tab === "control") ctlAuto();
  if (first || Date.now() - S.t > 30000) { S.t = Date.now(); await loadHist(); if (S.tab === "diagnostics" || first) await loadEv(); }
  if (!hold()) draw();
}
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-t]"); if (t) { S.tab = t.dataset.t; location.hash = S.tab; S.netUp = false; if (S.tab === "network") { try { S.net = await jget("/api/network"); } catch {} } if (S.tab === "diagnostics") await loadEv(); if (S.tab === "diagnostics" || S.tab === "control") await loadAudit(); draw(); return; }
  const r = e.target.closest("#rng button"); if (r) { S.range = +r.dataset.r; document.querySelectorAll("#rng button").forEach(b => b.classList.toggle("on", b === r)); await loadHist(); draw(); return; }
  const k = e.target.closest("[data-ek]"); if (k) { S.evKind = k.dataset.ek; await loadEv(); draw(); return; }
  if (e.target.closest("#refresh")) { S.t = 0; tick(); }
});
document.addEventListener("input", e => { if (e.target.id === "pq") { S.pq = e.target.value; draw(); } else if (e.target.id === "bq") { S.bq = e.target.value; draw(); } else if (e.target.id === "lq") { S.logq = e.target.value; draw(); } });
document.addEventListener("mousemove", e => {
  const c = e.target.closest(".chart"), tip = c && c.querySelector(".tip"); document.querySelectorAll(".tip").forEach(t => { if (t !== tip) t.style.display = "none"; }); if (!c) return;
  const m = JSON.parse(c.dataset.m), svg = c.querySelector("svg"), rc = svg.getBoundingClientRect(), x = (e.clientX - rc.left) / rc.width * m.W, t = m.x0 + (x - m.L) / ((m.W - m.L - m.R) || 1) * (m.x1 - m.x0);
  if (t < m.x0 - 60 || t > m.x1 + 60) { tip.style.display = "none"; return; }
  const rows = m.s.map(s => { const p = s.d.reduce((b, q) => Math.abs(q[0] - t) < Math.abs(b[0] - t) ? q : b, s.d[0] || [0, 0]); return `<span style="color:${s.c}">●</span> ${esc(s.n)}: <b>${D.fmt(p[1])}${esc(m.f)}</b>`; }).join("<br>");
  tip.innerHTML = `${D.hm(t)}<br>${rows}`; tip.style.display = "block"; tip.style.left = Math.min(e.clientX - c.getBoundingClientRect().left + 14, c.clientWidth - 170) + "px"; tip.style.top = "8px";
});
S.tab = (location.hash || "#overview").slice(1); if (!VIEWS[S.tab]) S.tab = "overview";
tick(true); setInterval(() => tick(), 5000);

</script></body></html>
