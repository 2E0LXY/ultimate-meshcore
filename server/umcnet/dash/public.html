<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>(function(){var t="overview";try{var s=localStorage.getItem("umc-theme");if(s==="overview"||s==="analytics")t=s}catch(e){}document.documentElement.setAttribute("data-theme",t)})()</script>
<title>UMC Net Live Dashboard</title>
<style>
/* ---- Themes: values from docs/umc/theme/tokens.json (single source of truth; keep every surface in step) ---- */
html[data-theme="overview"],html:not([data-theme]){color-scheme:dark;--page:#05070c;--surface:#0e1626;--surface2:#131c2e;--sidebar:#0f1522;--card:#0a0c11;--border:#1a2030;--chip:#1a1d24;--track:#23262d;--ink:#ffffff;--muted:#a0a9bb;--faint:#808aa0;--accent:#2563eb;--accent-ink:#ffffff;--nav-active:#2563eb;--nav-active-ink:#ffffff;--ok:#22c55e;--ok-bg:#0d2a1b;--warn:#f59e0b;--warn-bg:#2b2108;--bad:#ef4444;--bad-bg:#2b0f15;--s1:#4f46e5;--s2:#3b82f6;--s3:#06b6d4;--s4:#22d3ee;--s5:#a78bfa;--s6:#f59e0b;--radius:14px;--radius-sm:8px;--radius-pill:999px}
html[data-theme="analytics"]{color-scheme:dark;--page:#f3f4f6;--surface:#0b0b0d;--surface2:#0b0b0d;--sidebar:#0b0b0d;--card:#111114;--border:#1c1c21;--chip:#17171b;--track:#232329;--ink:#f4f4f5;--muted:#a5a5ae;--faint:#84848e;--accent:#3b5bff;--accent-ink:#ffffff;--nav-active:#17171b;--nav-active-ink:#ffffff;--ok:#22c55e;--ok-bg:#0d2417;--warn:#f5a524;--warn-bg:#2a2008;--bad:#ef4444;--bad-bg:#2b0f15;--s1:#3b5bff;--s2:#29b6f6;--s3:#22c55e;--s4:#f2784b;--s5:#7c5cff;--s6:#ec4899;--s7:#f5a524;--s8:#14b8a6;--radius:16px;--radius-sm:8px;--radius-pill:999px}
:root{--link:color-mix(in srgb,var(--accent) 45%,var(--ink));--ring:color-mix(in srgb,var(--ink) 22%,transparent);--shade:rgba(0,0,0,.45)}
*{box-sizing:border-box}html{min-height:100%;background:var(--page)}
body{margin:0;min-height:100vh;overflow-x:hidden;color:var(--ink);background:var(--page);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.shell{max-width:1380px;margin:22px auto;background:linear-gradient(160deg,var(--surface2),var(--surface));border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 24px 60px var(--shade);overflow:hidden}
header,main{position:relative;padding:22px}main{padding-top:4px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px 20px;flex-wrap:wrap}
.eyebrow{color:var(--muted);letter-spacing:.08em;font-size:12px}.brand{color:var(--ink)}
h1{margin:4px 0 0;font-size:clamp(24px,3.4vw,34px);line-height:1.1;font-weight:700;letter-spacing:-.02em}h2{margin:0 0 10px;font-size:15px;font-weight:600}
.head-actions{display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap;justify-content:flex-end}
.pill,.admin{border:1px solid var(--border);border-radius:var(--radius-pill);padding:6px 12px;background:var(--chip)}
.pill{display:inline-flex;align-items:center;gap:8px;color:var(--ok);background:var(--ok-bg)}
.admin{color:var(--accent-ink);text-decoration:none;background:var(--accent);border-color:var(--accent);font-weight:600}.admin:hover{filter:brightness(1.1)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block;animation:pulse 1.7s ease-out infinite}
.muted{color:var(--muted)}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.themesw,.tabs{display:inline-flex;gap:2px;padding:3px;border-radius:var(--radius-pill);background:var(--chip);border:1px solid var(--border);max-width:100%;overflow:auto}
.tabs{margin:4px 0 18px}
.themesw button,.tabs button{border:0;background:transparent;color:var(--muted);border-radius:var(--radius-pill);padding:7px 15px;cursor:pointer;font:inherit}
.themesw button:hover,.tabs button:hover{color:var(--ink)}
.themesw button[aria-pressed=true],.tabs button.active{background:var(--nav-active);color:var(--nav-active-ink);font-weight:600;box-shadow:inset 0 0 0 1px var(--ring)}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin-bottom:14px}
.card{grid-column:span 4;position:relative;overflow:hidden;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.wide{grid-column:span 12}.half{grid-column:span 6}.kpi{grid-column:span 3}
.label{color:var(--muted)}.big{font-size:30px;font-weight:700;margin-top:6px;line-height:1.15}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tag{border:1px solid var(--border);border-radius:var(--radius-pill);padding:3px 10px;color:var(--muted);background:var(--chip);font-size:12px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px}.stats div{background:var(--chip);border-radius:var(--radius-sm);padding:10px}.stats b{display:block;font-size:16px;margin-top:3px}
code{display:block;color:var(--muted);font-size:10px;overflow:hidden;text-overflow:ellipsis}
.scroll{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--border);vertical-align:top}th{color:var(--muted);font-weight:500;font-size:11px;letter-spacing:.05em;text-transform:uppercase}
.empty{padding:38px;text-align:center;color:var(--muted)}
.flow{padding:20px;margin-bottom:14px}.flow-title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.flow-title h2{margin:0;font-size:18px}
.repeater-bank{padding:14px}.repeater-bank>small{display:block;color:var(--muted);margin-bottom:8px}.repeater-lanes{display:grid;gap:8px;margin-top:10px}
.repeater-lane{display:grid;grid-template-columns:minmax(150px,auto) 1fr;align-items:center;min-width:0}
.repeater-lane .source{justify-content:flex-start;min-width:0;border-radius:10px;padding:7px 9px;animation:none}.repeater-lane .source.active{animation:sourceGlow 1.5s ease-in-out infinite}.repeater-lane .source.idle{opacity:.64}.repeater-lane .source span{overflow:hidden;text-overflow:ellipsis}
.flow-dir{margin-left:auto;border:1px solid var(--border);border-radius:var(--radius-pill);padding:1px 6px;color:var(--muted);font-size:9px;letter-spacing:.04em}
.lane-route{position:relative;height:3px;background:var(--track);overflow:visible}.lane-route.active{background:linear-gradient(90deg,var(--track),var(--s1),var(--track))}.lane-route .packet{display:none}.lane-route.active .packet{display:block}.lane-route.reverse .packet{animation-direction:reverse}.lane-route.both .packet:nth-child(2){animation-direction:reverse}.lane-route.both .packet:nth-child(3){animation-delay:-.9s}
.flow-track{display:grid;grid-template-columns:minmax(220px,1.1fr) minmax(90px,.55fr) minmax(210px,.9fr) minmax(90px,.55fr) minmax(190px,.8fr);align-items:center;gap:0;min-height:150px}
.flow-box{position:relative;z-index:2;min-height:100px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface2);padding:15px;text-align:center}.flow-box strong{display:block;font-size:16px}.flow-box small{color:var(--muted)}
.source-list{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin-top:11px}
.source{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:5px 9px;border:1px solid var(--border);border-radius:var(--radius-pill);background:var(--chip);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:sourceGlow 2.2s ease-in-out infinite}.source:nth-child(2){animation-delay:.35s}.source:nth-child(3){animation-delay:.7s}.source:nth-child(4){animation-delay:1.05s}.source i{width:7px;height:7px;border-radius:50%;background:var(--s1)}
.route{position:relative;height:3px;background:linear-gradient(90deg,var(--track),var(--s1),var(--track))}
.packet{position:absolute;top:50%;left:0;width:10px;height:10px;border-radius:50%;background:var(--ink);box-shadow:0 0 10px 2px var(--s1);transform:translate(-50%,-50%);animation:packet 1.8s linear infinite}.packet:nth-child(2){animation-delay:-.6s}.packet:nth-child(3){animation-delay:-1.2s}
.broker:before,.broker:after{content:"";position:absolute;inset:-12px;border:1px solid var(--border);border-radius:20px;animation:ripple 2.2s ease-out infinite;pointer-events:none}.broker:after{animation-delay:-1.1s}
.broker-icon{width:42px;height:42px;border:2px solid var(--accent);border-radius:50%;margin:0 auto 9px;display:grid;place-items:center;font-size:21px;animation:spinGlow 4s linear infinite}
.screen .mini-bars{display:flex;justify-content:center;align-items:end;gap:3px;height:28px;margin:8px 0}.mini-bars i{width:5px;background:var(--s1);border-radius:3px;animation:bars 1.1s ease-in-out infinite}.mini-bars i:nth-child(1){height:8px}.mini-bars i:nth-child(2){height:18px;animation-delay:-.3s}.mini-bars i:nth-child(3){height:26px;animation-delay:-.6s}.mini-bars i:nth-child(4){height:13px;animation-delay:-.8s}
footer{text-align:center;color:var(--muted);padding:6px 22px 24px}
@keyframes pulse{0%{box-shadow:0 0 0 0 currentColor}75%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}@keyframes packet{from{left:0}to{left:100%}}@keyframes ripple{0%{opacity:.8;transform:scale(.92)}100%{opacity:0;transform:scale(1.18)}}@keyframes sourceGlow{0%,100%{border-color:var(--border)}50%{border-color:var(--s1)}}@keyframes spinGlow{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}@keyframes bars{50%{height:5px;opacity:.45}}
.lf canvas{display:block;width:100%;border-radius:var(--radius);background:var(--surface2);border:1px solid var(--border)}
.lf-legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:12px;color:var(--muted);align-items:center}.lf-legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}.lf-note{color:var(--muted);margin-left:auto}

.intro{padding:22px;margin:0 0 14px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface2)}
.intro h2{font-size:clamp(20px,2.5vw,27px);margin:5px 0}.intro p{color:var(--muted);margin:4px 0;max-width:820px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:12px 0}
.section-head h2{font-size:18px;margin:0}
.data-note{color:var(--muted);font-size:12px;margin:8px 0 0}
.mini-list{display:grid;gap:8px}.mini-item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--border)}
.mini-item:last-child{border-bottom:0}
.mini-item strong{display:block;overflow-wrap:anywhere}.mini-item small{display:block;color:var(--muted)}
.flow-summary{display:flex;gap:10px;flex-wrap:wrap}.flow-summary .tag{font-size:13px}
.topology{width:100%;height:auto;display:block;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm)}
.topology text{fill:var(--ink);font:12px system-ui,sans-serif}.topology .edge{stroke:var(--s2);opacity:.65;stroke-width:1.8;fill:none}
.topology .node{fill:var(--card);stroke:var(--s1);stroke-width:2}.topology .receiving{stroke:var(--ok);stroke-width:3}
.notice{padding:12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--chip);color:var(--muted);margin:10px 0}
tr:focus-within{background:var(--chip)}
a:focus-visible,button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
@media(max-width:600px){.topology{min-height:220px}.intro{padding:16px}.tabs{width:100%;border-radius:var(--radius-sm)}.tabs button{white-space:nowrap}.mini-item{align-items:flex-start}.flow-summary{display:grid}}
@media(max-width:900px){.kpi,.card,.half{grid-column:span 12}.kpi{grid-column:span 6}.flow-track{grid-template-columns:1fr;gap:10px}.route{height:38px;width:3px;margin:auto;background:linear-gradient(180deg,var(--track),var(--s1),var(--track))}}
@media(max-width:700px){.shell{margin:0;border-radius:0;border-width:0}header,main{padding:14px 12px}.big{font-size:24px;overflow-wrap:anywhere}.head-actions{justify-content:flex-start}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="shell">
<header><div><div class="eyebrow">LIVE MESH STATUS</div><h1><span class="brand">UMC Net</span> Live Dashboard</h1></div><div class="head-actions"><div class="themesw" role="group" aria-label="Theme"><button type="button" data-theme-set="overview" aria-pressed="true">Overview</button><button type="button" data-theme-set="analytics" aria-pressed="false">Analytics</button></div><span class="pill"><i class="dot"></i> Public read-only</span><span id="updated" class="muted" role="status" aria-live="polite">Connecting...</span><a class="admin" href="/admin/">Admin login &rarr;</a></div></header>
<main><nav class="tabs" aria-label="Dashboard views"><button class="active" data-view="overview" aria-current="page">Overview</button><button data-view="discovery">Local discovery</button><button data-view="neighbours">Neighbours</button><button data-view="routes">Observed routes</button><button data-view="repeaters">Repeaters</button><button data-view="network">Network</button><button data-view="traffic">Traffic</button></nav><div id="app" class="empty">Loading live network data...</div></main>
<footer>No controls, credentials, private keys, account details or private locations are published here.</footer>
</div>
<script>
const state={overview:null,network:null,view:'overview',loading:false,lastOK:0,error:''};
const THEMES=['overview','analytics'];
const curTheme=()=>document.documentElement.getAttribute('data-theme')||'overview';
const syncTheme=()=>document.querySelectorAll('[data-theme-set]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.themeSet===curTheme())));
function setTheme(id,keep){if(!THEMES.includes(id))return;document.documentElement.setAttribute('data-theme',id);if(!keep){try{localStorage.setItem('umc-theme',id)}catch(e){}}syncTheme();if(typeof LF!=='undefined'){LF.P=null;if(LF.o)lfLayout(LF.o)}if(state.overview)draw()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-theme-set]');if(b)setTheme(b.dataset.themeSet)});
addEventListener('storage',e=>{if(e.key==='umc-theme'&&e.newValue&&e.newValue!==curTheme())setTheme(e.newValue,true)});
syncTheme();
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString();
const ago=t=>{const n=Math.max(0,Date.now()/1000-Number(t||0));return n<60?Math.floor(n)+'s ago':n<3600?Math.floor(n/60)+'m ago':n<86400?Math.floor(n/3600)+'h ago':Math.floor(n/86400)+'d ago'};
const name=d=>d.label?.label||d.name||String(d.id||'').slice(0,12)||'Repeater';
const online=d=>Number(d.age??(Date.now()/1000-Number(d.last||0)))<900;
const status=d=>online(d)?'<span class="ok"><i class="dot"></i> online</span>':Number(d.age||99999)<3600?'<span class="warn"><i class="dot"></i> quiet</span>':'<span class="bad"><i class="dot"></i> offline</span>';
function kpis(o){const n=state.network||{},nodes=n.nodes||[],links=n.links||[],on=o.devices.filter(online).length;return '<div class="grid"><section class="card kpi"><div class="label">Repeaters online</div><div class="big">'+on+' / '+o.devices.length+'</div></section><section class="card kpi"><div class="label">Nodes discovered</div><div class="big">'+fmt(nodes.length||o.nodes)+'</div></section><section class="card kpi"><div class="label">Observed links</div><div class="big">'+fmt(links.length)+'</div></section><section class="card kpi"><div class="label">Reported packets</div><div class="big">'+fmt(o.totals?.packets)+'</div></section></div>'}
function trafficMode(packets){let up=false,down=false;for(const p of packets){const d=String(p.dir||'').toLowerCase();if(/rx|recv|receive|in|up/.test(d))up=true;if(/tx|send|out|down/.test(d))down=true;if(!d)up=true}return up&&down?'both':down?'reverse':up?'forward':'idle'}
function repeaterTraffic(o,d){const cutoff=Date.now()/1000-30,dn=name(d);const packets=(o.packets||[]).filter(p=>Number(p.t||0)>=cutoff&&(p.dev===d.id||p.dname===dn));return {count:packets.length,mode:trafficMode(packets)}}
function packetDots(){return '<i class="packet"></i><i class="packet"></i><i class="packet"></i>'}
function flow(o){const connected=o.devices.filter(online),broker=o.mqtt?.state==='connected',cutoff=Date.now()/1000-30,recent=(o.packets||[]).filter(p=>Number(p.t||0)>=cutoff),allMode=trafficMode(recent),lanes=connected.length?connected.map(d=>{const a=repeaterTraffic(o,d),label=a.mode==='both'?'RX + TX':a.mode==='reverse'?'TX':a.mode==='forward'?'RX':'IDLE';return '<div class="repeater-lane"><div class="source '+(a.count?'active':'idle')+'"><i></i><span>'+esc(name(d))+'</span><b class="flow-dir">'+label+'</b></div><div class="lane-route '+(a.count?'active ':'')+a.mode+'">'+packetDots()+'</div></div>'}).join(''):'<span class="muted">Waiting for a repeater connection</span>';return '<section class="card wide flow"><div class="flow-title"><h2>Live bidirectional MQTT flow</h2><span class="'+(recent.length?'ok':'muted')+'"><i class="dot"></i> '+(recent.length?recent.length+' recent packet'+(recent.length===1?'':'s'):'Waiting for traffic')+'</span></div><div class="flow-track"><div class="flow-box repeater-bank"><strong>'+connected.length+' connected repeater'+(connected.length===1?'':'s')+'</strong><small>Each lane moves only when that repeater carries data</small><div class="repeater-lanes">'+lanes+'</div></div><div class="flow-box broker"><div class="broker-icon">&#8635;</div><strong>UMC MQTT broker</strong><small>'+esc(o.mqtt?.state||'unknown')+'</small></div><div class="route '+(recent.length?'active ':'')+allMode+'">'+packetDots()+'</div><div class="flow-box screen"><strong>Public dashboard</strong><div class="mini-bars"><i></i><i></i><i></i><i></i></div><small>Read-only live telemetry</small></div></div></section>'}
function card(d){const s=d.settings||{};return '<section class="card"><div class="row"><div><b>'+esc(name(d))+'</b><div>'+status(d)+'</div></div><span class="tag">'+esc(d.area||'-')+'</span></div><p class="muted">'+esc(d.model||'Unknown board')+' &middot; '+esc(d.fw||'Unknown firmware')+'</p><code>'+esc(d.id)+'</code><div class="stats"><div><span class="label">Received</span><b>'+fmt(d.n_rx)+'</b></div><div><span class="label">Sent</span><b>'+fmt(d.n_tx)+'</b></div><div><span class="label">RSSI / SNR</span><b>'+esc(d.rssi??'-')+' / '+esc(d.snr??'-')+'</b></div><div><span class="label">Last data</span><b>'+ago(d.last)+'</b></div><div><span class="label">Radio</span><b>'+esc(s.radio||d.radio||'-')+'</b></div><div><span class="label">TX power</span><b>'+esc(s.tx||'-')+' dBm</b></div></div></section>'}
const NODE_KIND={1:'Person',2:'Repeater',3:'Room server',4:'Sensor'};
const kind=x=>NODE_KIND[Number(x)]||'Node';
const hop=x=>Number(x)===0?'Direct':Number(x)===1?'1 hop':fmt(x)+' hops';
const netName=(n,k)=>((n.nodes||[]).find(x=>x.key===k)||{}).name||String(k||'Unknown').slice(0,12);
const sortedNodes=n=>(n?.nodes||[]).slice().sort((a,b)=>Number(b.last||0)-Number(a.last||0));
const filteredLinks=n=>(n?.links||[]).slice().sort((a,b)=>Number(a.hops||0)-Number(b.hops||0)||Number(b.last||0)-Number(a.last||0));
function panelTitle(label,note){return '<div class="section-head"><h2>'+esc(label)+'</h2><span class="muted">'+esc(note||'')+'</span></div>'}
function repeaterSummary(o){const a=o.devices.slice().sort((a,b)=>Number(b.last||0)-Number(a.last||0)).slice(0,8);return '<div class="mini-list">'+(a.length?a.map(d=>'<div class="mini-item"><div><strong>'+esc(name(d))+'</strong><small>'+esc(d.area||'')+' · last data '+ago(d.last)+'</small></div><span>'+status(d)+'</span></div>').join(''):'<p class="muted">No repeater reports yet.</p>')+'</div>'}
function discoverySummary(n){const a=sortedNodes(n).slice(0,8);return '<div class="mini-list">'+(a.length?a.map(x=>'<div class="mini-item"><div><strong>'+esc(x.name||String(x.key||'').slice(0,12))+'</strong><small>'+kind(x.type)+' · '+ago(x.last)+'</small></div><span class="tag">'+(x.connected?'Connected':'Heard')+'</span></div>').join(''):'<p class="muted">No nodes discovered in the current network window.</p>')+'</div>'}
function linkSummary(n){const a=filteredLinks(n).slice(0,8);return '<div class="mini-list">'+(a.length?a.map(l=>'<div class="mini-item"><div><strong>'+esc(netName(n,l.node))+' → '+esc(netName(n,l.recv))+'</strong><small>'+hop(l.hops)+' · '+fmt(l.n)+' packet observations</small></div><span class="tag">'+ago(l.last)+'</span></div>').join(''):'<p class="muted">No observed links yet.</p>')+'</div>'}
function renderOverview(o){const n=state.network;const intro='<section class="intro"><div class="eyebrow">PUBLIC · READ ONLY · LIVE</div><h2>Explore the local MeshCore network</h2><p>Discover nodes, follow observed radio links and see which repeaters are reporting. Data reflects what the network has actually heard; paths are observations, not guaranteed connections or geographic coverage.</p><div class="flow-summary"><span class="tag">MQTT broker: '+esc(o.mqtt?.state||'unknown')+'</span><span class="tag">Packet reports: '+fmt((o.packets||[]).length)+' in recent feed</span><span class="tag">Network window: '+esc(n?.hours||24)+' hours</span></div></section>';
return intro+kpis(o)+'<div id="lfSlot"></div><div class="grid"><section class="card half">'+panelTitle('Recent local discovery','latest heard')+discoverySummary(n)+'</section><section class="card half">'+panelTitle('Repeaters and connections','last reported')+repeaterSummary(o)+'</section><section class="card wide">'+panelTitle('Observed neighbours','direct and relayed receptions')+linkSummary(n)+'<p class="data-note">An observed link identifies the receiving repeater and the source of a packet. A multi-hop reception is not proof of a direct radio link.</p></section></div>'}
function renderRepeaters(o){return panelTitle('Repeater connections',o.devices.length+' repeaters reporting')+'<div class="grid">'+(o.devices.length?o.devices.map(card).join(''):'<div class="card wide empty">No repeaters have reported yet.</div>')+'</div>'}
function renderDiscovery(n){if(!n)return '<div class="empty">Waiting for network discovery data.</div>';const nodes=sortedNodes(n);return panelTitle('Local discovery',nodes.length+' public nodes heard')+'<section class="card wide scroll"><table><thead><tr><th>Node</th><th>Type</th><th>Connection</th><th>Adverts</th><th>Last heard</th></tr></thead><tbody>'+(nodes.length?nodes.slice(0,250).map(x=>'<tr><td><b>'+esc(x.name||String(x.key||'').slice(0,12))+'</b></td><td>'+kind(x.type)+'</td><td>'+(x.connected?'<span class="ok">Connected repeater</span>':'Observed')+'</td><td>'+fmt(x.adverts)+'</td><td>'+ago(x.last)+'</td></tr>').join(''):'<tr><td colspan="5" class="muted">No discovery adverts in the selected window.</td></tr>')+'</tbody></table><p class="data-note">Only observed public node names and metadata are shown. No locations or private messages are published.</p></section>'}
function renderNeighbours(n){if(!n)return '<div class="empty">Waiting for neighbours.</div>';const links=filteredLinks(n);return panelTitle('Observed neighbours',links.length+' directional observations')+'<section class="card wide scroll"><table><thead><tr><th>Transmitting node</th><th>Heard by repeater</th><th>Hops</th><th>Packet observations</th><th>SNR / RSSI</th><th>Last heard</th></tr></thead><tbody>'+(links.length?links.slice(0,250).map(l=>'<tr><td>'+esc(netName(n,l.node))+'</td><td><b>'+esc(netName(n,l.recv))+'</b></td><td>'+hop(l.hops)+'</td><td>'+fmt(l.n)+'</td><td>'+(Number(l.hops)===0?esc(l.snr??'–')+' / '+esc(l.rssi??'–'):'Relayed')+'</td><td>'+ago(l.last)+'</td></tr>').join(''):'<tr><td colspan="6" class="muted">No observed neighbour links yet.</td></tr>')+'</tbody></table><p class="data-note">Source → receiving repeater. Only zero-hop observations have direct-link signal readings; relayed links are not direct neighbours.</p></section>'}
function renderRoutes(n){if(!n)return '<div class="empty">Waiting for observed routes.</div>';const a=(n.journeys||[]).slice(0,80);const route=j=>{const start=j.from?netName(n,j.from):'Unidentified source',end=j.to?netName(n,j.to):'Unidentified receiver',via=(j.path||[]).map(p=>p.n||'unidentified hop');return [start,...via,end].join(' → ')};return panelTitle('Observed packet routes',a.length+' latest journeys')+'<section class="card wide scroll"><table><thead><tr><th>Seen</th><th>Packet type</th><th>Observed path</th><th>Hops</th><th>SNR</th></tr></thead><tbody>'+(a.length?a.map(j=>'<tr><td>'+ago(j.t)+'</td><td>'+esc(j.type||'–')+'</td><td>'+esc(route(j))+'</td><td>'+hop(j.hops)+'</td><td>'+esc(j.snr??'–')+'</td></tr>').join(''):'<tr><td colspan="5" class="muted">No packet journeys observed yet.</td></tr>')+'</tbody></table><p class="data-note">These routes were reconstructed from received packet metadata, not inferred from a theoretical coverage map. Unknown identities remain anonymous.</p></section>'}
function renderTraffic(o){const p=(o.packets||[]).slice().reverse().slice(0,100),recv=p.filter(x=>/rx|recv|in/i.test(x.dir||'')).length,tx=p.filter(x=>/tx|out/i.test(x.dir||'')).length;return panelTitle('Recent packet reports','last '+p.length+' samples')+'<div class="flow-summary"><span class="tag">Received reports: '+fmt(recv)+'</span><span class="tag">Transmitted reports: '+fmt(tx)+'</span><span class="tag">MQTT: '+esc(o.mqtt?.state||'unknown')+'</span></div><section class="card wide scroll" style="margin-top:14px"><table><thead><tr><th>When</th><th>Repeater</th><th>Direction</th><th>Type</th><th>Hops</th><th>Signal</th></tr></thead><tbody>'+(p.length?p.map(x=>'<tr><td>'+ago(x.t)+'</td><td>'+esc(x.dname||x.dev||'–')+'</td><td>'+esc(x.dir||'–')+'</td><td>'+esc(x.type||'–')+'</td><td>'+hop(x.hops)+'</td><td>'+esc(x.rssi??'–')+' / '+esc(x.snr??'–')+'</td></tr>').join(''):'<tr><td colspan="6" class="muted">No recent traffic observed.</td></tr>')+'</tbody></table><p class="data-note">Counts represent packet reports in the feed, not a regulatory airtime measurement. MQTT housekeeping is not counted as RF traffic.</p></section>'}
function topology(n){const links=filteredLinks(n).slice(0,45),ids=[...new Set(links.flatMap(l=>[l.node,l.recv]))].slice(0,16);if(!ids.length)return '<div class="empty">No observed links to draw yet.</div>';const cx=290,cy=195,rx=218,ry=143,pts={};ids.forEach((id,i)=>{const a=-Math.PI/2+2*Math.PI*i/ids.length;pts[id]={x:cx+Math.cos(a)*rx,y:cy+Math.sin(a)*ry}});const edges=links.filter(l=>pts[l.node]&&pts[l.recv]).map(l=>'<line class="edge" x1="'+pts[l.node].x+'" y1="'+pts[l.node].y+'" x2="'+pts[l.recv].x+'" y2="'+pts[l.recv].y+'" marker-end="url(#arrow)"><title>'+esc(netName(n,l.node))+' heard by '+esc(netName(n,l.recv))+' · '+hop(l.hops)+'</title></line>').join('');const dots=ids.map(id=>{const p=pts[id],x=(n.nodes||[]).find(z=>z.key===id)||{},nm=String(x.name||id.slice(0,8));return '<g><circle class="node '+(x.connected?'receiving':'')+'" cx="'+p.x+'" cy="'+p.y+'" r="10"><title>'+esc(nm)+'</title></circle><text x="'+p.x+'" y="'+(p.y+25)+'" text-anchor="middle">'+esc(nm.length>19?nm.slice(0,18)+'…':nm)+'</text></g>'}).join('');return '<svg class="topology" viewBox="0 0 580 390" role="img" aria-label="Schematic of observed radio receptions, with arrows pointing towards the receiver"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="13" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="var(--s2)" stroke-width="1.5"/></marker></defs>'+edges+dots+'</svg><p class="data-note">Schematic only, not a geographic map. Arrows show who heard whom; a relay may be involved.</p>'}
function renderNetwork(n){if(!n)return '<div class="empty">Waiting for public network data...</div>';return panelTitle('Network connections','observed receptions')+'<div class="grid"><section class="card wide"><h2>Radio link topology</h2>'+topology(n)+'</section><section class="card half"><h2>Recently discovered nodes</h2>'+discoverySummary(n)+'</section><section class="card half"><h2>Observed links</h2>'+linkSummary(n)+'</section></div>'}
function draw(){const app=document.getElementById('app'),o=state.overview;if(!o){app.className='empty';app.textContent='Loading live network data...';return}app.className='';app.innerHTML=({overview:()=>renderOverview(o),discovery:()=>renderDiscovery(state.network),neighbours:()=>renderNeighbours(state.network),routes:()=>renderRoutes(state.network),repeaters:()=>renderRepeaters(o),network:()=>renderNetwork(state.network),traffic:()=>renderTraffic(o)}[state.view]||(()=>renderOverview(o)))();const slot=document.getElementById('lfSlot');if(slot){slot.appendChild(lfElement());lfLayout(o)}}
async function load(){
  if(state.loading)return;
  state.loading=true;
  try{
    const [a,b]=await Promise.all([fetch('/public/api/overview',{cache:'no-store',signal:AbortSignal.timeout(12000)}),fetch('/public/api/network',{cache:'no-store',signal:AbortSignal.timeout(12000)})]);
    if(!a.ok||!b.ok)throw new Error('Public data '+(!a.ok?a.status:b.status));
    const overview=await a.json(),network=await b.json();
    state.overview=overview;state.network=network;state.lastOK=Date.now();state.error='';
    lfIngest(overview);
    document.getElementById('updated').textContent='Live · updated '+new Date().toLocaleTimeString();
    draw();
  }catch(e){
    state.error=e.message;
    document.getElementById('updated').textContent=state.lastOK?'Stale · last updated '+new Date(state.lastOK).toLocaleTimeString():'Network unavailable';
    if(!state.overview){const app=document.getElementById('app');app.className='';app.innerHTML='<div class="notice" role="alert">The public network feed is unavailable. Retrying automatically. '+esc(e.message)+'</div>';}
  }finally{state.loading=false;}
}
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('[data-view]').forEach(x=>{x.classList.toggle('active',x===b);if(x===b)x.setAttribute('aria-current','page');else x.removeAttribute('aria-current')});
  state.view=b.dataset.view;draw();
}));
load();setInterval(load,5000);
// ---------------------------------------------------------------- live data flow (canvas)
// Every particle is a real packet: heard by a repeater on the radio, published to the broker, then handed by the bridge to
// every other repeater (which transmits it: the ripple), and to the dashboards; messages and adverts also go to the apps topic.
const LF = {el: null, cv: null, ctx: null, parts: [], ripples: [], seen: new Set(), queue: [], pos: {}, rep: [], w: 0, h: 0, dpr: 1,
  o: null, P: null, last: 0, count: {up: 0, down: 0, out: 0}, pulse: 0, first: true, reduced: matchMedia("(prefers-reduced-motion: reduce)").matches};
// The canvas cannot use var(): the palette is read from the CSS variables (the active theme) and again whenever the theme changes.
function lfPal() {
  const cs = getComputedStyle(document.documentElement), g = k => cs.getPropertyValue("--" + k).trim(), s = []; for (let i = 1; i <= 12 && g("s" + i); i++) s.push(g("s" + i));
  return {s, ink: g("ink"), muted: g("muted"), accent: g("accent"), card: g("card"), surface2: g("surface2"), c: i => s[i % s.length]};
}
const lfP = () => LF.P || (LF.P = lfPal());
const al = (hex, a) => hex + (hex.length === 7 ? Math.round(a * 255).toString(16).padStart(2, "0") : "");
const LF_TYPE = {ADVERT: 0, GRP_TXT: 1, TXT_MSG: 2, ACK: 3, PATH: 4, REQ: 5, RESPONSE: 5, TRACE: 6};
const lfCol = t => { const k = LF_TYPE[String(t || "").toUpperCase()]; return k == null ? lfP().muted : lfP().c(k); };
function lfElement() {
  if (LF.el) return LF.el;
  const w = document.createElement("section"); w.className = "card wide lf";
  w.innerHTML = '<div class="flow-title"><h2>Live data flow, both ways</h2><span id="lfStat" class="muted">waiting for packets</span></div>' +
    '<canvas id="lfCanvas" aria-label="Animated map of packets moving between the repeaters, the broker, the dashboards and apps"></canvas>' +
    '<div class="lf-legend"><span><i style="background:var(--s1)"></i>advert</span><span><i style="background:var(--s2)"></i>channel message</span><span><i style="background:var(--s3)"></i>direct message</span><span><i style="background:var(--s4)"></i>ack</span><span><i style="background:var(--s5)"></i>path</span><span><i style="background:var(--muted)"></i>other</span>' +
    '<span class="lf-note">observed RX → broker → dashboard; observed TX = outward ripple. No unconfirmed retransmissions are animated</span></div>';
  LF.el = w; LF.cv = w.querySelector("canvas"); LF.ctx = LF.cv.getContext("2d");
  addEventListener("resize", () => lfLayout(LF.o)); requestAnimationFrame(lfTick);
  return w;
}
function lfLayout(o) {
  if (!LF.cv || !o) return;
  const reps = o.devices.filter(online), n = Math.max(1, reps.length);
  LF.cv.style.width = "100%"; const W = LF.cv.clientWidth || 900, H = Math.min(760, 360 + Math.max(0, n - 2) * 60);
  LF.dpr = devicePixelRatio || 1; LF.cv.width = W * LF.dpr; LF.cv.height = H * LF.dpr; LF.cv.style.width = W + "px"; LF.cv.style.height = H + "px";
  LF.ctx.setTransform(LF.dpr, 0, 0, LF.dpr, 0, 0); LF.w = W; LF.h = H;
  const bx = W * 0.5, by = H * 0.5; LF.pos = {broker: {x: bx, y: by, label: "UMC MQTT broker"}};
  // repeaters on an arc around the left of the broker; the arc widens as more join
  const Rx = W * 0.36, Ry = H * 0.40, span = Math.min(Math.PI * 1.1, 0.7 + n * 0.38), a0 = Math.PI - span / 2;
  LF.rep = reps.map((d, i) => { const a = n === 1 ? Math.PI : a0 + span * i / (n - 1); const p = {x: bx + Math.cos(a) * Rx, y: by + Math.sin(a) * Ry, label: name(d), d}; LF.pos["r:" + d.id] = p; return p; });
  LF.pos.dash = {x: W * 0.88, y: H * 0.32, label: "Dashboards", sub: "admin + this page"};
  LF.pos.apps = {x: W * 0.88, y: H * 0.68, label: "Apps", sub: "delivery not confirmed"};
}
function lfIngest(o) {
  const first = !LF.o; LF.o = o; lfLayout(o);
  const now = Date.now() / 1000, pk = (o.packets || []).filter(p => Number(p.t || 0) > 0);
  const maxT = pk.reduce((m, p) => Math.max(m, Number(p.t)), 0) || now;
  for (const p of pk) {
    const id = [p.t, p.dev, p.len, p.type, p.dir].join("|");
    if (LF.seen.has(id)) continue; LF.seen.add(id);
    if (first && maxT - Number(p.t) > 20) continue;                               // on opening, replay only the last 20 s
    const delay = Math.max(0, Math.min(10, Number(p.t) - (maxT - 10))) * 1000;    // replay with the packets' real spacing
    LF.queue.push({at: performance.now() + delay, p});
  }
  if (LF.seen.size > 3000) LF.seen = new Set([...LF.seen].slice(-1500));
  const up = reps => reps.reduce((s, d) => s + (Number(d.pm) || 0), 0);
  const on = o.devices.filter(online);
  const down = on.reduce((s, d) => s + (Number(d.bridge?.passed_pm) || 0), 0);
  const st = document.getElementById("lfStat");
  if (st) st.textContent = `${on.length} repeater${on.length === 1 ? "" : "s"} · heard ${up(on).toFixed(1)}/min · bridged back out ${down.toFixed(1)}/min`;
}
function lfSpawn(from, to, col, size, bend, after) { if (from && to) LF.parts.push({from, to, col, size, bend, t0: performance.now(), dur: 900 + Math.hypot(to.x - from.x, to.y - from.y) * 2.1, after}); }
function lfRipple(at, col, out) { if (at) LF.ripples.push({at, col, out, t0: performance.now()}); }
function lfPacket(p) {
  // Animate only observed RX/TX reports; never invent a retransmission or use
  // a random drop rate to imply a repeater transmitted a packet.
  const o = LF.o; if (!o) return;
  const src = LF.pos["r:" + p.dev] || LF.rep.find(r => r.label === p.dname); if (!src) return;
  const col = lfCol(p.type), dir = String(p.dir || "rx").toLowerCase();
  if (/tx|out/.test(dir)) { lfRipple(src, col, true); LF.count.down++; return; }
  lfRipple(src, col, false); LF.count.up++;
  lfSpawn(src, LF.pos.broker, col, 3.4, -18, () => {
    LF.pulse = performance.now();
    // The public dashboard received this broker report; app delivery and other
    // repeater transmissions are not implied unless separately observed.
    lfSpawn(LF.pos.broker, LF.pos.dash, col, 2.6, -10);
  });
}
function lfQuad(a, b, bend, t) {
  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2, dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy) || 1;
  const cx = mx - dy / L * bend, cy = my + dx / L * bend, u = 1 - t;
  return {x: u * u * a.x + 2 * u * t * cx + t * t * b.x, y: u * u * a.y + 2 * u * t * cy + t * t * b.y, cx, cy};

function lfNode(p, kind, now) {
  const c = LF.ctx, glow = kind === "broker" ? (now - LF.pulse < 500 ? 1 - (now - LF.pulse) / 500 : 0) : 0;
  c.save();
  if (kind === "broker") {
    const P = lfP(); c.shadowColor = P.accent; c.shadowBlur = 14 + glow * 24; c.lineWidth = 2.5; c.strokeStyle = P.accent; c.fillStyle = P.surface2;
    c.beginPath(); for (let i = 0; i < 6; i++) { const a = Math.PI / 6 + i * Math.PI / 3; c.lineTo(p.x + Math.cos(a) * 52, p.y + Math.sin(a) * 52); } c.closePath(); c.fill(); c.stroke();
    c.save(); c.translate(p.x, p.y); c.rotate(now / 2400); c.setLineDash([6, 10]); c.lineWidth = 2; c.strokeStyle = al(P.c(2), .55); c.beginPath(); c.arc(0, 0, 66 + glow * 6, 0, Math.PI * 2); c.stroke(); c.rotate(-now / 1200); c.strokeStyle = al(P.c(0), .35); c.beginPath(); c.arc(0, 0, 78, 0, Math.PI * 2); c.stroke(); c.restore();
    c.shadowBlur = 0; c.fillStyle = P.ink; c.font = "700 13px Inter,system-ui,sans-serif"; c.textAlign = "center"; c.fillText("UMC MQTT", p.x, p.y - 4); c.fillText("broker", p.x, p.y + 12);
    c.font = "11px Inter,system-ui,sans-serif"; c.fillStyle = P.muted; c.fillText(LF.o?.mqtt?.state || "", p.x, p.y + 28);
  } else {
    const w = Math.max(118, c.measureText ? 0 : 0), P = lfP(), col = kind === "rep" ? P.c(0) : P.c(2);
    const sub2 = kind === "rep" ? `↑ heard ${(Number(p.d.pm) || 0).toFixed(1)}/min   ↓ sent ${(Number((p.d.bridge || {}).passed_pm) || 0).toFixed(1)}/min` : (p.sub || "");
    c.font = "10.5px Inter,system-ui,sans-serif"; const sw = c.measureText(sub2).width;
    c.font = "700 12.5px Inter,system-ui,sans-serif"; const tw = Math.max(110, c.measureText(p.label).width + 26, sw + 22), h = sub2 ? 44 : 30;
    c.shadowColor = col; c.shadowBlur = 8; c.lineWidth = 2; c.strokeStyle = col; c.fillStyle = P.card;
    c.beginPath(); c.roundRect ? c.roundRect(p.x - tw / 2, p.y - h / 2, tw, h, 10) : c.rect(p.x - tw / 2, p.y - h / 2, tw, h); c.fill(); c.stroke();
    c.shadowBlur = 0; c.textAlign = "center"; c.fillStyle = P.ink; c.fillText(p.label, p.x, p.y - (h > 30 ? 4 : -4));
    c.font = "10.5px Inter,system-ui,sans-serif"; c.fillStyle = P.muted;
    if (sub2) c.fillText(sub2, p.x, p.y + 13);
  }
  c.restore();
}
function lfTick(now) {
  requestAnimationFrame(lfTick);
  if (!LF.cv || !LF.cv.isConnected || !LF.o) return;
  while (LF.queue.length && LF.queue[0].at <= now) lfPacket(LF.queue.shift().p);
  LF.queue.sort((a, b) => a.at - b.at);
  const c = LF.ctx, W = LF.w, H = LF.h; c.clearRect(0, 0, W, H);
  // the links: a lane each way between every repeater and the broker, and out to the dashboards and apps
  const busy = new Map(); for (const p of LF.parts) busy.set(p.from.label + ">" + p.to.label, (busy.get(p.from.label + ">" + p.to.label) || 0) + 1);
  const lane = (a, b, bend, col) => { const m = lfQuad(a, b, bend, .5), k = Math.min(3, busy.get(a.label + ">" + b.label) || 0); c.beginPath(); c.moveTo(a.x, a.y); c.quadraticCurveTo(m.cx, m.cy, b.x, b.y); c.strokeStyle = col; c.lineWidth = 1.4 + k * 1.1; c.shadowColor = col; c.shadowBlur = k * 8; c.stroke(); c.shadowBlur = 0; };

  lane(LF.pos.broker, LF.pos.dash, -10, al(lfP().c(2), .3)); lane(LF.pos.broker, LF.pos.apps, 10, al(lfP().c(2), .3));
  c.restore();
  // ripples: heard on the radio (inward, magenta) and sent out on the radio (outward, cyan / packet colour)
  LF.ripples = LF.ripples.filter(r => now - r.t0 < 1400);
  for (const r of LF.ripples) { const k = (now - r.t0) / 1400; c.beginPath(); c.arc(r.at.x, r.at.y, r.out ? 26 + k * 46 : 70 - k * 44, 0, Math.PI * 2); c.strokeStyle = r.col; c.globalAlpha = (1 - k) * .8; c.lineWidth = r.out ? 2.2 : 1.6; c.stroke(); c.globalAlpha = 1; }

    c.restore();
  }

  for (const r of LF.rep) lfNode(r, "rep", now);
  lfNode(LF.pos.broker, "broker", now); lfNode(LF.pos.dash, "out", now); lfNode(LF.pos.apps, "out", now);
}
