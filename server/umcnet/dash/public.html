<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UMC Net Public Viewer</title>
<style>
:root{color-scheme:dark;--bg:#07110c;--card:#0d1c14;--line:#1b3929;--green:#39df7c;--muted:#91a99a;--amber:#f3c45c;--red:#ff8585}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 75% -20%,#17482d 0,transparent 40%),var(--bg);color:#edf8f1;font:14px/1.45 Inter,system-ui,sans-serif}header,main{max-width:1280px;margin:auto;padding:20px}header{display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:clamp(24px,4vw,40px);margin:0;letter-spacing:-.04em}.brand{color:var(--green)}.pill,.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:4px 9px;color:var(--muted)}.pill{color:var(--green);background:#10271a}.tabs{display:flex;gap:8px;overflow:auto;margin:5px 0 18px}.tabs button{border:1px solid var(--line);background:#0a1710;color:var(--muted);padding:8px 14px;border-radius:999px;cursor:pointer}.tabs button.on{background:var(--green);color:#05210f;border-color:var(--green);font-weight:700}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}.card{grid-column:span 4;background:linear-gradient(150deg,#102319,#0a1710);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}.wide{grid-column:span 12}.half{grid-column:span 6}.kpis .card{grid-column:span 3}.big{font-size:28px;font-weight:750}.muted{color:var(--muted)}.ok{color:var(--green)}.warn{color:var(--amber)}.bad{color:var(--red)}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px}.stats div{background:#08130d;border-radius:9px;padding:9px}.stats b{display:block;font-size:16px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid #173023;vertical-align:top}th{color:var(--muted);font-weight:500}.scroll{overflow:auto}code{font-size:11px;color:#b8d7c3}.empty{padding:32px;text-align:center;color:var(--muted)}footer{padding:26px;text-align:center;color:var(--muted)}@media(max-width:800px){header{align-items:flex-start;flex-direction:column}.card,.half,.kpis .card{grid-column:span 12}.wide{grid-column:span 12}main,header{padding:14px}.hide-mobile{display:none}}
</style></head><body>
<header><div><div class="muted">LIVE MESH STATUS</div><h1><span class="brand">UMC Net</span> Public Viewer</h1></div><div><span class="pill">Read-only</span> <span id="stamp" class="muted">Connecting…</span></div></header>
<main><nav class="tabs" aria-label="Views"><button class="on" data-tab="overview">Overview</button><button data-tab="repeaters">Repeaters</button><button data-tab="network">Network</button><button data-tab="traffic">Traffic</button></nav><div id="app"><div class="empty">Loading live network data…</div></div></main>
<footer>No controls, credentials, private keys, account details or private locations are published here.</footer>
<script>
const S={o:null,n:null,tab:"overview"},$=s=>document.querySelector(s),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),ago=s=>{const n=Math.max(0,Date.now()/1000-s);return n<60?Math.floor(n)+"s ago":n<3600?Math.floor(n/60)+"m ago":n<86400?Math.floor(n/3600)+"h ago":Math.floor(n/86400)+"d ago"},fmt=n=>Number(n||0).toLocaleString(),dot=d=>d.age<900?'<span class="ok">● online</span>':d.age<3600?'<span class="warn">● quiet</span>':'<span class="bad">● offline</span>';
function kpis(o){const online=o.devices.filter(d=>d.age<900).length;return `<div class="grid kpis"><section class="card"><div class="muted">Repeaters online</div><div class="big">${online} / ${o.devices.length}</div></section><section class="card"><div class="muted">Packets seen</div><div class="big">${fmt(o.totals?.packets)}</div></section><section class="card"><div class="muted">Known nodes</div><div class="big">${fmt(o.nodes)}</div></section><section class="card"><div class="muted">Broker link</div><div class="big ${o.mqtt?.state==='connected'?'ok':'warn'}">${esc(o.mqtt?.state||'unknown')}</div></section></div>`}
function repeater(d){const s=d.settings||{};return `<section class="card"><div class="row"><div><b>${esc(d.label?.label||d.name||d.id.slice(0,12))}</b><div>${dot(d)}</div></div><span class="tag">${esc(d.area||'—')}</span></div><p class="muted">${esc(d.model||'Unknown board')} · ${esc(d.fw||'Unknown firmware')}<br><code>${esc(d.id)}</code></p><div class="stats"><div><span class="muted">Received</span><b>${fmt(d.n_rx)}</b></div><div><span class="muted">Sent</span><b>${fmt(d.n_tx)}</b></div><div><span class="muted">RSSI / SNR</span><b>${esc(d.rssi??'—')} / ${esc(d.snr??'—')}</b></div><div><span class="muted">Last data</span><b>${ago(d.last)}</b></div><div><span class="muted">Radio</span><b>${esc(s.radio||d.radio||'—')}</b></div><div><span class="muted">TX power</span><b>${esc(s.tx||'—')} dBm</b></div></div></section>`}
function overview(o){return kpis(o)+`<div class="grid" style="margin-top:12px">${o.devices.map(repeater).join('')||'<div class="card wide empty">No repeaters have reported yet.</div>'}</div>`}
function repeaters(o){return `<div class="grid">${o.devices.map(repeater).join('')||'<div class="card wide empty">No repeaters have reported yet.</div>'}</div>`}
function network(){const n=S.n||{nodes:[],links:[],journeys:[]};const names=Object.fromEntries(n.nodes.map(x=>[x.key,x.name]));const rows=n.nodes.map(x=>`<tr><td><b>${esc(x.name||x.key?.slice(0,12))}</b><br><code>${esc(x.key||'')}</code></td><td>${esc(x.type??'—')}</td><td>${x.connected?'<span class="ok">connected</span>':'heard'}</td><td>${x.last?ago(x.last):'—'}</td></tr>`);const links=n.links.map(x=>`<tr><td>${esc(names[x.recv]||x.recv?.slice(0,12)||'—')}</td><td>heard</td><td>${esc(names[x.node]||x.node?.slice(0,12)||'—')}</td><td>${esc(x.n??'—')} · ${esc(x.hops??'—')} hop(s)</td></tr>`);return `<div class="grid"><section class="card half"><h2>Known nodes</h2><div class="scroll"><table><thead><tr><th>Node</th><th>Type</th><th>Status</th><th>Last seen</th></tr></thead><tbody>${rows.join('')}</tbody></table></div>${rows.length?'':'<div class="empty">No node adverts yet.</div>'}</section><section class="card half"><h2>Observed links</h2><div class="scroll"><table><thead><tr><th>Repeater</th><th></th><th>Node</th><th>Evidence</th></tr></thead><tbody>${links.join('')}</tbody></table></div>${links.length?'':'<div class="empty">No links observed yet.</div>'}</section></div>`}
function traffic(o){const p=o.packets||[];const rows=p.map(x=>`<tr><td>${x.t?new Date(x.t*1000).toLocaleTimeString():'—'}</td><td>${esc(x.type||'—')}</td><td>${esc(x.name||x.src||'—')}</td><td>${esc(x.dname||x.dev?.slice(0,12)||'—')}</td><td>${esc(x.hops??'—')}</td><td>${esc(x.rssi??'—')} / ${esc(x.snr??'—')}</td></tr>`);return `<section class="card wide"><h2>Recent mesh traffic</h2><div class="scroll"><table><thead><tr><th>Time</th><th>Type</th><th>From</th><th>Heard by</th><th>Hops</th><th>RSSI / SNR</th></tr></thead><tbody>${rows.join('')}</tbody></table></div>${rows.length?'':'<div class="empty">No public traffic details available yet.</div>'}</section>`}
function draw(){if(!S.o)return;$('#app').innerHTML=S.tab==='overview'?overview(S.o):S.tab==='repeaters'?repeaters(S.o):S.tab==='network'?network():traffic(S.o)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;S.tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on',x===b));draw()});
async function load(){try{const [o,n]=await Promise.all([fetch('/public/api/overview').then(r=>r.json()),fetch('/public/api/network').then(r=>r.json())]);S.o=o;S.n=n;$('#stamp').textContent='Updated '+new Date().toLocaleTimeString();draw()}catch(e){$('#stamp').textContent='Temporarily unavailable';$('#app').innerHTML='<div class="empty">The live viewer could not reach the network service. It will retry automatically.</div>'}}
load();setInterval(load,5000);
</script></body></html>
