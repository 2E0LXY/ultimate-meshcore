# UMC Net broker. Its own config, user, data and service: it shares nothing with the other
# services on this server. Only Caddy (TLS) sits in front of it.
per_listener_settings true

# MQTT over WebSockets on loopback; Caddy terminates TLS and proxies wss://net.<domain>/mqtt here.
listener 9101 127.0.0.1
protocol websockets
allow_anonymous false
password_file /opt/umcnet/passwd
acl_file /opt/umcnet/acl

# Plain MQTT on loopback only, for admin tools and tests on this server.
listener 1884 127.0.0.1
protocol mqtt
allow_anonymous false
password_file /opt/umcnet/passwd
acl_file /opt/umcnet/acl

persistence true
persistence_location /var/lib/umcnet/
autosave_interval 300

log_dest stderr
log_type error
log_type warning
log_type notice
connection_messages true

# Small VPS, small packets: a LoRa packet is at most 255 bytes.
max_connections 300
message_size_limit 4096
max_queued_messages 100
max_inflight_messages 10
max_keepalive 300
persistent_client_expiration 7d
