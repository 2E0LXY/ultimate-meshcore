# UMC presence: Wi-Fi CSI (ESPectre) is the primary detector. PIR and mmWave are optional add-on packages.
# Needs ESPHome 2026.11 or later (built-in `espectre` component) and a 2.4 GHz 802.11n access point.
# Board files (heltec-v3.yaml, heltec-v4.yaml) set the substitutions below and include this file.

substitutions:
  name: umc-presence
  friendly_name: UMC Presence
  flash_size: 8MB

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-s3-devkitc-1       # Heltec V3 and V4 are both ESP32-S3; the generic board definition is enough
  variant: esp32s3
  flash_size: ${flash_size}
  framework:
    type: esp-idf

logger:
api:
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${name}-fallback
captive_portal:

# ---------------------------------------------------------------- the three detectors feed these
globals:
  - {id: have_pir,   type: bool, initial_value: "false"}     # set true by addon-pir.yaml
  - {id: have_mmw,   type: bool, initial_value: "false"}     # set true by addon-mmwave-ld2410.yaml
  - {id: vote_pir,   type: bool, initial_value: "false"}
  - {id: vote_mmw,   type: bool, initial_value: "false"}

# ---------------------------------------------------------------- 1. Wi-Fi CSI (default, no extra hardware)
espectre:
  detection_algorithm: lightweight      # calibrates at start: keep the room still for a few seconds after boot

sensor:
  - platform: espectre
    movement:
      name: "Wi-Fi Movement Score"
binary_sensor:
  - platform: espectre
    motion:
      id: csi_motion
      name: "Wi-Fi Motion"
    calibrating:
      id: csi_calibrating
      name: "Wi-Fi Calibrating"
  # ---------------------------------------------------------------- fusion: what automations should use
  - platform: template
    id: presence
    name: "Presence"
    device_class: occupancy
    lambda: |-
      auto mode = id(presence_mode).state;
      bool csi_ok = id(wifi_sensing).state && !id(csi_calibrating).state;   // Wi-Fi sensing running and calibrated
      int n = 0, on = 0;
      if (csi_ok)      { n++; if (id(csi_motion).state) on++; }
      if (id(have_pir)) { n++; if (id(vote_pir)) on++; }
      if (id(have_mmw)) { n++; if (id(vote_mmw)) on++; }
      if (mode == "Add-ons only") {
        n = on = 0;
        if (id(have_pir)) { n++; if (id(vote_pir)) on++; }
        if (id(have_mmw)) { n++; if (id(vote_mmw)) on++; }
        return on > 0;
      }
      if (mode == "Wi-Fi only" && csi_ok) return id(csi_motion).state;   // add-ons are used only if Wi-Fi sensing is off
      if (mode == "Confirmed (2 of 3)" && n >= 2) return on >= 2;
      return on > 0;                                                    // "Any detector" (default); with nothing fitted this is just Wi-Fi
    filters:
      - delayed_off: 30s          # hold the state: a still person is not seen by PIR, and CSI sees little of a motionless one

select:
  - platform: template
    id: presence_mode
    name: "Presence Mode"
    optimistic: true
    restore_value: true
    options: ["Any detector", "Wi-Fi only", "Confirmed (2 of 3)", "Add-ons only"]
    initial_option: "Any detector"

switch:
  - platform: espectre
    sensing:
      id: wifi_sensing
      name: "Wi-Fi Sensing"      # turn off to run on PIR / mmWave alone; Presence falls back to them automatically
