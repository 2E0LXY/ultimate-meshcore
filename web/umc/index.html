<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Ultimate MeshCore</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1b1f24;--muted:#626b75;--line:#dde1e6;--acc:#0b6bcb;--acc-ink:#fff;--ok:#1a7f37;--warn:#9a6700;--bad:#cf222e;--chip:#eef1f4;--code:#0f1419;--code-ink:#d6dde6;--r:10px}
@media (prefers-color-scheme:dark){:root{--bg:#0f1216;--card:#171b21;--ink:#e6e9ed;--muted:#98a2ad;--line:#2a313a;--acc:#4c9aff;--acc-ink:#07121f;--ok:#3fb950;--warn:#d29922;--bad:#f85149;--chip:#222831;--code:#0a0d10;--code-ink:#c9d1d9}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
a{color:var(--acc)}button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
#app{display:flex;min-height:100vh}
nav{width:220px;flex:none;background:var(--card);border-right:1px solid var(--line);padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto}
nav .brand{font-weight:700;font-size:15px;padding:4px 10px 12px}nav .brand small{display:block;font-weight:400;color:var(--muted);font-size:12px}
nav button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--ink)}
nav button:hover{background:var(--chip)}nav button.on{background:var(--acc);color:var(--acc-ink)}
nav .ico{width:18px;text-align:center}
main{flex:1;min-width:0;padding:18px 22px 60px;max-width:1100px}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
header.top h1{font-size:20px;margin:0;flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:99px;background:var(--chip);color:var(--muted);font-size:12px;white-space:nowrap}
.pill.ok{color:var(--ok)}.pill.bad{color:var(--bad)}.pill.warn{color:var(--warn)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 4px}.card .sub{color:var(--muted);margin:0 0 12px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.stat{background:var(--chip);border-radius:8px;padding:10px}.stat b{display:block;font-size:18px}.stat span{color:var(--muted);font-size:12px}
.field{display:grid;grid-template-columns:minmax(160px,240px) 1fr auto;gap:8px 12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.field:first-of-type{border-top:0}
.field label{font-weight:600}.field .help{grid-column:1/-1;color:var(--muted);font-size:12px;margin-top:-4px}
.field .ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
input[type=text],input[type=password],input[type=number],select,textarea{width:100%;max-width:420px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:-1px}
.dirty input,.dirty select,.dirty textarea{border-color:var(--warn)}
.btn{border:1px solid var(--line);background:var(--card);padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--acc)}.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}.btn.sm{padding:4px 9px;font-size:12px}.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.switch{position:relative;width:42px;height:24px;flex:none}.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:.15s;cursor:pointer}
.switch span:before{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;background:#fff;border-radius:50%;transition:.15s}
.switch input:checked+span{background:var(--acc)}.switch input:checked+span:before{transform:translateX(18px)}
.val{color:var(--muted);font-size:12px;word-break:break-all}
.msg{font-size:12px}.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
pre,.term{background:var(--code);color:var(--code-ink);border-radius:8px;padding:10px;overflow:auto;font:12px/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-word}
.term{height:340px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:6px 8px;border-top:1px solid var(--line);font-size:13px}th{color:var(--muted);font-weight:600;border-top:0}
.toast{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:50}
.toast div{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);padding:9px 12px;border-radius:8px;box-shadow:0 4px 18px #0003;max-width:360px}
.toast .bad{border-left-color:var(--bad)}.toast .ok{border-left-color:var(--ok)}
.overlay{position:fixed;inset:0;background:var(--bg);z-index:40;overflow:auto;padding:24px 16px}
.panel{max-width:560px;margin:5vh auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
.panel h1{margin:0 0 6px;font-size:22px}.panel p{color:var(--muted)}
.steps{display:flex;gap:4px;margin:10px 0 18px}.steps i{flex:1;height:4px;border-radius:4px;background:var(--line)}.steps i.on{background:var(--acc)}
.stack>*{margin-bottom:12px}.stack label{display:block;font-weight:600;margin-bottom:4px}
.list{border:1px solid var(--line);border-radius:8px;max-height:220px;overflow:auto}
.list button{display:flex;justify-content:space-between;width:100%;border:0;border-top:1px solid var(--line);background:none;padding:8px 10px;cursor:pointer;text-align:left}
.list button:first-child{border-top:0}.list button:hover{background:var(--chip)}
.warnbox{border:1px solid var(--warn);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:12px}
.progress{height:8px;background:var(--line);border-radius:8px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
#menuBtn{display:none}
@media (max-width:820px){#app{display:block}nav{position:fixed;left:0;top:0;z-index:30;transform:translateX(-100%);transition:.2s;box-shadow:0 0 30px #0005}nav.open{transform:none}#menuBtn{display:inline-block}main{padding:14px 16px 60px}.field{grid-template-columns:1fr}.field .act{justify-self:start}}
</style>
</head>
<body>
<div id="login" class="overlay hidden"><div class="panel stack">
  <h1>Ultimate MeshCore</h1><p id="loginInfo">Sign in with the admin password.</p>
  <div><label for="pw">Admin password</label><input id="pw" type="password" autocomplete="current-password"></div>
  <div class="row"><button class="btn pri" id="loginBtn">Sign in</button><span id="loginMsg" class="msg bad"></span></div>
</div></div>

<div id="wizard" class="overlay hidden"><div class="panel"><div id="wiz"></div></div></div>

<div id="app" class="hidden">
  <nav id="nav"><div class="brand">Ultimate MeshCore<small id="navSub"></small></div><div id="navItems"></div></nav>
  <main>
    <header class="top">
      <button class="btn" id="menuBtn" aria-label="Menu">☰</button>
      <h1 id="title">Dashboard</h1>
      <span class="pill" id="pillNet"></span><span class="pill" id="pillRole"></span>
      <button class="btn sm" id="logoutBtn">Sign out</button>
    </header>
    <div id="view"></div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script data-dev-only src="mock.js"></script>
<script>
"use strict";
// ================================================================ API
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let TOKEN = sessionStorage.getItem("umc_token") || "";
let cliQueue = Promise.resolve();
let INFO = null;

async function http(method, url, body, headers = {}) {
  if (window.UMC_MOCK) return window.UMC_MOCK(method, url, body);
  const h = Object.assign({}, headers);
  if (TOKEN) h["X-Auth-Token"] = TOKEN;
  let r;
  // The device serves only a few sockets; a dropped keep-alive connection surfaces as a
  // network error, so retry a couple of times before declaring the device unreachable.
  for (let attempt = 0; ; attempt++) {
    try { r = await fetch(url, {method, headers: h, body, cache: "no-store"}); break; }
    catch (err) {
      if (attempt < 2 && method === "GET" || attempt < 2 && url === "/api/cli") { await new Promise(res => setTimeout(res, 600 + attempt * 900)); continue; }
      showOffline(); throw new Error("Lost connection to the device");
    }
  }
  const txt = await r.text();
  let data; try { data = JSON.parse(txt); } catch { data = {error: txt || r.statusText}; }
  if (r.status === 401 && url !== "/api/login") { TOKEN = ""; sessionStorage.removeItem("umc_token"); showLogin(); }
  if (!r.ok) throw new Error((data && data.error) || r.statusText);
  return data;
}
const api = {
  info: () => http("GET", "/api/info"),
  login: pw => http("POST", "/api/login", pw),
  logout: () => http("POST", "/api/logout", ""),
  scan: refresh => http("GET", "/api/scan" + (refresh ? "?refresh=1" : "")),
  routes: () => http("GET", "/api/routes"),
  traffic: () => http("GET", "/api/traffic"),
  // CLI batches are serialised: one request in flight at a time keeps the device's socket pool free.
  cli: cmds => {
    const run = async () => {
      const list = Array.isArray(cmds) ? cmds : [cmds];
      const out = [];
      for (let i = 0; i < list.length; i += 16) out.push(...await http("POST", "/api/cli", list.slice(i, i + 16).join("\n")));
      return out;
    };
    const p = cliQueue.then(run, run);
    cliQueue = p.catch(() => {});
    return p;
  },
};
const one = async c => (await api.cli([c]))[0] || "";
const val = r => String(r ?? "").replace(/^\s*>\s?/, "").trim();
const isErr = r => /^\s*(err|error|\?\?|unknown|invalid|bad )/i.test(String(r ?? ""));

// Shown when the browser can't reach the device: rebooting, or it moved from the hotspot to home WiFi.
let offlineTimer = null;
function showOffline() {
  if (offlineTimer || window.UMC_MOCK) return;
  const net = (INFO && INFO.net) || {}, sta = net.sta || {};
  const links = [];
  if (sta.ip && location.hostname !== sta.ip) links.push(`http://${sta.ip}/`);
  if (net.hostname && location.hostname !== net.hostname + ".local") links.push(`http://${net.hostname}.local/`);
  const box = document.createElement("div");
  box.className = "overlay"; box.id = "offline";
  box.innerHTML = `<div class="panel"><h1>Device not reachable</h1>
    <p>It may be rebooting (e.g. after an update), or it has left the setup hotspot and joined your home WiFi.</p>
    ${links.length ? `<p>Reconnect this ${/Mobi/.test(navigator.userAgent) ? "phone" : "computer"} to your home WiFi, then open:</p>${links.map(l => `<pre><a href="${esc(l)}">${esc(l)}</a></pre>`).join("")}` : ""}
    <p class="val" id="offlineRetry">Retrying automatically…</p></div>`;
  document.body.appendChild(box);
  let tries = 0;
  offlineTimer = setInterval(async () => {
    tries++; $("#offlineRetry").textContent = `Retrying automatically… (${tries})`;
    try { const r = await fetch("/api/info", {cache: "no-store"}); if (r.ok) location.reload(); } catch {}
  }, 4000);
}

function toast(text, kind = "") {
  const d = document.createElement("div"); d.className = kind; d.textContent = text;
  $("#toast").appendChild(d); setTimeout(() => d.remove(), kind === "bad" ? 7000 : 3500);
}
function has(f) { return !f || (INFO && INFO.features.includes(f)); }
function roleOk(roles) { return !roles || (INFO && roles.includes(INFO.role)); }
const RS = ["repeater", "room_server"];
const CL = ["companion"];

// ================================================================ presets / constants
const PRESETS = [
  ["EU/UK (Narrow)", 869.618, 62.5, 8, 5], ["EU/UK (Medium Range)", 869.525, 250, 10, 5], ["EU/UK (Long Range)", 869.525, 250, 11, 5],
  ["Switzerland", 869.618, 62.5, 8, 5], ["Czech Republic", 869.432, 62.5, 7, 5], ["Portugal 869", 869.618, 62.5, 7, 5],
  ["Portugal 433", 433.375, 62.5, 9, 5], ["EU 433MHz", 433.65, 250, 11, 5], ["USA/Canada", 910.525, 62.5, 7, 5],
  ["USA Arizona", 908.205, 62.5, 9, 8], ["USA Philly", 902.25, 500, 11, 5], ["Australia", 915.8, 250, 10, 5],
  ["Australia (Narrow)", 916.575, 62.5, 7, 5], ["Australia (Mid)", 915.075, 125, 9, 5], ["Australia SA, WA, QLD", 923.125, 62.5, 8, 5],
  ["New Zealand", 917.375, 250, 11, 5], ["New Zealand (Narrow)", 917.375, 62.5, 7, 5], ["Vietnam", 920.25, 250, 11, 5],
];
const BWS = [7.8, 10.4, 15.6, 20.8, 31.25, 41.7, 62.5, 125, 250, 500];
const TZS = [["Europe/London", "GMT0BST,M3.5.0/1,M10.5.0"], ["Europe/Dublin", "IST-1GMT0,M10.5.0,M3.5.0/1"], ["Central Europe", "CET-1CEST,M3.5.0,M10.5.0/3"],
  ["Eastern Europe", "EET-2EEST,M3.5.0/3,M10.5.0/4"], ["US Eastern", "EST5EDT,M3.2.0,M11.1.0"], ["US Central", "CST6CDT,M3.2.0,M11.1.0"],
  ["US Mountain", "MST7MDT,M3.2.0,M11.1.0"], ["US Pacific", "PST8PDT,M3.2.0,M11.1.0"], ["Australia Eastern", "AEST-10AEDT,M10.1.0,M4.1.0/3"],
  ["New Zealand", "NZST-12NZDT,M9.5.0,M4.1.0/3"], ["UTC", "UTC0"]];
const presetFor = (f, bw, sf, cr) => PRESETS.find(p => Math.abs(p[1] - f) < 0.002 && p[2] == bw && p[3] == sf && p[4] == cr);
const presetLoose = (f, bw, sf) => PRESETS.find(p => Math.abs(p[1] - f) < 0.002 && p[2] == bw && p[3] == sf);

// ================================================================ settings schema
// type: text|password|number|select|toggle|textarea|readonly|radio
// k: CLI key -> "get k" / "set k v" unless get/set overridden. secret: never read back.
const onoff = {type: "toggle", on: "on", off: "off"};
const F = (k, label, o = {}) => Object.assign({k, label, type: "text"}, o);
const SECTIONS = [
  {id: "dash", title: "Dashboard", ico: "◉", special: "dash"},
  {id: "chat", title: "Messages", ico: "💬", special: "chat", roles: CL},
  {id: "contacts", title: "Contacts", ico: "👥", special: "contacts", roles: CL},
  {id: "channels", title: "Channels", ico: "#", special: "channels", roles: CL},
  {id: "clroutes", title: "Routes & trace", ico: "🧭", special: "clroutes", roles: CL},
  {id: "map", title: "Map", ico: "📍", special: "map"},
  {id: "clregion", title: "Region", ico: "🗺", special: "clregion", roles: CL},
  {id: "radio", title: "Radio", ico: "📡", groups: [
    {title: "LoRa parameters", sub: "All nodes in a mesh must share frequency, bandwidth and spreading factor.", fields: [
      F("radio", "Frequency / BW / SF / CR", {type: "radio", help: "Applies without a reboot on UMC. Coding rate may differ between nodes."}),
      F("tx", "TX power (dBm)", {type: "number", min: 1, max: 22, help: "Radio chip power. Boards with a PA (Heltec V4) add gain on top — stay within your local limit."}),
      F("dutycycle", "Duty cycle limit (%)", {type: "number", min: 1, max: 100, help: "UK/EU 869.40–869.65 MHz allows 10%.", parse: v => parseFloat(v), roles: RS}),
      F("af", "Airtime factor", {type: "number", min: 0, max: 9, step: 0.1, roles: CL, help: "Transmit budget: 1 = wait as long as the last transmission took. 0 = no limit."}),
      F("radio.rxgain", "RX boosted gain", onoff),
      F("radio.fem.rxgain", "External LNA (FEM)", Object.assign({feature: "fem", roles: RS}, onoff)),
    ]},
    {title: "Interference handling", roles: RS, fields: [
      F("agc.reset.interval", "AGC reset interval (s)", {type: "number", min: 0, max: 1020, step: 4, help: "4 cures 'deafness' from nearby strong signals. 0 = off."}),
      F("cad", "Channel activity detect", onoff),
      F("int.thresh", "Interference threshold", {type: "number", min: 0, max: 50}),
    ]},
    {title: "Receive timing", roles: CL, fields: [
      F("rxdelay", "RX delay base (experimental)", {type: "number", min: 0, max: 20, step: 0.5, help: "0 = off. Delays processing of weaker copies of a flood so the best path wins."}),
    ]},
  ], actions: [["Temporary radio test…", "tempradio", RS]]},
  {id: "msgset", title: "Messaging settings", ico: "✉", roles: CL, groups: [
    {title: "Sending", fields: [
      F("multi.acks", "Extra ACK transmissions", {type: "select", options: [["0", "Off"], ["1", "On"]], help: "Sends delivery confirmations twice: more reliable on busy meshes."}),
      F("path.hash.mode", "Path hash size", {type: "select", options: [["0", "1 byte (default)"], ["1", "2 bytes"], ["2", "3 bytes"]], help: "Larger hashes tell repeaters apart on big meshes. Everyone on the path must run firmware that supports it."}),
      F("scope", "Region scope for sends", {help: "Region name (case-sensitive) added to flood sends so they stay in your area - e.g. yorkshire. Blank = whole mesh. Your repeaters must know the region.", placeholder: "yorkshire"}),
      F("advert.loc", "Location in adverts", {type: "select", options: [["none", "Don't share"], ["share", "Share (rounded coordinates below)"]]}),
      F("repeat", "Client repeat", Object.assign({help: "Lets this client relay packets for others. Only allowed on 433.000, 869.495 and 918.000 MHz."}, onoff)),
    ]},
    {title: "New contacts", sub: "Adverts heard over the mesh can be added automatically, or wait on the Contacts page for you to add them.", fields: [
      F("contacts.manual", "Manual add only", Object.assign({help: "On: only the types switched on below are added automatically."}, onoff)),
      F("autoadd.chat", "Auto-add chat nodes", onoff), F("autoadd.repeater", "Auto-add repeaters", onoff),
      F("autoadd.room", "Auto-add room servers", onoff), F("autoadd.sensor", "Auto-add sensors", onoff),
      F("autoadd.overwrite", "Overwrite oldest when full", Object.assign({help: "Replaces the oldest non-favourite contact when all slots are used."}, onoff)),
      F("autoadd.maxhops", "Max hops for auto-add", {type: "number", min: 0, max: 64, help: "0 = any distance, 1 = direct neighbours only, N = up to N-1 hops."}),
    ]},
    {title: "Telemetry sharing", sub: "Who may request this device's battery, location and sensor readings.", fields: [
      F("telemetry.base", "Battery & basic", {type: "select", options: [["deny", "Nobody"], ["contacts", "Favourite contacts"], ["all", "Everyone"]]}),
      F("telemetry.loc", "Location", {type: "select", options: [["deny", "Nobody"], ["contacts", "Favourite contacts"], ["all", "Everyone"]]}),
      F("telemetry.env", "Environment sensors", {type: "select", options: [["deny", "Nobody"], ["contacts", "Favourite contacts"], ["all", "Everyone"]]}),
    ]},
    {title: "Storage", fields: [F("contacts.count", "Contacts, channels & queued messages", {type: "readonly", parse: v => { try { const o = JSON.parse(v); return `${o.contacts}/${o.max_contacts} contacts · ${o.channels}/${o.max_channels} channels · ${o.queued} messages waiting for an app`; } catch { return v; } }})]},
  ]},
  {id: "apps", title: "Bluetooth & apps", ico: "📱", roles: CL, groups: [
    {title: "Bluetooth", sub: "The MeshCore app pairs with the PIN shown on the display, or the fixed PIN below.", fields: [
      F("ble", "Bluetooth", onoff),
      F("ble.pin", "Fixed pairing PIN", {type: "number", min: 0, max: 999999, help: "6 digits. 0 = a new random PIN every boot, shown on the display. Applies after a reboot."}),
      F("ble.activepin", "PIN in use now", {type: "readonly"}),
    ]},
    {title: "App connections", sub: "Bluetooth, USB, WiFi (TCP port 5000) and this web page all work at the same time.", fields: [
      F("app.tcp", "WiFi app connection (TCP)", Object.assign({help: "For the MeshCore app / meshcore-open (TCP), meshcore_py, meshcore-cli and Home Assistant."}, onoff)),
      F("app.links", "Connected now", {type: "readonly", parse: v => { try { const o = JSON.parse(v); return `Bluetooth: ${o.ble.on ? (o.ble.connected ? "connected" : "on, waiting") : "off"} · TCP apps: ${o.tcp.clients} · messages waiting: ${o.queued}`; } catch { return v; } }}),
    ]},
  ], actions: [["Reboot", "reboot"]]},
  {id: "mesh", title: "Mesh & routing", ico: "🔀", roles: RS, groups: [
    {title: "Forwarding", fields: [
      F("repeat", "Repeat packets", onoff),
      F("loop.detect", "Loop detection", {type: "select", options: ["off", "minimal", "moderate", "strict"]}),
      F("path.hash.mode", "Advert path hash size", {type: "select", options: [["0", "1 byte (default)"], ["1", "2 bytes"], ["2", "3 bytes"]]}),
      F("flood.max", "Max flood hops", {type: "number", min: 0, max: 64}),
      F("flood.max.unscoped", "Max hops, unscoped floods", {type: "number", min: 0, max: 64}),
      F("flood.max.advert", "Max hops, flooded adverts", {type: "number", min: 0, max: 64}),
      F("group.hops.max", "Max hops, channel messages", {type: "number", min: 0, max: 64, help: "Limits how far public/group channel messages are relayed. 64 = no extra limit, 0 = never relay them."}),
      F("multi.acks", "Extra ACK transmissions", {type: "select", options: [["0", "Off"], ["1", "On"]]}),
      F("allow.read.only", "Allow read-only logins", Object.assign({roles: ["room_server"]}, onoff)),
    ]},
    {title: "Timing", fields: [
      F("txdelay", "Flood retransmit delay factor", {type: "number", min: 0, max: 2, step: 0.1}),
      F("direct.txdelay", "Direct retransmit delay factor", {type: "number", min: 0, max: 2, step: 0.1}),
      F("rxdelay", "RX delay base (experimental)", {type: "number", min: 0, max: 20, step: 0.5}),
    ]},
    {title: "Adverts", sub: "UK guidance: use an odd number of hours for flood adverts (e.g. 51) to avoid synchronised congestion.", fields: [
      F("advert.interval", "Zero-hop advert (minutes)", {type: "number", min: 0, max: 240, step: 2, help: "0 = off, otherwise 60–240."}),

// ================================================================ rendering helpers
function visibleFields(sec) {
  const out = [];
  for (const g of sec.groups || []) if (has(g.feature) && roleOk(g.roles)) for (const f of g.fields) if (has(f.feature) && roleOk(f.roles)) out.push(f);
  return out;
}
const getCmd = f => f.get || (f.k.startsWith("__") ? null : `get ${f.k}`);
const setCmd = (f, v) => f.set ? f.set(v) : `set ${f.k} ${v}`;

function controlHtml(f, id) {
  const a = `id="${id}" data-k="${esc(f.k)}"`;
  switch (f.type) {
    case "toggle": return `<label class="switch"><input type="checkbox" ${a}><span></span></label><span class="val" id="${id}_v"></span>`;
    case "select": return `<select ${a}>${f.options.map(o => Array.isArray(o) ? `<option value="${esc(o[0])}">${esc(o[1])}</option>` : `<option>${esc(o)}</option>`).join("")}</select>`;
    case "number": return `<input type="number" ${a} ${f.min != null ? `min="${f.min}"` : ""} ${f.max != null ? `max="${f.max}"` : ""} step="${f.step ?? 1}">`;
    case "password": return `<input type="password" ${a} autocomplete="new-password" placeholder="${f.secret ? "unchanged" : ""}">`;
    case "textarea": return `<textarea ${a}></textarea>`;
    case "readonly": return `<span class="val" ${a} style="font-size:13px;color:var(--ink)"></span>`;
    case "radio": return `<div style="width:100%"><select id="${id}_p" style="margin-bottom:6px"><option value="">Custom</option>${PRESETS.map((p, i) => `<option value="${i}">${esc(p[0])} — ${p[1]} MHz, ${p[2]} kHz, SF${p[3]}</option>`).join("")}</select>
      <div class="row"><input type="number" id="${id}_f" step="0.001" min="150" max="2500" style="max-width:130px" title="MHz"> MHz
      <select id="${id}_b" style="max-width:110px">${BWS.map(b => `<option>${b}</option>`).join("")}</select> kHz
      SF<select id="${id}_s" style="max-width:70px">${[5,6,7,8,9,10,11,12].map(s => `<option>${s}</option>`).join("")}</select>
      CR 4/<select id="${id}_c" style="max-width:60px">${[5,6,7,8].map(s => `<option>${s}</option>`).join("")}</select></div></div>`;
    default: return `<input type="text" ${a} ${f.placeholder ? `placeholder="${esc(f.placeholder)}"` : ""}>`;
  }
}

function setControl(f, id, raw) {
  const v = f.parse ? f.parse(val(raw)) : val(raw);
  const el = $("#" + id);
  if (!el && f.type !== "radio") return;
  if (isErr(raw)) { const m = $("#" + id + "_m"); if (m) { m.textContent = "not supported"; m.className = "msg"; } }
  switch (f.type) {
    case "toggle": el.checked = v === (f.on || "on") || v === "1" || v === "true"; $("#" + id + "_v").textContent = isErr(raw) ? "" : v; break;
    case "readonly": el.textContent = v; break;
    case "password": el.value = ""; break;
    case "radio": {
      const [fr, bw, sf, cr] = v.split(",").map(Number);
      $("#" + id + "_f").value = fr ? fr.toFixed(3) : ""; $("#" + id + "_b").value = String(bw); $("#" + id + "_s").value = String(sf); $("#" + id + "_c").value = String(cr);
      const p = presetFor(fr, bw, sf, cr) || presetLoose(fr, bw, sf); $("#" + id + "_p").value = p ? PRESETS.indexOf(p) : "";
      break;
    }
    case "select":
      if (![...el.options].some(o => o.value === v) && v) el.add(new Option(v, v));
      el.value = v; break;
    default: el.value = v;
  }
}

function readControl(f, id) {
  const el = $("#" + id);
  switch (f.type) {
    case "toggle": return el.checked ? (f.on || "on") : (f.off || "off");
    case "radio": return [$("#" + id + "_f").value, $("#" + id + "_b").value, $("#" + id + "_s").value, $("#" + id + "_c").value].join(",");
    default: return el.value.trim();
  }
}

async function renderSchemaSection(sec, view) {
  let html = "", n = 0; const map = [];
  for (const g of sec.groups) {
    if (!has(g.feature) || !roleOk(g.roles)) continue;
    const fields = g.fields.filter(f => has(f.feature) && roleOk(f.roles));
    if (!fields.length) continue;
    html += `<div class="card"><h2>${esc(g.title)}</h2>${g.sub ? `<p class="sub">${esc(g.sub)}</p>` : ""}`;
    for (const f of fields) {
      const id = "f" + (n++); map.push([f, id]);
      const editable = f.type !== "readonly";
      html += `<div class="field" id="${id}_row"><label for="${id}">${esc(f.label)}</label><div class="ctl">${controlHtml(f, id)}<span class="msg" id="${id}_m"></span></div>
        <div class="act">${editable ? `<button class="btn sm" data-save="${id}">Save</button>` : ""}</div>${f.help ? `<div class="help">${esc(f.help)}</div>` : ""}</div>`;
    }
    html += `</div>`;
  }
  const acts = (sec.actions || []).filter(a => roleOk(a[2]));
  if (acts.length) html += `<div class="card"><h2>Actions</h2><div class="row">${acts.map(([l, c]) => `<button class="btn" data-act="${esc(c)}">${esc(l)}</button>`).join("")}</div></div>`;
  view.innerHTML = html + `<div class="row"><button class="btn" id="reloadSec">Reload values</button><button class="btn pri" id="saveAll">Save all changes</button></div>`;

  const dirty = new Set();
  const mark = id => { dirty.add(id); $("#" + id + "_row").classList.add("dirty"); };
  for (const [f, id] of map) {
    const row = $("#" + id + "_row");
    row.addEventListener("input", () => mark(id)); row.addEventListener("change", () => mark(id));
    if (f.type === "radio") $("#" + id + "_p").addEventListener("change", e => {
      const p = PRESETS[e.target.value]; if (!p) return;
      $("#" + id + "_f").value = p[1].toFixed(3); $("#" + id + "_b").value = String(p[2]); $("#" + id + "_s").value = String(p[3]); $("#" + id + "_c").value = String(p[4]);
    });
  }
  const load = async () => {
    const withGet = map.filter(([f]) => getCmd(f));
    const replies = await api.cli(withGet.map(([f]) => getCmd(f)));
    withGet.forEach(([f, id], i) => setControl(f, id, replies[i]));
    dirty.clear(); view.querySelectorAll(".dirty").forEach(r => r.classList.remove("dirty"));
  };
  const save = async ids => {
    const items = map.filter(([, id]) => ids.includes(id)).map(([f, id]) => [f, id, readControl(f, id)]);
    const cmds = [];
    for (const [f, id, v] of items) {
      const m = $("#" + id + "_m");
      if (f.type === "password" && !v) { dirty.delete(id); continue; }
      if (f.min != null && f.type === "password" && v.length < f.min) { m.textContent = `min ${f.min} chars`; m.className = "msg bad"; return; }
      const el = $("#" + id);
      if (el && el.type === "number" && el.value !== "" && !el.checkValidity()) { m.textContent = "out of range"; m.className = "msg bad"; return; }
      cmds.push([id, setCmd(f, v)]);
    }
    if (!cmds.length) return toast("Nothing to save");
    const replies = await api.cli(cmds.map(c => c[1]));
    let bad = 0;
    cmds.forEach(([id], i) => {
      const m = $("#" + id + "_m"), r = replies[i] || "";
      m.textContent = r.length > 60 ? r.slice(0, 60) + "…" : r; m.className = "msg " + (isErr(r) ? "bad" : "ok");
      if (isErr(r)) bad++; else { dirty.delete(id); $("#" + id + "_row").classList.remove("dirty"); }
      if (/reboot/i.test(r)) toast(r, "");
    });
    toast(bad ? `${bad} setting(s) rejected` : "Saved", bad ? "bad" : "ok");
    await load();
  };
  view.addEventListener("click", async e => {
    const b = e.target.closest("button"); if (!b) return;
    try {
      if (b.dataset.save) await save([b.dataset.save]);
      else if (b.id === "saveAll") await save([...dirty]);
      else if (b.id === "reloadSec") await load();
      else if (b.dataset.act) await runAction(b.dataset.act, load);
    } catch (err) { toast(err.message, "bad"); }
  });
  await load();
}

// Accepts "53.726, -1.574", Google Maps links (@lat,lon or q=lat,lon) and OpenStreetMap links (#map=z/lat/lon, mlat/mlon).
function parseCoords(text) {
  const s = String(text || "").trim();
  const pats = [/@(-?\d+\.\d+),\s*(-?\d+\.\d+)/, /[?&](?:q|query|ll)=(-?\d+\.\d+),\s*(-?\d+\.\d+)/, /#map=\d+\/(-?\d+\.\d+)\/(-?\d+\.\d+)/,
    /mlat=(-?\d+\.\d+).*?mlon=(-?\d+\.\d+)/, /!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/, /^(-?\d+(?:\.\d+)?)\s*[, ]\s*(-?\d+(?:\.\d+)?)$/];
  for (const p of pats) {
    const m = s.match(p);
    if (m) { const lat = +m[1], lon = +m[2]; if (Math.abs(lat) <= 90 && Math.abs(lon) <= 180) return [lat.toFixed(3), lon.toFixed(3)]; }
  }
  return null;
}
async function askLocation() {
  if (window.isSecureContext && navigator.geolocation) {
    const pos = await new Promise(res => navigator.geolocation.getCurrentPosition(p => res([p.coords.latitude.toFixed(3), p.coords.longitude.toFixed(3)]), () => res(null), {timeout: 15000}));
    if (pos) return pos;
  }
  window.open("https://www.openstreetmap.org/", "_blank", "noopener");
  const t = prompt("Find your location on the map that just opened, then paste coordinates or the map link here.\nExamples: 53.726, -1.574  or a Google Maps / OpenStreetMap link.\nIt is rounded to about 100 m.");
  if (t == null) return null;
  const c = parseCoords(t);
  if (!c) toast("Couldn't find coordinates in that text", "bad");
  return c;
}

async function runAction(act, reload) {
  if (act === "geo") {
    const c = await askLocation(); if (!c) return;
    const r = await api.cli([`set lat ${c[0]}`, `set lon ${c[1]}`]);
    toast(`Location set to ${c[0]}, ${c[1]}`, r.some(isErr) ? "bad" : "ok"); reload && reload();
    return;
  }
  if (act === "prvkey") {
    if (!confirm("Show this node's PRIVATE key? Anyone with it can impersonate the node.")) return;
    const k = val(await one("get prv.key"));
    const nk = prompt("Private key (copy it somewhere safe). Paste a new 64-hex key to replace it, or Cancel:", k);
    if (nk && nk !== k) { const r = await one(`set prv.key ${nk}`); toast(r, isErr(r) ? "bad" : "ok"); }
    return;
  }
  if (act === "setperm") {
    const pk = prompt("Companion public key (hex):"); if (!pk) return;
    const perm = prompt("Permission: 0 guest, 1 read-only, 2 read-write, 3 admin, blank = remove", "3"); if (perm === null) return;
    const r = await one(`setperm ${pk} ${perm}`.trim()); return toast(r, isErr(r) ? "bad" : "ok");
  }
  if (act === "yorkshire") {
    // From the MeshCore Yorkshire guide: https://docs.meshcoreyorkshire.uk/repeaters/suggested-repeater-commands/
    const cmds = ["set flood.max 20", "set flood.max.advert 0", "set flood.max.unscoped 32", "set path.hash.mode 2",
      "set loop.detect minimal", "set flood.advert.interval 0", "set advert.interval 60", "set dutycycle 10"];
    const regions = ["region put yorkshire", "region put eng-yh", "region default yorkshire", "region save"];
    const withRegions = confirm(`Apply the Yorkshire mesh recommendations?\n\n${cmds.join("\n")}\n\nOK also adds the regions:\n${regions.join("\n")}\n\nCancel to stop, or Cancel then use the Regions page for regions only.`);
    if (!withRegions) return;
    const all = cmds.concat(regions);
    const r = await api.cli(all);
    const bad = all.map((c, i) => [c, r[i]]).filter(([, x]) => isErr(x));
    toast(bad.length ? `Applied, ${bad.length} rejected: ${bad.map(([c]) => c.split(" ")[1]).join(", ")}` : "Yorkshire recommendations applied", bad.length ? "bad" : "ok");
    reload && reload();
    return;
  }
  if (act === "tempradio") {
    const s = prompt("Temporary radio: freq,bw,sf,cr,minutes", "869.618,62.5,8,8,10"); if (!s) return;
    const r = await one(`tempradio ${s}`); return toast(r, isErr(r) ? "bad" : "ok");
  }
  const r = await one(act); toast(r || "Sent", isErr(r) ? "bad" : "ok");
}

      <td>${p.flood ? "flood" : "direct"}</td><td>${p.tx ? "—" : p.hops}</td><td>${p.tx ? "—" : p.rssi}</td><td>${p.tx ? "—" : (+p.snr).toFixed(1)}</td><td>${p.len}</td></tr>`).join("")
      || `<tr><td colspan="8" class="val">No packets yet.</td></tr>`;

  ["tfRx", "tfTx", "tfType"].forEach(id => $("#" + id).addEventListener("change", () => { const p = paused; paused = false; load().finally(() => paused = p); }));

async function renderRoutes(view) {
  view.innerHTML = `<div class="card"><h2>Routes</h2><p class="sub">Every node this repeater has heard an advert from, and the chain of repeaters that advert came through. Reverse it for the route <i>to</i> that node. Hops are shown by their key prefix, with the repeater's name when known.</p>
      <div class="row" style="margin-bottom:10px"><input type="text" id="rtFind" placeholder="Find by name or key…" style="max-width:260px"><button class="btn" id="rtRef">Refresh</button><span class="val" id="rtCount"></span></div>
      <div style="overflow-x:auto"><table><thead><tr><th>Node</th><th>Route to node</th><th>Hops</th><th>Heard</th><th>SNR</th><th></th></tr></thead><tbody id="rtBody"></tbody></table></div></div>
    <div class="card"><h2>Trace</h2><p class="sub">Sends a trace packet out and back along a route. Every repeater on the way reports the signal quality (SNR) it received. <b>Trace</b> on a row uses that node's pinned route, or the learned one.</p>
      <div class="row"><input type="text" id="trPath" placeholder="custom path, e.g. a1,b2,a1" style="max-width:260px"><button class="btn" id="trGo">Trace custom path</button></div>
      <div id="trOut" style="margin-top:12px"></div></div>`;
  let routes = [];
  const nameFor = hex => { const r = routes.find(x => x.key.startsWith(hex.toLowerCase())); return r && r.name ? r.name : ""; };
  const hopLabel = hex => { const n = nameFor(hex); return `<code>${esc(hex)}</code>${n ? ` <span class="val">${esc(n)}</span>` : ""}`; };
  const ago = s => s < 0 ? "before reboot" : s < 120 ? s + " s" : s < 7200 ? Math.round(s / 60) + " min" : s < 172800 ? Math.round(s / 3600) + " h" : Math.round(s / 86400) + " days";
  const render = () => {
    const q = $("#rtFind").value.trim().toLowerCase();
    const list = routes.filter(r => !q || r.name.toLowerCase().includes(q) || r.key.startsWith(q)).sort((a, b) => a.ago - b.ago);
    $("#rtCount").textContent = `${list.length} of ${routes.length} node(s)`;
    $("#rtBody").innerHTML = list.map(r => {
      const hops = r.path ? r.path.split(",").reverse() : [];
      const chain = hops.length ? `this repeater → ${hops.map(hopLabel).join(" → ")} → node` : `<span class="val">direct (heard without repeaters)</span>`;
      return `<tr><td><b>${esc(r.name || "?")}</b> <span class="pill">${esc(r.type)}</span><br><code class="val">${esc(r.key)}</code></td>
        <td>${chain}${r.pin ? `<br><span class="pill ok">pinned trace: ${esc(r.pin)}</span>` : ""}</td>
        <td>${r.hops}</td><td>${r.ago < 0 ? ago(r.ago) : ago(r.ago) + " ago"}</td><td>${(+r.snr).toFixed(1)}</td>
        <td class="row" style="justify-content:flex-end"><button class="btn sm" data-trace="${esc(r.key)}">Trace</button><button class="btn sm" data-pin="${esc(r.key)}">${r.pin ? "Edit route" : "Add route"}</button>${r.pin ? `<button class="btn sm" data-unpin="${esc(r.key)}">Unpin</button>` : ""}<button class="btn sm danger" data-forget="${esc(r.key)}">Forget</button></td></tr>`;
    }).join("") || `<tr><td colspan="6" class="val">No nodes heard yet. Adverts arrive over time; press <b>Send flood advert</b> on the dashboard to prompt replies.</td></tr>`;
  };
  const load = async () => { routes = (await api.routes()).routes || []; render(); };
  let poll = null;
  const showTrace = async () => {
    const s = val(await one("get trace"));
    const out = $("#trOut");
    if (s.startsWith("waiting")) { out.innerHTML = `<p class="val">Waiting for the trace to come back… (${esc(s.split(" ")[1])})</p>`; return false; }
    if (s.startsWith("timeout")) { out.innerHTML = `<p class="msg bad">No answer within 30 s — a repeater on the path didn't hear or forward it. Path: ${esc((s.match(/path:(\S+)/) || [])[1] || "")}</p>`; return true; }
    if (s.startsWith("done")) {
      const path = ((s.match(/path:(\S+)/) || [])[1] || "").split(",").filter(Boolean);
      const snr = ((s.match(/snr:(\S+)/) || [])[1] || "").split(",").map(Number);
      const fin = +((s.match(/final:(-?[\d.]+)/) || [])[1]);
      const secs = (s.match(/done ([\d.]+)s/) || [])[1];
      const bar = v => `<span style="display:inline-block;height:8px;width:${Math.max(4, Math.min(100, (v + 20) * 3))}px;background:${v >= 5 ? "var(--ok)" : v >= -5 ? "var(--warn)" : "var(--bad)"};border-radius:4px;vertical-align:middle"></span>`;
      out.innerHTML = `<p class="msg ok">Trace completed in ${esc(secs)} s</p><table><thead><tr><th>#</th><th>Heard by</th><th>SNR</th></tr></thead><tbody>
        ${path.map((h, i) => `<tr><td>${i + 1}</td><td>${hopLabel(h)}</td><td>${isNaN(snr[i]) ? "—" : snr[i].toFixed(1) + " dB " + bar(snr[i])}</td></tr>`).join("")}
        <tr><td>↩</td><td>back at this repeater</td><td>${isNaN(fin) ? "—" : fin.toFixed(1) + " dB " + bar(fin)}</td></tr></tbody></table>`;
      return true;
    }
    out.innerHTML = ""; return true;
  };
  const startTrace = async cmd => {
    const r = await one(cmd); toast(r, isErr(r) ? "bad" : "ok"); if (isErr(r)) return;
    clearInterval(poll); let n = 0;
    poll = setInterval(async () => { n++; const fin = await showTrace().catch(() => true); if (fin || n > 35) clearInterval(poll); }, 1000);
  };
  window.addEventListener("hashchange", () => clearInterval(poll), {once: true});
  $("#rtFind").addEventListener("input", render);
  view.addEventListener("click", async e => {
    const b = e.target.closest("button"); if (!b) return;
    try {
      if (b.id === "rtRef") return load();
      if (b.id === "trGo") { const p = $("#trPath").value.trim(); if (!p) return toast("Enter hop key prefixes, e.g. a1,b2,a1", "bad"); return startTrace(`trace ${p}`); }
      if (b.dataset.trace) return startTrace(`trace route ${b.dataset.trace}`);
      if (b.dataset.pin) {
        const r = routes.find(x => x.key === b.dataset.pin);
        const learned = r && r.path ? r.path.split(",").map(h => h.slice(0, 2)) : [];
        const suggestion = r && r.pin ? r.pin : [...learned.slice().reverse(), ...(r && r.type === "repeater" ? [r.key.slice(0, 2)] : []), ...learned].join(",");
        const p = prompt(`Route used when tracing ${r ? r.name || r.key : ""}.\nEnter the full out-and-back list of repeater key prefixes (2 hex digits each), e.g. a1,b2,a1:`, suggestion);
        if (p == null) return;
        const x = await one(`route pin ${b.dataset.pin} ${p}`); toast(x, isErr(x) ? "bad" : "ok"); return load();
      }
      if (b.dataset.unpin) { toast(await one(`route unpin ${b.dataset.unpin}`)); return load(); }
      if (b.dataset.forget) { if (!confirm("Forget this node's route?")) return; toast(await one(`route forget ${b.dataset.forget}`)); return load(); }
    } catch (err) { toast(err.message, "bad"); }
  });
  await load();
  showTrace().catch(() => {});
}

async function renderRegions(view) {
  view.innerHTML = `<div class="card"><h2>Region tree</h2><p class="sub">Regions scope flood traffic. Changes take effect immediately but are lost on reboot until you press <b>Save regions</b>.</p>
    <table><thead><tr><th>Region</th><th>Flooding</th><th></th></tr></thead><tbody id="rBody"></tbody></table>
    <p class="msg" id="rDirty"></p>
    <div class="row"><button class="btn" id="rRef">Refresh</button><button class="btn pri" id="rSave">Save regions</button></div></div>
    <div class="card"><h2>UK presets</h2><p class="sub">Names are case-sensitive and must match other repeaters exactly. These use the lowercase names seen on the public map.</p>
      <div class="row"><button class="btn" data-preset="yorkshire">Add yorkshire</button><button class="btn" data-preset="northwest">Add northwest</button><button class="btn" data-preset="uk">uk → yorkshire + northwest</button></div></div>
    <div class="card"><h2>Edit</h2>
      <div class="field"><label>Add region</label><div class="ctl"><input id="rName" type="text" placeholder="#Leeds" style="max-width:180px"> under <input id="rParent" type="text" placeholder="parent (blank = *)" style="max-width:180px"></div><div class="act"><button class="btn sm" id="rPut">Add</button></div></div>
      <div class="field"><label>Region</label><div class="ctl"><input id="rSel" type="text" placeholder="name or *" style="max-width:180px">
        <button class="btn sm" data-r="allowf">Allow flood</button><button class="btn sm" data-r="denyf">Deny flood</button><button class="btn sm" data-r="home">Set home</button><button class="btn sm" data-r="default">Set default scope</button><button class="btn sm danger" data-r="remove">Remove</button></div><div></div></div>
      <div class="field"><label>Define in one line</label><div class="ctl"><input id="rDef" type="text" placeholder="#UK #Yorkshire #Leeds|#Yorkshire #Wakefield"></div><div class="act"><button class="btn sm" id="rDefBtn">Apply</button></div><div class="help">Uses <code>region def</code>: each name becomes a child of the previous; <code>name|jump</code> moves back up.</div></div>
    </div>`;
  let tree = [];  // [{name, depth, home, flood}]
  const setDirty = on => { const d = $("#rDirty"); d.textContent = on ? "Unsaved changes — press Save regions to keep them after a reboot." : ""; d.className = "msg" + (on ? " bad" : ""); };
  const load = async () => {
    // `region` prints one line per region, indented one space per level: "name[^] [F]"
    const raw = String(await one("region")).replace(/^\s*>\s?/, "");
    tree = raw.split("\n").filter(l => l.trim()).map(l => {
      const depth = l.length - l.trimStart().length, t = l.trim();
      const flood = / F$/.test(t), nm = t.replace(/ F$/, "");
      return {depth, name: nm.replace(/\^$/, ""), home: nm.endsWith("^"), flood};
    });
    $("#rBody").innerHTML = tree.map((r, i) => {
      const root = r.name === "*";
      return `<tr><td style="padding-left:${8 + r.depth * 22}px"><code>${esc(r.name)}</code>${r.home ? ' <span class="pill ok">home</span>' : ""}${root ? ' <span class="val">(everything without a region)</span>' : ""}</td>
        <td><label class="switch"><input type="checkbox" data-flood="${i}" ${r.flood ? "checked" : ""}><span></span></label></td>
        <td class="row" style="justify-content:flex-end">${root ? "" : `<button class="btn sm" data-home="${i}">Set home</button><button class="btn sm danger" data-rm="${i}">Remove</button>`}</td></tr>`;
    }).join("") || `<tr><td colspan="3" class="val">No regions defined.</td></tr>`;
  };
  // children of tree[i] (in dump order they follow it with greater depth)
  const subtree = i => { const out = [i]; for (let j = i + 1; j < tree.length && tree[j].depth > tree[i].depth; j++) out.push(j); return out; };
  view.addEventListener("change", async e => {
    const i = e.target.dataset.flood; if (i == null) return;
    try { const r = await one(`region ${e.target.checked ? "allowf" : "denyf"} ${tree[i].name}`); toast(r, isErr(r) ? "bad" : "ok"); setDirty(true); await load(); }
    catch (err) { toast(err.message, "bad"); }
  });
  view.addEventListener("click", async e => {
    const b = e.target.closest("button"); if (!b) return;
    try {
      let r;
      if (b.dataset.rm != null) {
        const idx = subtree(+b.dataset.rm), names = idx.map(k => tree[k].name);
        if (!confirm(names.length > 1 ? `Remove ${names[0]} and its ${names.length - 1} sub-region(s): ${names.slice(1).join(", ")}?` : `Remove region ${names[0]}?`)) return;
        const replies = await api.cli(idx.slice().sort((a, b) => tree[b].depth - tree[a].depth).map(k => `region remove ${tree[k].name}`));
        const bad = replies.filter(isErr);
        toast(bad.length ? bad.join(" / ") : `Removed ${names.join(", ")}`, bad.length ? "bad" : "ok");
        setDirty(true); return load();
      }
      if (b.dataset.home != null) { r = await one(`region home ${tree[+b.dataset.home].name}`); setDirty(true); }
      if (b.id === "rRef") return load();
      if (b.id === "rSave") { r = await one("region save"); if (!isErr(r)) setDirty(false); }
      if (b.id === "rPut") r = await one(`region put ${$("#rName").value.trim()} ${$("#rParent").value.trim()}`.trim());
      if (b.id === "rDefBtn") r = await one(`region def ${$("#rDef").value.trim()}`);
      if (b.dataset.r) r = await one(`region ${b.dataset.r} ${$("#rSel").value.trim()}`);
      if (b.dataset.preset) r = await one(`region preset ${b.dataset.preset}`);
      if (r != null) { toast(r, isErr(r) ? "bad" : "ok"); if (b.id !== "rSave" && !isErr(r)) setDirty(true); await load(); }
    } catch (err) { toast(err.message, "bad"); }
  });
  await load();
}

    116: ["Voltage", 2, 0.01, " V"], 117: ["Current", 2, 0.001, " A"], 118: ["Frequency", 4, 1, " Hz"], 120: ["Percentage", 1, 1, " %"], 121: ["Altitude", 2, 1, " m", 1],
    125: ["Concentration", 2, 1, " ppm"], 128: ["Power", 2, 1, " W"], 130: ["Distance", 4, 0.001, " m"], 131: ["Energy", 4, 0.001, " kWh"], 132: ["Direction", 2, 1, "°"],

    .chat .hd{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .chat .hd h2{margin:0;font-size:15px;flex:1}
    .chat .msgs{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
    .bub{max-width:78%;padding:7px 11px;border-radius:14px;background:var(--chip);align-self:flex-start;word-wrap:break-word;white-space:pre-wrap}
    .bub.out{align-self:flex-end;background:var(--acc);color:var(--acc-ink)}
    .bub .meta{display:block;font-size:11px;opacity:.72;margin-top:2px}.bub .who{display:block;font-size:12px;font-weight:600;opacity:.85}
    .bub.failed{outline:2px solid var(--bad)}
    .chat .compose{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);align-items:flex-end}
    .chat .compose textarea{min-height:40px;max-height:140px;max-width:none;flex:1}
    @media (max-width:820px){.chat{grid-template-columns:1fr;height:auto}.chat.inconv .side{display:none}.chat:not(.inconv) .conv{display:none}.chat .msgs{min-height:50vh}}
    </style>
    <div class="chat" id="chat"><div class="side"><input type="text" id="cSearch" placeholder="Search chats and contacts"><div class="items" id="cItems"></div>
      <div class="row" style="padding:8px 10px;border-top:1px solid var(--line)"><button class="btn sm" id="cAdvert">Send advert</button><button class="btn sm" id="cNotif">Notifications</button></div></div>
    <div class="conv" id="cConv"><div class="hd"><span class="val">Choose a channel or contact.</span></div></div></div>`;
  MC.start();
  let active = MC.activeConv || null, filter = "";
  const items = () => {
    const rows = [];
    for (const ch of MC.channels) rows.push({conv: "ch:" + ch.idx, name: convName("ch:" + ch.idx), ico: "#", sub: "channel"});
    for (const c of MC.contacts.values()) if (c.type === 1 || c.type === 3 || MC.store.conv["c:" + c.prefix]) rows.push({conv: "c:" + c.prefix, name: c.name, ico: TYPE_ICO[c.type] || "•", sub: TYPES[c.type], fav: c.fav});
    for (const k of Object.keys(MC.store.conv)) if (!rows.some(r => r.conv === k)) rows.push({conv: k, name: convName(k), ico: "•", sub: "history"});
    const f = filter.toLowerCase();
    return rows.filter(r => !f || r.name.toLowerCase().includes(f)).sort((a, b) => (MC.store.last[b.conv] || 0) - (MC.store.last[a.conv] || 0) || (b.fav ? 1 : 0) - (a.fav ? 1 : 0) || a.name.localeCompare(b.name));
  };
  const drawList = () => {
    const list = items();
    $("#cItems").innerHTML = list.length ? list.map(r => {
      const msgs = MC.store.conv[r.conv] || [], last = msgs[msgs.length - 1], un = MC.store.unread[r.conv];
      return `<div class="item ${r.conv === active ? "on" : ""}" data-conv="${esc(r.conv)}"><span>${esc(r.ico)}</span><b>${r.fav ? "★ " : ""}${esc(r.name)}</b>${un ? `<span class="badge">${un}</span>` : `<span class="val">${last ? new Date(last.t).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"}) : ""}</span>`}
        <span class="pv">${last ? esc((last.dir === "out" ? "You: " : last.from ? last.from + ": " : "") + last.text) : esc(r.sub)}</span></div>`;
    }).join("") : `<p class="val" style="padding:12px">${MC.self ? "No channels or contacts yet. Send an advert so others can find you." : "Loading…"}</p>`;
  };
  const statusIcon = m => m.status === "sending" ? "⏳" : m.status === "sent" ? (m.ack ? "✓ waiting" : "✓ sent") : m.status === "delivered" ? `✓✓ ${m.rtt ? (m.rtt / 1000).toFixed(1) + " s" : ""}` : m.status === "failed" ? "✗ " + esc(m.error || "failed") : "";
  const drawConv = keepScroll => {
    if (!active) return;
    const box = $("#cConv"), c = active.startsWith("c:") ? MC.contactByPrefix(active.slice(2)) : null, ch = active.startsWith("ch:") ? MC.channels.find(x => x.idx === +active.slice(3)) : null;
    const msgs = MC.store.conv[active] || [];
    const maxBytes = ch ? 160 - bytesLen((MC.self ? MC.self.name : "") + ": ") : 160;
    if (!$("#cMsgs")) {
      box.innerHTML = `<div class="hd"><button class="btn sm" id="cBack" style="display:none">←</button><h2>${esc(convName(active))}</h2><span class="val" id="cPath"></span>
          ${c && (c.type === 3 || c.type === 2) ? `<button class="btn sm" data-a="login">Log in</button>` : ""}${c ? `<button class="btn sm" data-a="contact">Contact…</button>` : ""}<button class="btn sm" data-a="clear">Clear history</button></div>
        <div class="msgs" id="cMsgs"></div>
        <div class="compose"><textarea id="cText" placeholder="Message${ch ? " to " + esc(convName(active)) : ""} (Enter to send, Shift+Enter new line)"></textarea><div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end"><span class="val" id="cCount"></span><button class="btn pri" id="cSend">Send</button></div></div>`;
      if (matchMedia("(max-width:820px)").matches) $("#cBack").style.display = "";
      const ta = $("#cText");
      const count = () => { const n = bytesLen(ta.value); $("#cCount").textContent = `${n}/${maxBytes}`; $("#cCount").className = "val" + (n > maxBytes ? " msg bad" : ""); };
      ta.addEventListener("input", count); count();
      ta.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#cSend").click(); } });
      $("#cSend").onclick = () => {
        const t = ta.value.trim(); if (!t) return;
        if (bytesLen(t) > maxBytes) return toast(`Too long: ${bytesLen(t)} of ${maxBytes} bytes`, "bad");
        ta.value = ""; count(); MC.sendText(active, t);
      };
      ta.focus();
    }
    $("#cPath").textContent = c ? `${TYPES[c.type]} · ${hopsLabel(c)}` : ch ? "channel" : "";
    const el = $("#cMsgs"), atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 60;
    el.innerHTML = msgs.length ? msgs.map(m => `<div class="bub ${m.dir === "out" ? "out" : ""} ${m.status === "failed" ? "failed" : ""}">${m.dir === "in" && m.from ? `<span class="who">${esc(m.from)}</span>` : ""}${m.kind === "cli" ? "⌨ " : ""}${esc(m.text)}
        <span class="meta">${new Date(m.t).toLocaleString([], {day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"})}${m.dir === "in" ? (m.hops != null ? ` · ${m.hops} hop${m.hops === 1 ? "" : "s"}` : " · direct") + (m.snr != null ? ` · SNR ${m.snr}` : "") : " · " + statusIcon(m)}${m.status === "failed" ? ` <a href="#" data-retry="${m.id}">retry</a>` : ""}</span></div>`).join("")
      : `<p class="val">No messages yet.${ch ? " Channel messages from everyone who shares this channel appear here." : ""}</p>`;
    if (!keepScroll || atBottom) el.scrollTop = el.scrollHeight;
  };
  const open = conv => {
    active = conv; MC.activeConv = conv; delete MC.store.unread[conv]; MC.saveStore();
    $("#cConv").innerHTML = ""; $("#chat").classList.add("inconv");
    drawList(); drawConv();
  };
  const offChange = MC.onChange(() => { if (!document.body.contains(view)) return offChange(); drawList(); drawConv(true); });
  view.addEventListener("input", e => { if (e.target.id === "cSearch") { filter = e.target.value; drawList(); } });
  view.addEventListener("click", async e => {
    const it = e.target.closest("[data-conv]"); if (it) return open(it.dataset.conv);
    const rt = e.target.closest("[data-retry]");
    if (rt) { e.preventDefault(); const m = (MC.store.conv[active] || []).find(x => x.id === rt.dataset.retry); if (m) MC.sendText(active, m.text, m); return; }
    const b = e.target.closest("button"); if (!b) return;
    try {
      if (b.id === "cBack") { $("#chat").classList.remove("inconv"); active = null; MC.activeConv = null; drawList(); }
      else if (b.id === "cAdvert") { await MC.request(u8(7, 1), [CODE.OK]); toast("Flood advert sent", "ok"); }
      else if (b.id === "cNotif") { if (!("Notification" in window)) return toast("This browser has no notifications", "bad"); const p = await Notification.requestPermission(); toast(p === "granted" ? "Notifications on (while this page is open)" : "Notifications blocked - browsers usually only allow them on https pages", p === "granted" ? "ok" : "bad"); }
      else if (b.dataset.a === "clear") { if (confirm("Clear this conversation's history in this browser?")) { delete MC.store.conv[active]; MC.saveStore(); $("#cMsgs").innerHTML = ""; drawConv(); drawList(); } }
      else if (b.dataset.a === "login") { const c = MC.contactByPrefix(active.slice(2)); const pw = prompt(`Password for ${c.name} (blank for guest):`, ""); if (pw === null) return; toast("Logging in over the mesh…"); const r = await MC.login(c, pw); toast(`Logged in to ${c.name}${r.admin ? " as admin" : ""}`, "ok"); }
      else if (b.dataset.a === "contact") { sessionStorage.setItem("umc_focus_contact", MC.contactByPrefix(active.slice(2)).key); go("contacts"); }
    } catch (err) { toast(err.message, "bad"); }
  });
  drawList();
  if (active) open(active);
}

// ---------------------------------------------------------------- Contacts page
async function renderContacts(view) {
  view.innerHTML = `<div class="card"><h2>Contacts</h2><p class="sub">Everyone this device knows. Stored on the device and shared by every app and this page.</p>
      <div class="row" style="margin-bottom:10px"><input type="text" id="ctSearch" placeholder="Search" style="max-width:220px">
        <select id="ctType" style="max-width:160px"><option value="">All types</option><option value="fav">Favourites</option><option value="1">Chat</option><option value="2">Repeaters</option><option value="3">Room servers</option><option value="4">Sensors</option></select>
        <button class="btn" id="ctRefresh">Refresh</button><button class="btn" id="ctAdvZ">Zero-hop advert</button><button class="btn" id="ctAdvF">Flood advert</button><button class="btn" id="ctMe">Share my contact…</button><button class="btn" id="ctImport">Add contact…</button></div>
      <div id="ctPending"></div>
      <div style="overflow-x:auto"><table><thead><tr><th></th><th>Name</th><th>Type</th><th>Path</th><th>Advert</th><th>Location</th><th></th></tr></thead><tbody id="ctBody"><tr><td colspan="7" class="val">Loading…</td></tr></tbody></table></div></div>
    <div id="ctDetail"></div>`;
  MC.start();
  let filter = "", type = "", open = sessionStorage.getItem("umc_focus_contact") || null;
  sessionStorage.removeItem("umc_focus_contact");
  const draw = () => {
    const f = filter.toLowerCase(), now = nowSecs();
    const list = [...MC.contacts.values()].filter(c => (!f || c.name.toLowerCase().includes(f) || c.key.startsWith(f)) && (!type || (type === "fav" ? c.fav : String(c.type) === type)))
      .sort((a, b) => (b.fav - a.fav) || (b.lastAdvert - a.lastAdvert));
    $("#ctBody").innerHTML = list.length ? list.map(c => `<tr><td>${c.fav ? "★" : ""}</td><td><a href="#" data-open="${c.key}"><b>${esc(c.name || c.prefix)}</b></a><div class="val">${c.key.slice(0, 16)}…</div></td>
        <td>${TYPE_ICO[c.type] || ""} ${esc(TYPES[c.type] || c.type)}</td><td>${esc(hopsLabel(c))}</td><td>${c.lastAdvert ? esc(ago(now - c.lastAdvert)) + " ago" : "—"}</td>
        <td>${c.lat || c.lon ? `<a href="https://www.openstreetmap.org/?mlat=${c.lat}&mlon=${c.lon}#map=13/${c.lat}/${c.lon}" target="_blank" rel="noopener">${c.lat.toFixed(3)}, ${c.lon.toFixed(3)}</a>` : "—"}</td>
        <td><button class="btn sm" data-open="${c.key}">Open</button></td></tr>`).join("")
      : `<tr><td colspan="7" class="val">${MC.self ? "No contacts match." : "Loading…"}</td></tr>`;
    $("#ctPending").innerHTML = MC.pending.size ? `<div class="warnbox"><b>New adverts waiting to be added</b> (manual add is on):<div class="row" style="margin-top:6px">${[...MC.pending.values()].map(c => `<span class="pill">${TYPE_ICO[c.type] || ""} ${esc(c.name)} <a href="#" data-add="${c.key}">add</a></span>`).join("")}</div></div>` : "";
    drawDetail();
  };
  const drawDetail = () => {
    const c = open && MC.contacts.get(open), box = $("#ctDetail");
    if (!c) { box.innerHTML = ""; return; }
    if (box.dataset.key === c.key && box.innerHTML) { $("#dtPath").textContent = hopsLabel(c); return; }
    box.dataset.key = c.key;
    const server = c.type === 2 || c.type === 3 || c.type === 4;
    box.innerHTML = `<div class="card"><h2>${TYPE_ICO[c.type] || ""} ${esc(c.name)}</h2><p class="sub">${esc(TYPES[c.type])} · <span id="dtPath">${esc(hopsLabel(c))}</span> · key <code>${c.key}</code></p>
      <div class="row">
        <button class="btn pri" data-d="msg">Message</button>
        ${server ? `<button class="btn" data-d="login">Log in…</button><button class="btn" data-d="status">Status</button>` : ""}
        <button class="btn" data-d="telem">Telemetry</button><button class="btn" data-d="trace">Trace path</button><button class="btn" data-d="discover">Discover path</button>
        <button class="btn" data-d="route">Set route…</button><button class="btn" data-d="tracecustom">Trace custom path…</button>
        <button class="btn" data-d="reset">Reset path</button><button class="btn" data-d="share">Share (zero-hop)</button><button class="btn" data-d="export">Export…</button>
        <button class="btn" data-d="fav">${c.fav ? "Unfavourite" : "Favourite"}</button><button class="btn danger" data-d="remove">Remove</button></div>
      <div id="dtOut" style="margin-top:12px"></div>
      ${server ? `<div style="margin-top:12px"><h2>Remote admin console</h2><p class="sub">Log in with the node's admin password first, then send CLI commands (e.g. <code>ver</code>, <code>get radio</code>, <code>neighbors</code>, <code>advert</code>). Replies travel back over the mesh.</p>
        <pre class="term" id="dtTerm" style="height:220px"></pre><div class="row"><input type="text" id="dtCmd" placeholder="command" style="max-width:360px"><button class="btn" data-d="cli">Send</button></div></div>` : ""}</div>`;
    const term = $("#dtTerm");
    if (term) {
      const hist = (MC.store.conv["c:" + c.prefix] || []).filter(m => m.kind === "cli").slice(-40);
      term.textContent = hist.map(m => (m.dir === "out" ? "> " : "") + m.text).join("\n");
      term.scrollTop = term.scrollHeight;
      $("#dtCmd").addEventListener("keydown", e => { if (e.key === "Enter") box.querySelector('[data-d="cli"]').click(); });
    }
  };
  const statGrid = o => `<div class="grid">${Object.entries(o).map(([k, v]) => `<div class="stat"><b>${esc(v)}</b><span>${esc(k)}</span></div>`).join("")}</div>`;
  const offCli = (() => { const fn = (prefix, m) => { const c = open && MC.contacts.get(open); const t = $("#dtTerm"); if (c && t && c.key.startsWith(prefix)) { t.textContent += (t.textContent ? "\n" : "") + m.text; t.scrollTop = t.scrollHeight; } }; MC.cliFns.add(fn); return () => MC.cliFns.delete(fn); })();
  const offChange = MC.onChange(() => { if (!document.body.contains(view)) { offChange(); offCli(); return; } draw(); });
  view.addEventListener("input", e => { if (e.target.id === "ctSearch") { filter = e.target.value; draw(); } if (e.target.id === "ctType") { type = e.target.value; draw(); } });
  view.addEventListener("change", e => { if (e.target.id === "ctType") { type = e.target.value; draw(); } });
  view.addEventListener("click", async e => {
    const o = e.target.closest("[data-open]"); if (o) { e.preventDefault(); open = o.dataset.open; $("#ctDetail").innerHTML = ""; draw(); $("#ctDetail").scrollIntoView({behavior: "smooth"}); return; }
    const ad = e.target.closest("[data-add]");
    if (ad) { e.preventDefault(); const c = MC.pending.get(ad.dataset.add); try { await MC.request(u8(9, c.raw.subarray(0, 147)), [CODE.OK]); MC.pending.delete(c.key); await MC.listContacts(); toast(`Added ${c.name}`, "ok"); draw(); } catch (err) { toast(err.message, "bad"); } return; }
    const b = e.target.closest("button"); if (!b) return;
    const c = open && MC.contacts.get(open), out = $("#dtOut");
    const busy = t => { if (out) out.innerHTML = `<p class="val">${esc(t)}</p>`; };
    try {
      if (b.id === "ctRefresh") { await MC.refreshAll(); toast("Contacts reloaded", "ok"); }
      else if (b.id === "ctAdvZ") { await MC.request(u8(7), [CODE.OK]); toast("Zero-hop advert sent", "ok"); }
      else if (b.id === "ctAdvF") { await MC.request(u8(7, 1), [CODE.OK]); toast("Flood advert sent", "ok"); }
      else if (b.id === "ctMe") { const uri = await MC.exportContact(null); prompt("Your contact (share this with others, they paste it into Add contact):", uri); }
      else if (b.id === "ctImport") {
        const t = prompt("Paste a contact (meshcore://… from an app or this page):"); if (!t) return;
        const raw = unhex(t.replace(/^meshcore:\/\//i, "").replace(/[^0-9a-f]/gi, ""));
        if (raw.length < 100) return toast("That doesn't look like an exported contact", "bad");
        await MC.request(u8(18, raw), [CODE.OK]); await MC.listContacts(); toast("Contact added", "ok"); draw();
      }
      else if (!c) return;
      else if (b.dataset.d === "msg") { MC.activeConv = "c:" + c.prefix; go("chat"); }
      else if (b.dataset.d === "login") { const pw = prompt(`Password for ${c.name} (blank = guest):`, ""); if (pw === null) return; busy("Logging in over the mesh…"); const r = await MC.login(c, pw); out.innerHTML = `<p class="msg ok">Logged in${r.admin ? " as admin" : ""}.</p>`; }
      else if (b.dataset.d === "status") {
        busy("Requesting status over the mesh…"); const s = await MC.status(c);
        out.innerHTML = statGrid({"Battery": (s.battery_mv / 1000).toFixed(2) + " V", "Uptime": fmtUp(s.uptime_secs), "Noise floor": s.noise_floor + " dBm", "Last RSSI / SNR": `${s.last_rssi} / ${s.last_snr ?? "—"}`,
          "Packets rx / tx": `${s.packets_recv} / ${s.packets_sent}`, "Flood rx / tx": `${s.recv_flood} / ${s.sent_flood}`, "Direct rx / tx": `${s.recv_direct} / ${s.sent_direct}`,
          "TX airtime": s.tx_air_secs + " s", "RX airtime": (s.rx_air_secs ?? "—") + " s", "TX queue": s.tx_queue, "Duplicates (flood/direct)": `${s.flood_dups ?? "—"} / ${s.direct_dups ?? "—"}`, "Errors": s.errors});
      }
      else if (b.dataset.d === "telem") { busy("Requesting telemetry over the mesh…"); const t = await MC.telemetry(c); out.innerHTML = t.length ? statGrid(Object.fromEntries(t.map(x => [`${x.name} (ch ${x.ch})`, x.value]))) : `<p class="val">No telemetry shared (the node may only share it with favourites / contacts).</p>`; }
      else if (b.dataset.d === "trace") {
        busy("Tracing…"); out.innerHTML = traceTable(await MC.trace(c));
      }
      else if (b.dataset.d === "discover") {
        busy("Discovering the path (flood request)…"); const p = await MC.discoverPath(c);
        const names = hs => hs.map(h => { const r = [...MC.contacts.values()].find(x => x.key.startsWith(h)); return r ? r.name : h; }).join(" → ") || "direct";
        out.innerHTML = `<p><b>Out:</b> ${esc(names(p.out.hashes))} (${p.out.hops} hops)<br><b>Back:</b> ${esc(names(p.back.hashes))} (${p.back.hops} hops)</p>`;
        await MC.listContacts(); MC.emitChange();
      }
      else if (b.dataset.d === "route") {
        const now = MC.pathHops(c).join(",");
        const t = prompt(`Route to ${c.name}: repeater ids in order from here, e.g. a1,b2,c3 (see Routes & trace for ids). Blank = flood and learn.`, now);
        if (t === null) return;
        await MC.setRoute(c, t.trim() ? MC.parseHops(t) : []);
        toast(t.trim() ? `Route set: ${t.trim()}` : "Route cleared - the next message floods", "ok"); $("#ctDetail").innerHTML = ""; draw();
      }
      else if (b.dataset.d === "tracecustom") {
        const hops0 = MC.pathHops(c);
        const t = prompt("Hops to trace (out and back), e.g. a1,b2,a1", hops0.concat(hops0.slice(0, -1).reverse()).join(","));
        if (!t) return;
        busy("Tracing…"); out.innerHTML = traceTable(await MC.traceHops(MC.parseHops(t)));
      }
      else if (b.dataset.d === "reset") { await MC.request(u8(13, unhex(c.key)), [CODE.OK]); await MC.listContacts(); toast("Path reset - the next message floods and learns a new route", "ok"); draw(); }
      else if (b.dataset.d === "share") { await MC.request(u8(16, unhex(c.key)), [CODE.OK]); toast(`Shared ${c.name} with nodes in direct range`, "ok"); }
      else if (b.dataset.d === "export") { prompt(`Contact for ${c.name} (copy and share):`, await MC.exportContact(c)); }
      else if (b.dataset.d === "fav") { await MC.setFavourite(c, !c.fav); $("#ctDetail").innerHTML = ""; draw(); }
      else if (b.dataset.d === "remove") { if (!confirm(`Remove ${c.name} from this device?`)) return; await MC.request(u8(15, unhex(c.key)), [CODE.OK]); MC.contacts.delete(c.key); open = null; draw(); toast("Removed", "ok"); }
      else if (b.dataset.d === "cli") {
        const inp = $("#dtCmd"), cmd = inp.value.trim(); if (!cmd) return; inp.value = "";
        const t = $("#dtTerm"); t.textContent += (t.textContent ? "\n" : "") + "> " + cmd; t.scrollTop = t.scrollHeight;
        MC.addMsg("c:" + c.prefix, {t: Date.now(), ts: nowSecs(), dir: "out", text: cmd, kind: "cli"}, true); MC.saveStore();
        await MC.request(u8(2, 1, 0, le32(nowSecs()), unhex(c.prefix), cmd), [CODE.SENT]);
      }
    } catch (err) { if (out && b.dataset.d && b.dataset.d !== "cli") out.innerHTML = `<p class="msg bad">${esc(err.message)}</p>`; else toast(err.message, "bad"); }
  });
  draw();
  if (!MC.self) await MC.refreshAll().catch(err => toast(err.message, "bad"));
  draw();
}

const traceTable = t => `<table><thead><tr><th>#</th><th>Hop</th><th>SNR heard there</th></tr></thead><tbody>${t.hops.map((h, i) =>
  `<tr><td>${i + 1}</td><td>${esc(MC.hopName(h))} <code>${h}</code></td><td>${t.snrs[i] != null ? t.snrs[i] + " dB" : "—"}</td></tr>`).join("")}
  <tr><td></td><td>back here</td><td>${t.final ?? "—"} dB</td></tr></tbody></table>`;

// ---------------------------------------------------------------- Routes & trace (client)
async function renderClientRoutes(view) {
  view.innerHTML = `<div class="card"><h2>Trace any path</h2><p class="sub">Hop ids are the first bytes of each repeater's key (shown below). List them out and back, e.g. <code>a1,b2,a1</code>; every repeater on the way reports the signal it heard.</p>
      <div class="row"><input type="text" id="rtPath" placeholder="a1,b2,a1" style="max-width:320px"><button class="btn pri" id="rtTrace">Trace</button></div><div id="rtOut" style="margin-top:10px"></div></div>
    <div class="card"><h2>Routes to your contacts</h2><p class="sub">The path direct messages take. <b>Set route</b> fixes it; <b>Discover</b> asks the mesh for the best one; <b>Reset</b> floods the next message so a new route is learnt.</p>
      <div style="overflow-x:auto"><table><thead><tr><th>Contact</th><th>Route</th><th></th></tr></thead><tbody id="rtBody"></tbody></table></div></div>
    <div class="card"><h2>Repeater ids</h2><p class="sub">Every repeater and room server this radio knows, with the ids used in routes.</p><div id="rtIds"></div></div>`;
  MC.start();
  const draw = () => {
    const list = [...MC.contacts.values()].sort((a, b) => a.name.localeCompare(b.name));
    $("#rtBody").innerHTML = list.length ? list.map(c => {
      const hops = MC.pathHops(c);
      const route = c.hops < 0 ? `<span class="val">flood (no route yet)</span>` : c.hops === 0 ? "direct"
        : hops.map(h => `${esc(MC.hopName(h) || "?")} <code>${h}</code>`).join(" → ");
      return `<tr><td>${TYPE_ICO[c.type] || ""} <b>${esc(c.name)}</b></td><td>${route}</td><td class="row">
        <button class="btn sm" data-rt="set" data-k="${c.key}">Set route</button><button class="btn sm" data-rt="discover" data-k="${c.key}">Discover</button>
        ${c.hops > 0 ? `<button class="btn sm" data-rt="trace" data-k="${c.key}">Trace</button>` : ""}<button class="btn sm" data-rt="reset" data-k="${c.key}">Reset</button></td></tr>`;
    }).join("") : `<tr><td colspan="3" class="val">No contacts yet.</td></tr>`;
    const ids = list.filter(c => c.type === 2 || c.type === 3);
    $("#rtIds").innerHTML = ids.length ? ids.map(c => `<span class="pill">${TYPE_ICO[c.type]} ${esc(c.name)} <code>${c.key.slice(0, 2)}</code> <code>${c.key.slice(0, 4)}</code></span>`).join(" ")
      : `<p class="val">No repeaters heard yet.</p>`;
  };
  const offChange = MC.onChange(() => { if (!document.body.contains(view)) return offChange(); draw(); });
  view.addEventListener("click", async e => {
    const b = e.target.closest("button"); if (!b) return;
    const out = $("#rtOut");
    try {
      if (b.id === "rtTrace") { out.innerHTML = `<p class="val">Tracing…</p>`; out.innerHTML = traceTable(await MC.traceHops(MC.parseHops($("#rtPath").value))); return; }
      const c = MC.contacts.get(b.dataset.k); if (!c) return;
      if (b.dataset.rt === "set") {
        const t = prompt(`Route to ${c.name}: repeater ids in order from here, e.g. a1,b2. Blank = flood and learn.`, MC.pathHops(c).join(","));
        if (t === null) return;
        await MC.setRoute(c, t.trim() ? MC.parseHops(t) : []); toast("Route saved", "ok");
      } else if (b.dataset.rt === "reset") { await MC.setRoute(c, []); toast("Route cleared", "ok"); }
      else if (b.dataset.rt === "trace") { out.innerHTML = `<p class="val">Tracing ${esc(c.name)}…</p>`; out.innerHTML = traceTable(await MC.trace(c)); window.scrollTo(0, 0); }
      else if (b.dataset.rt === "discover") { toast(`Discovering the route to ${c.name}…`); await MC.discoverPath(c); await MC.listContacts(); toast("Route updated", "ok"); }
      draw();
    } catch (err) { toast(err.message, "bad"); if (out) out.innerHTML = `<p class="msg bad">${esc(err.message)}</p>`; }
  });
  if (!MC.self) await MC.refreshAll().catch(() => {});
  draw();
}

// ---------------------------------------------------------------- Map (client and repeater)
// Map tiles come from OpenStreetMap, so the browser needs internet access (the device does not).
function loadLeaflet() {
  if (window.L) return Promise.resolve();
  return new Promise((resolve, reject) => {
    const css = document.createElement("link");
    css.rel = "stylesheet"; css.href = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css";
    document.head.appendChild(css);
    const js = document.createElement("script");
    js.src = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js";
    js.onload = resolve; js.onerror = () => reject(new Error("Couldn't load the map (this browser needs internet access)"));
    document.head.appendChild(js);
  });
}
async function renderMap(view) {
  view.innerHTML = `<div class="card" style="padding:0;overflow:hidden"><div id="mapBox" style="height:calc(100vh - 170px);min-height:380px"></div></div>
    <p class="val" id="mapNote">Loading map…</p>`;
  const points = [];
  if (isClient()) {
    MC.start();
    if (!MC.self) await MC.refreshAll().catch(() => {});
    if (MC.self && (MC.self.lat || MC.self.lon)) points.push({lat: MC.self.lat, lon: MC.self.lon, name: MC.self.name + " (this radio)", kind: "me"});
    for (const c of MC.contacts.values()) if (c.lat || c.lon) points.push({lat: c.lat, lon: c.lon, name: c.name, kind: TYPES[c.type], sub: hopsLabel(c)});
  } else {
    const r = await api.cli(["get lat", "get lon", "get name"]);
    const lat = parseFloat(val(r[0])), lon = parseFloat(val(r[1]));
    if (lat || lon) points.push({lat, lon, name: val(r[2]) + " (this repeater)", kind: "me"});
    try { for (const x of (await api.routes()).routes || []) if (x.lat != null && (x.lat || x.lon)) points.push({lat: x.lat, lon: x.lon, name: x.name || x.key, kind: x.type, sub: `${x.hops} hop(s)`}); } catch {}
  }
  try { await loadLeaflet(); }
  catch (err) {
    $("#mapBox").style.height = "auto";
    $("#mapBox").innerHTML = `<div style="padding:14px"><p class="msg bad">${esc(err.message)}</p><table><tbody>${points.map(p =>
      `<tr><td>${esc(p.name)}</td><td>${esc(p.kind || "")}</td><td><a href="https://www.openstreetmap.org/?mlat=${p.lat}&mlon=${p.lon}#map=13/${p.lat}/${p.lon}" target="_blank" rel="noopener">${p.lat.toFixed(4)}, ${p.lon.toFixed(4)}</a></td></tr>`).join("")}</tbody></table></div>`;
    $("#mapNote").textContent = "";
    return;
  }
  const map = L.map("mapBox");
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom: 18, attribution: "© OpenStreetMap contributors"}).addTo(map);
  const colour = k => k === "me" ? "#0b6bcb" : /repeater/.test(k || "") ? "#d97706" : /room/.test(k || "") ? "#16a34a" : "#7c3aed";
  const bounds = [];
  for (const p of points) {
    L.circleMarker([p.lat, p.lon], {radius: p.kind === "me" ? 9 : 7, color: "#fff", weight: 2, fillColor: colour(p.kind), fillOpacity: 0.95})
      .addTo(map).bindPopup(`<b>${esc(p.name)}</b><br>${esc(p.kind || "")}${p.sub ? " · " + esc(p.sub) : ""}`);
    bounds.push([p.lat, p.lon]);
  }
  if (bounds.length > 1) map.fitBounds(bounds, {padding: [30, 30]});
  else map.setView(bounds[0] || [54.0, -2.0], bounds.length ? 12 : 6);
  $("#mapNote").textContent = `${points.length} node(s) with a location. Blue = this device, orange = repeaters, green = room servers, purple = people.`;
}

  {label: "North West", scope: "northwest", channel: "", note: "Region scope only. Add the local channel on the Channels page if your group uses one."},

async function renderClientRegion(view) {
  view.innerHTML = `<div class="card"><h2>Region</h2><p class="sub">Regional meshes ask clients to scope their messages so they stay in the area. Repeaters that know the region pass them on; others can drop them.</p>

    <div class="card"><h2>Set up for your region</h2><div id="rgPresets"></div></div>

      <div class="row"><input type="text" id="rgScope" placeholder="yorkshire" style="max-width:220px"><button class="btn pri" id="rgSave">Save</button><button class="btn" id="rgClear">None</button></div></div>
    <div class="card"><h2>Room servers</h2><p class="sub">Room servers are contacts: they appear on the Contacts page when their advert is heard (or in the waiting list if manual add is on). Open one and use <b>Log in…</b>, then its posts arrive in Messages.</p>
      <div id="rgRooms"></div></div>`;

    $("#rgNow").innerHTML = [["Device scope", scope === "-" ? "none" : scope],
      ...MC.channels.map(c => [c.name, MC.channelScope(c.idx) || "(device scope)"])]
      .map(([k, v]) => `<div class="stat"><b>${esc(v)}</b><span>${esc(k)}</span></div>`).join("");
    $("#rgPresets").innerHTML = REGION_PRESETS.map((p, i) => {

        <div class="act"><button class="btn pri" data-preset="${i}">Set up ${esc(p.label)}</button></div></div>`;
    }).join("");
    const rooms = [...MC.contacts.values()].filter(c => c.type === 3);
    $("#rgRooms").innerHTML = rooms.length ? rooms.map(c => `<span class="pill">🏠 ${esc(c.name)} <a href="#" data-room="${c.key}">open</a></span>`).join(" ")
      : `<p class="val">No room servers heard yet.</p>`;
  };
  view.addEventListener("click", async e => {
    const room = e.target.closest("[data-room]");

    const b = e.target.closest("button"); if (!b) return;

      else if (b.id === "rgClear") { const r = await one("set scope"); toast(r, isErr(r) ? "bad" : "ok"); }

        const p = REGION_PRESETS[+b.dataset.preset];
        if (p.channel && !MC.channels.some(c => c.name === p.channel)) {
          let idx = -1; for (let i = 0; i < 40; i++) if (!MC.channels.some(c => c.idx === i)) { idx = i; break; }
          if (idx < 0) return toast("All channel slots are in use", "bad");
          await MC.request(u8(32, idx, fixed(p.channel, 32), hashtagKey(p.channel)), [CODE.OK]);
          await MC.listChannels();
        }
        if (p.channel) MC.setChannelScope(p.channel, p.scope);
        else { const r = await one(`set scope ${p.scope}`); if (isErr(r)) throw new Error(r); }
        toast(`${p.label} set up`, "ok");
      }
      await draw();
    } catch (err) { toast(err.message, "bad"); }
