<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Ultimate MeshCore</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1b1f24;--muted:#626b75;--line:#dde1e6;--acc:#0b6bcb;--acc-ink:#fff;--ok:#1a7f37;--warn:#9a6700;--bad:#cf222e;--chip:#eef1f4;--code:#0f1419;--code-ink:#d6dde6;--r:10px}
@media (prefers-color-scheme:dark){:root{--bg:#0f1216;--card:#171b21;--ink:#e6e9ed;--muted:#98a2ad;--line:#2a313a;--acc:#4c9aff;--acc-ink:#07121f;--ok:#3fb950;--warn:#d29922;--bad:#f85149;--chip:#222831;--code:#0a0d10;--code-ink:#c9d1d9}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
a{color:var(--acc)}button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
#app{display:flex;min-height:100vh}
nav{width:220px;flex:none;background:var(--card);border-right:1px solid var(--line);padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto}
nav .brand{font-weight:700;font-size:15px;padding:4px 10px 12px}nav .brand small{display:block;font-weight:400;color:var(--muted);font-size:12px}
nav button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--ink)}
nav button:hover{background:var(--chip)}nav button.on{background:var(--acc);color:var(--acc-ink)}
nav .ico{width:18px;text-align:center}
main{flex:1;min-width:0;padding:18px 22px 60px;max-width:1100px}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
header.top h1{font-size:20px;margin:0;flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:99px;background:var(--chip);color:var(--muted);font-size:12px;white-space:nowrap}
.pill.ok{color:var(--ok)}.pill.bad{color:var(--bad)}.pill.warn{color:var(--warn)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 4px}.card .sub{color:var(--muted);margin:0 0 12px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.stat{background:var(--chip);border-radius:8px;padding:10px}.stat b{display:block;font-size:18px}.stat span{color:var(--muted);font-size:12px}
.field{display:grid;grid-template-columns:minmax(160px,240px) 1fr auto;gap:8px 12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.field:first-of-type{border-top:0}
.field label{font-weight:600}.field .help{grid-column:1/-1;color:var(--muted);font-size:12px;margin-top:-4px}
.field .ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
input[type=text],input[type=password],input[type=number],select,textarea{width:100%;max-width:420px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:-1px}
.dirty input,.dirty select,.dirty textarea{border-color:var(--warn)}
.btn{border:1px solid var(--line);background:var(--card);padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--acc)}.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}.btn.sm{padding:4px 9px;font-size:12px}.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.switch{position:relative;width:42px;height:24px;flex:none}.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:.15s;cursor:pointer}
.switch span:before{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;background:#fff;border-radius:50%;transition:.15s}
.switch input:checked+span{background:var(--acc)}.switch input:checked+span:before{transform:translateX(18px)}
.val{color:var(--muted);font-size:12px;word-break:break-all}
.msg{font-size:12px}.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
pre,.term{background:var(--code);color:var(--code-ink);border-radius:8px;padding:10px;overflow:auto;font:12px/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-word}
.term{height:340px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:6px 8px;border-top:1px solid var(--line);font-size:13px}th{color:var(--muted);font-weight:600;border-top:0}
.toast{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:50}
.toast div{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);padding:9px 12px;border-radius:8px;box-shadow:0 4px 18px #0003;max-width:360px}
.toast .bad{border-left-color:var(--bad)}.toast .ok{border-left-color:var(--ok)}
.overlay{position:fixed;inset:0;background:var(--bg);z-index:40;overflow:auto;padding:24px 16px}
.panel{max-width:560px;margin:5vh auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
.panel h1{margin:0 0 6px;font-size:22px}.panel p{color:var(--muted)}
.steps{display:flex;gap:4px;margin:10px 0 18px}.steps i{flex:1;height:4px;border-radius:4px;background:var(--line)}.steps i.on{background:var(--acc)}
.stack>*{margin-bottom:12px}.stack label{display:block;font-weight:600;margin-bottom:4px}
.list{border:1px solid var(--line);border-radius:8px;max-height:220px;overflow:auto}
.list button{display:flex;justify-content:space-between;width:100%;border:0;border-top:1px solid var(--line);background:none;padding:8px 10px;cursor:pointer;text-align:left}
.list button:first-child{border-top:0}.list button:hover{background:var(--chip)}
.warnbox{border:1px solid var(--warn);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:12px}
.progress{height:8px;background:var(--line);border-radius:8px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
#menuBtn{display:none}
@media (max-width:820px){#app{display:block}nav{position:fixed;left:0;top:0;z-index:30;transform:translateX(-100%);transition:.2s;box-shadow:0 0 30px #0005}nav.open{transform:none}#menuBtn{display:inline-block}main{padding:14px 16px 60px}.field{grid-template-columns:1fr}.field .act{justify-self:start}}
/* ---- Dashboard: dials, charts, connections and data flow ---- */
.dash2{--g:#2fe27a;--g2:#8dffb0;--cd:#0d1b17;--ln:#1b3a30;--tx:#e9f7ef;--mu:#7fa392;--am:#f2c14e;--bl:#4aa8ff;--pu:#a58bff;--rd:#ff5d6c;color:var(--tx);border-radius:16px;padding:16px;
  background:radial-gradient(1100px 480px at 15% -8%,#10301f 0,transparent 62%),radial-gradient(900px 420px at 100% 0,#0b2a2a 0,transparent 60%),#07100d}
.dash2 a{color:var(--g)}
.dash2 .hd{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}
.dash2 .hd h1{margin:0;font-size:26px;letter-spacing:.2px}.dash2 .hd h1 span{color:var(--g)}
.dash2 .hd p{margin:2px 0 0;color:var(--mu);font-size:13px}
.dash2 .hd .sp{flex:1}
.dash2 .pl{display:inline-flex;gap:6px;align-items:center;padding:4px 11px;border-radius:99px;background:#0d2219;border:1px solid var(--ln);color:var(--mu);font-size:12px}
.dash2 .pl.ok{color:var(--g)}.dash2 .pl.warn{color:var(--am)}.dash2 .pl.bad{color:var(--rd)}
.dash2 .dot{width:8px;height:8px;border-radius:50%;background:var(--mu);display:inline-block;box-shadow:0 0 8px currentColor}
.dash2 .dot.ok{background:var(--g);color:var(--g)}.dash2 .dot.warn{background:var(--am);color:var(--am)}.dash2 .dot.bad{background:var(--rd);color:var(--rd)}.dash2 .dot.idle{background:#4d6a5c;color:#4d6a5c;box-shadow:none}
.dash2 .rng button,.dash2 .tool{background:#0d2219;color:var(--mu);border:1px solid var(--ln);border-radius:8px;padding:4px 10px;cursor:pointer;font-size:12px}
.dash2 .rng button.on{color:#06140c;background:var(--g);border-color:var(--g)}
.dash2 .tool:hover,.dash2 .rng button:hover{border-color:var(--g);color:var(--tx)}
.dash2 .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:10px;margin-bottom:12px}
.dash2 .k,.dash2 .pn{background:linear-gradient(180deg,#0e1f19,#0b1814);border:1px solid var(--ln);border-radius:14px;padding:14px;box-shadow:0 0 0 1px #08140f inset,0 8px 24px #0006}
.dash2 .k{display:flex;gap:10px;align-items:center;position:relative;padding:12px}.dash2 .k>div:nth-child(2){min-width:0;flex:1}
.dash2 .k .ic{flex:none;width:40px;height:40px;border-radius:11px;background:#0f3a28;color:var(--g);display:grid;place-items:center;font-size:21px;box-shadow:0 0 16px #22d36a40;border:1px solid #1f6a45}
.dash2 .k small{color:var(--mu);font-size:11.5px;display:block}.dash2 .k b{font-size:24px;line-height:1.15;display:block}
.dash2 .tr{font-size:12px;color:var(--mu)}.dash2 .tr.up{color:var(--g)}.dash2 .tr.down{color:var(--am)}.dash2 .tr.bad{color:var(--rd)}
.dash2 .k svg.sp{position:absolute;right:10px;bottom:8px;width:56px;height:22px;opacity:.85}
.dash2 .panels{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}
.dash2 .s12{grid-column:span 12}.dash2 .s8{grid-column:span 8}.dash2 .s7{grid-column:span 7}.dash2 .s6{grid-column:span 6}.dash2 .s5{grid-column:span 5}.dash2 .s4{grid-column:span 4}
@media(max-width:1000px){.dash2 .s8,.dash2 .s7,.dash2 .s6,.dash2 .s5,.dash2 .s4{grid-column:span 12}}
.dash2 .pn h3{margin:0 0 8px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}.dash2 .pn h3 em{font-style:normal;color:var(--mu);font-weight:400;font-size:12px;margin-left:auto}
.dash2 .chart{position:relative}.dash2 .chart svg{width:100%;height:auto;display:block}
.dash2 .gl{stroke:#17342a;stroke-width:1}.dash2 .ax{fill:#6f9483;font-size:10px}
.dash2 .ln{filter:drop-shadow(0 0 4px currentColor)}
.dash2 .empty{padding:36px 10px;text-align:center;color:var(--mu);font-size:13px}
.dash2 .tip{position:absolute;pointer-events:none;background:#06130d;border:1px solid var(--g);border-radius:8px;padding:6px 9px;font-size:12px;white-space:nowrap;z-index:5;display:none}
.dash2 .lgd{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mu);margin-top:4px}.dash2 .lgd i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.dash2 .dials{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px}
.dash2 .gauge{text-align:center}.dash2 .gauge svg{width:100%;max-width:170px}
.dash2 .gt{fill:none;stroke:#143027;stroke-width:9;stroke-linecap:round}.dash2 .gv{fill:none;stroke-width:9;stroke-linecap:round}
.dash2 .gn{fill:var(--tx);font-size:19px;font-weight:700}.dash2 .gs{fill:var(--mu);font-size:7.5px}
.dash2 .gl2{color:var(--mu);font-size:12px;margin-top:-6px}
.dash2 .dn{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.dash2 .dn svg{width:150px;flex:none}
.dash2 .dn ul{list-style:none;margin:0;padding:0;font-size:12.5px;flex:1;min-width:140px}.dash2 .dn li{display:flex;gap:7px;align-items:center;padding:2px 0}.dash2 .dn li b{margin-left:auto;font-weight:600}.dash2 .dn li s{text-decoration:none;color:var(--mu)}
.dash2 .dn .ct{fill:var(--tx);font-size:18px;font-weight:700}.dash2 .dn .cs{fill:var(--mu);font-size:7px}
.dash2 table{width:100%;border-collapse:collapse;font-size:13px}.dash2 th{color:var(--mu);font-weight:500;text-align:left;font-size:12px;padding:4px 6px}.dash2 td{white-space:nowrap}.dash2 td b{white-space:normal}.dash2 td{padding:6px;border-top:1px solid #12291f}
.dash2 .bar{height:7px;border-radius:4px;background:#12291f;min-width:70px}.dash2 .bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#1fb85c,var(--g2))}
.dash2 .tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;background:#10301f;color:var(--g)}.dash2 .tag.tx{background:#33280f;color:var(--am)}
.dash2 .conn{display:flex;flex-direction:column;gap:2px}.dash2 .conn div{display:flex;gap:10px;align-items:center;padding:7px 4px;border-top:1px solid #12291f}.dash2 .conn div:first-child{border-top:0}
.dash2 .conn b{font-weight:600}.dash2 .conn span{color:var(--mu);font-size:12px;margin-left:auto;text-align:right}
.dash2 .flow svg{width:100%;height:auto}
.dash2 .fn rect{fill:#0c2018;stroke:#1f6a45;stroke-width:1.2}.dash2 .fn.off rect{stroke:#2a3a34;fill:#0a1511}.dash2 .fn text{fill:var(--tx);font-size:12px;font-weight:600}.dash2 .fn .sb{fill:var(--mu);font-size:10px;font-weight:400}
.dash2 .fn.hub rect{stroke:var(--g);stroke-width:2;filter:drop-shadow(0 0 10px #2fe27a66)}
.dash2 .fe{fill:none;stroke:#1d3d31;stroke-width:2.2}.dash2 .fe.on{stroke:var(--g);stroke-dasharray:7 9;animation:dfl var(--d,1.6s) linear infinite;filter:drop-shadow(0 0 3px #2fe27a88)}
.dash2 .fe.tx.on{stroke:var(--am);filter:drop-shadow(0 0 3px #f2c14e88)}.dash2 .fe.net.on{stroke:var(--bl);filter:drop-shadow(0 0 3px #4aa8ff88)}
.dash2 .fl{fill:var(--mu);font-size:10px}
@keyframes dfl{to{stroke-dashoffset:-32}}
.dash2 .digi{white-space:nowrap;font-family:ui-monospace,Consolas,monospace;font-size:30px;letter-spacing:2px;color:var(--g2);text-shadow:0 0 14px #2fe27a88}
.dash2 .qa{display:flex;gap:8px;flex-wrap:wrap}
.dash2 .warnb{background:#33280f;border:1px solid var(--am);color:var(--am);border-radius:10px;padding:8px 12px;margin-bottom:12px}
.dash2 .fe.on{marker-end:url(#dar-g)}.dash2 .fe.tx.on{marker-end:url(#dar-a)}.dash2 .fe.net.on{marker-end:url(#dar-b)}

/* ---- help: a ? beside every feature, and a description under every page title ---- */
.q{display:inline-grid;place-items:center;width:18px;height:18px;margin-left:7px;border-radius:50%;border:1px solid var(--line,#c9d1d9);background:transparent;color:var(--muted,#6b7280);font:700 11px/1 system-ui,sans-serif;cursor:pointer;vertical-align:middle;padding:0;flex:none}
.q:hover,.q[aria-expanded=true],.q:focus-visible{background:var(--accent,#0b6bcb);border-color:var(--accent,#0b6bcb);color:#fff;outline:none}
.helpbox{grid-column:1/-1;margin:8px 0 4px;padding:12px 14px;border-radius:10px;border:1px solid var(--line,#d0d7de);background:var(--soft,rgba(11,107,203,.06));font-size:13px;line-height:1.45;font-weight:400;text-align:left;letter-spacing:0;text-transform:none}
.helpbox h4,.helppop h4{margin:0 0 2px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent,#0b6bcb)}
.helpbox p,.helppop p{margin:0 0 9px}.helpbox p:last-child,.helppop p:last-child{margin-bottom:0}
.helppop{position:absolute;z-index:60;width:min(380px,92vw);padding:12px 14px;border-radius:12px;background:#07130d;border:1px solid #2fe27a;color:#e9f7ef;box-shadow:0 12px 36px #000a;font-size:13px;line-height:1.45;font-weight:400;text-transform:none;letter-spacing:0}
.helppop h4{color:#2fe27a}
.dash2 .q{border-color:#2a5a46;color:#8fb3a1}.dash2 .q:hover,.dash2 .q[aria-expanded=true]{background:#2fe27a;border-color:#2fe27a;color:#06140c}
.about{margin:0 0 12px;border:1px solid var(--line,#d0d7de);border-radius:12px;background:var(--card,#fff);overflow:hidden}
.about>button{display:flex;width:100%;gap:8px;align-items:center;padding:9px 14px;border:0;background:transparent;color:var(--muted,#57606a);font:600 13px system-ui,sans-serif;cursor:pointer;text-align:left}
.about>button::after{content:"▾";margin-left:auto}.about.shut>button::after{content:"▸"}
.about .ab{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:4px 22px;padding:0 14px 12px;font-size:13px;line-height:1.45}
.about.shut .ab{display:none}.about h4{margin:6px 0 2px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent,#0b6bcb)}.about p{margin:0}
</style>
</head>
<body>
<div id="login" class="overlay hidden"><div class="panel stack">
  <h1>Ultimate MeshCore</h1><p id="loginInfo">Sign in with the admin password.</p>
  <div><label for="pw">Admin password</label><input id="pw" type="password" autocomplete="current-password"></div>
  <div class="row"><button class="btn pri" id="loginBtn">Sign in</button><span id="loginMsg" class="msg bad"></span></div>
</div></div>

<div id="wizard" class="overlay hidden"><div class="panel"><div id="wiz"></div></div></div>

<div id="app" class="hidden">
  <nav id="nav"><div class="brand">Ultimate MeshCore<small id="navSub"></small></div><div id="navItems"></div></nav>
  <main>
    <header class="top">
      <button class="btn" id="menuBtn" aria-label="Menu">☰</button>
      <h1 id="title">Dashboard</h1>
      <span class="pill" id="pillNet"></span><span class="pill" id="pillRole"></span>
      <button class="btn sm" id="logoutBtn">Sign out</button>
    </header>
    <div id="about"></div>
    <div id="view"></div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script data-dev-only src="mock.js"></script>
<script>
"use strict";
// ================================================================ API
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const validRegion = s => /^[a-z0-9-]{1,29}$/.test(String(s || ""));
let TOKEN = sessionStorage.getItem("umc_token") || "";
let cliQueue = Promise.resolve();
let INFO = null;

async function http(method, url, body, headers = {}) {
  if (window.UMC_MOCK) return window.UMC_MOCK(method, url, body);
  const h = Object.assign({}, headers);
  if (TOKEN) h["X-Auth-Token"] = TOKEN;
  let r;
  // The device serves only a few sockets; a dropped keep-alive connection surfaces as a
  // network error, so retry a couple of times before declaring the device unreachable.
  for (let attempt = 0; ; attempt++) {
    try { r = await fetch(url, {method, headers: h, body, cache: "no-store"}); break; }
    catch (err) {
      if (attempt < 2 && method === "GET" || attempt < 2 && url === "/api/cli") { await new Promise(res => setTimeout(res, 600 + attempt * 900)); continue; }
      showOffline(); throw new Error("Lost connection to the device");
    }
  }
  const txt = await r.text();
  let data; try { data = JSON.parse(txt); } catch { data = {error: txt || r.statusText}; }
  if (r.status === 401 && url !== "/api/login") { TOKEN = ""; sessionStorage.removeItem("umc_token"); showLogin(); }
  if (!r.ok) throw new Error((data && data.error) || r.statusText);
  return data;
}
const api = {
  info: () => http("GET", "/api/info"),
  login: pw => http("POST", "/api/login", pw),
  logout: () => http("POST", "/api/logout", ""),
  scan: refresh => http("GET", "/api/scan" + (refresh ? "?refresh=1" : "")),
  routes: () => http("GET", "/api/routes"),
  traffic: () => http("GET", "/api/traffic"),
  // CLI batches are serialised: one request in flight at a time keeps the device's socket pool free.
  cli: cmds => {
    const run = async () => {
      const list = Array.isArray(cmds) ? cmds : [cmds];
      const out = [];
      for (let i = 0; i < list.length; i += 16) out.push(...await http("POST", "/api/cli", list.slice(i, i + 16).join("\n")));
      return out;
    };
    const p = cliQueue.then(run, run);
    cliQueue = p.catch(() => {});
    return p;
  },
};
const one = async c => (await api.cli([c]))[0] || "";
const val = r => String(r ?? "").replace(/^\s*>\s?/, "").trim();
const isErr = r => /^\s*(err|error|\?\?|unknown|invalid|bad )/i.test(String(r ?? ""));

// Shown when the browser can't reach the device: rebooting, or it moved from the hotspot to home WiFi.
let offlineTimer = null;
function showOffline() {
  if (offlineTimer || window.UMC_MOCK) return;
  const net = (INFO && INFO.net) || {}, sta = net.sta || {};
  const links = [];
  if (sta.ip && location.hostname !== sta.ip) links.push(`http://${sta.ip}/`);
  if (net.hostname && location.hostname !== net.hostname + ".local") links.push(`http://${net.hostname}.local/`);
  const box = document.createElement("div");
  box.className = "overlay"; box.id = "offline";
  box.innerHTML = `<div class="panel"><h1>Device not reachable</h1>
    <p>It may be rebooting (e.g. after an update), or it has left the setup hotspot and joined your home WiFi.</p>
    ${links.length ? `<p>Reconnect this ${/Mobi/.test(navigator.userAgent) ? "phone" : "computer"} to your home WiFi, then open:</p>${links.map(l => `<pre><a href="${esc(l)}">${esc(l)}</a></pre>`).join("")}` : ""}
    <p class="val" id="offlineRetry">Retrying automatically…</p></div>`;
  document.body.appendChild(box);
  let tries = 0;
  offlineTimer = setInterval(async () => {
    tries++; $("#offlineRetry").textContent = `Retrying automatically… (${tries})`;
    try { const r = await fetch("/api/info", {cache: "no-store"}); if (r.ok) location.reload(); } catch {}
  }, 4000);
}

function toast(text, kind = "") {
  const d = document.createElement("div"); d.className = kind; d.textContent = text;
  $("#toast").appendChild(d); setTimeout(() => d.remove(), kind === "bad" ? 7000 : 3500);
}

function roleOk(roles) { return !roles || (INFO && roles.includes(INFO.role)); }

const HELP = {"sec":{"dash":["A live overview of this radio: cards with the numbers that matter, charts of traffic and airtime, dials for battery, signal and noise, a picture of what is connected and moving, and the latest packets.","Tells you at a glance whether the node is healthy, busy, well connected and heard by others, so you can spot problems (a dead WiFi link, a noisy channel, a flat battery) before they matter.","Just open it; it refreshes every 15 seconds. Pick 1 h, 6 h or 24 h to change the chart range. The history is kept in this browser, one reading a minute, so leave the page open to fill the charts. Press the ? beside any card, dial or panel to learn what it means."],"chat":["Your conversations: public channels and private chats with other nodes, shown like a normal messenger.","This is how you actually talk over the mesh from a computer instead of the phone app.","Pick a conversation on the left, type in the box and press Send. Messages show a tick when delivered and how many hops they travelled."],"contacts":["The list of other nodes this radio knows: people, repeaters, room servers and sensors, with how far away they are and when they last announced themselves.","You need a contact before you can send a private message, log in to a repeater or room, or ask a node for its status.","Contacts are added when adverts are heard (see Messaging settings for automatic adding), or with Add. Open a contact for actions such as message, status, trace or remove; star favourites to protect them."],"channels":["Group chat channels. A channel is a shared name and secret key; everyone with the same key reads the same conversation.","Channels let a club, family or area talk together, separate from private chats. The Public channel is open to everyone.","Add a channel with a name and key (or a #hashtag name, which makes its key from the name), switch channels on the Messages page, and share the key only with the people who should read it."],"clroutes":["The route table and tracing tools for a client radio: the path a message takes to each contact and the signal quality of every hop.","Lets you see why a contact is unreachable or slow, and which repeater in the chain is weakest.","Find a contact, press Trace to send a test packet out and back, and read the SNR for each hop. You can also pin a route by hand."],"map":["A map of every node that has shared a location, with this device marked.","Shows your coverage, which repeaters are near, and how far away the nodes you hear really are.","Drag and zoom like any map; click a dot for the name, type and hops. Blue is this device, orange repeaters, green room servers, purple people. Nodes only appear when they advertise a location."],"clregion":["Region setup for a client radio: the region name that is added to your flood messages.","A region keeps your messages local. Repeaters that don't allow your region won't pass them on, so the wider mesh stays quiet.","Choose your country or area preset (or type the exact region name) and Save. Use the same names as the repeaters near you."],"radio":["The LoRa radio settings: frequency, bandwidth, spreading factor, transmit power and how the receiver behaves.","These decide who you can hear and who can hear you. Every node in a mesh must share frequency, bandwidth and spreading factor, and the power and duty cycle keep you inside the law.","Pick the preset your local mesh uses, or enter the values, then Save. Changes apply at once; no reboot needed. The Temporary radio test action tries settings for a few minutes and then puts the old ones back."],"msgset":["How this client sends messages, adds contacts, shares its location and what it tells others.","Controls your privacy (who sees your battery and position), how reliably messages arrive, and how full your contact list gets.","Change a setting and press Save beside it. The groups run from sending behaviour, through automatic adding of contacts, to telemetry sharing and the storage gauge."],"apps":["Bluetooth and WiFi connections for phone and computer apps.","Apps such as the MeshCore phone app, Home Assistant or scripts need a link to the radio; this page switches those links on and shows who is connected.","Turn Bluetooth on and pair with the PIN shown on the display (or set a fixed PIN). Turn on the WiFi (TCP) link for network apps; they connect to this radio's IP on port 5000."],"mesh":["Forwarding rules for a repeater: whether it relays, how far floods may travel, how it waits before repeating, and how often it announces itself.","A repeater's behaviour decides how well the mesh works. Too many hops or too-frequent adverts flood the channel; too few and distant nodes can't hear each other.","Start from your local mesh group's recommended values (the Yorkshire recommended settings action applies the Yorkshire guide in one go). Change one value at a time and Save."],"id":["This node's name, position, owner details, public key and passwords.","The name and position identify you on maps and contact lists; the passwords protect the node from being reconfigured by someone else.","Set a recognisable name, optionally a rounded position, and a strong admin password of at least 8 characters. Never reuse the admin password as the guest password."],"regions":["The region tree of a repeater: which named regions it will repeat flood messages for.","Regions keep local chat local. A repeater that only repeats its own region's floods stops them spreading across the whole country.","Use a preset for your area, or add regions yourself. Turn Flooding on for regions you want repeated, set a home region, then press Save regions: changes work at once but are lost on reboot until saved."],"net":["The radio's WiFi: saved networks, address, hostname, hotspot, web and command-line services and the clock.","WiFi is how you reach this page, how the radio gets the time, updates firmware and talks to MQTT.","Add up to three WiFi networks and the radio tries them in order. If none work for a minute it starts a rescue hotspot (192.168.4.1) so you can fix it. Change a setting and Save."],"mqtt":["Uploads of what this repeater hears, sent over the internet to a broker (a shared message server) for maps, analysers or your own network.","Lets people see live coverage, and lets you link repeaters over the internet with UMC Net.","Set the area code first, switch on up to two brokers (or your own custom one), choose what to publish, and watch the Status line show up when connected. For UMC Net also turn on raw packets and the bridge."],"bridge":["A bridge joins two radio areas through another medium: ESP-NOW (2.4 GHz) between two nearby devices, or a serial link.","It links two repeaters that cannot hear each other on LoRa, so a mesh in two places acts as one.","Pick the bridge type, set the same channel and secret on both ends, then switch it on. The ESP-NOW channel must match your WiFi channel."],"power":["Power saving, battery calibration, GPS, the built-in display and information about the board.","Helps a battery or solar node last longer, keeps the battery gauge honest, and sets what the little screen shows.","Adjust, Save, and watch the Dashboard battery dial. The display options set how long each screen is shown and when it blanks."],"neigh":["The repeaters this node hears directly on air, with signal quality and how long ago.","Shows who you are really connected to by radio, which is the basis of any route through the mesh.","Read the table; Forget removes a stale entry; Discover neighbours asks nearby repeaters to announce themselves."],"routes":["Every node this repeater has heard an advert from, and the chain of repeaters that advert travelled through. Plus a trace tool.","Shows how far away each node is and by which route, and lets you test a path hop by hop.","Type in Find to filter. Press Trace on a node to send a test packet out and back and read each hop's SNR. Pin or unpin a route, or trace a custom list of repeaters."],"traffic":["A live list of the last 16 packets this node received and sent, with type, route, hops, signal strength and size.","Shows exactly what is on the channel right now, which helps you find chatty nodes, loops or interference.","Watch it update every 3 seconds. Use the filters for received or sent and for packet type, and Pause to read a busy moment."],"console":["A command line for this radio, the same one used over USB and telnet.","Anything the settings pages don't cover, and quick checks, can be done here.","Type a command such as ver, get radio or stats-core and press Enter. Commands starting with get read a value, set changes it. Take care: it can change anything."],"fw":["Firmware updates and version information: the installed version, three ways to update, and maintenance actions.","New firmware brings fixes and features. Keeping the radio current is the best protection against known bugs.","Press Check to see if a newer build exists. Update through this browser (the page downloads it and sends it to the radio), by the device itself over WiFi, or from a file you chose. Identity and settings are kept; a bad update rolls back."],"backup":["Saving and restoring this node's settings and identity to a file.","A backup lets you rebuild a node after a failure or move it to new hardware without losing its name, keys and configuration.","Press Download to save a file (keep it safe: it contains the private key). To restore, choose the file and press Restore; the node restarts."]},"f":{"radio":["The LoRa radio channel: centre frequency (MHz), bandwidth (kHz), spreading factor (SF) and coding rate (CR).","Choose your country's preset or enter the four values, for example 869.618, 62.5, 8, 8, then Save. It applies at once; no reboot.","Nodes only hear each other when frequency, bandwidth and SF match (the coding rate may differ). A higher SF and a narrower bandwidth reach further but are slower and use more airtime."],"tx":["Transmit power at the radio chip, in dBm.","Enter 1 to 22. Boards with a power amplifier (such as the Heltec V4) add gain on top, so the real output is higher. Use the lowest value that reliably reaches your neighbours.","More power drains the battery, heats the board and causes interference, and your licence or local rules set a legal limit."],"dutycycle":["The most of the time this repeater may spend transmitting, as a percentage.","Enter 1 to 100. On UK and EU 869.4 to 869.65 MHz the legal limit is 10.","Keeps a busy repeater inside the legal airtime limit and stops it hogging the channel. When the limit is reached, packets wait or are dropped."],"af":["Airtime factor: how long this client waits after a transmission before it may send again.","1 means wait as long as the last transmission took, 0 means no extra wait, higher waits longer. Leave the default unless the channel is congested.","Spreads your transmissions out so you stay within duty-cycle limits and leave room for other people."],"radio.rxgain":["Boosted receive gain: runs the receiver in its more sensitive mode.","Switch On (the default) or Off and Save.","Hears weaker signals for slightly more current. Turn it off only to save power on a battery node."],"radio.fem.rxgain":["The external low-noise amplifier (LNA) in the board's front-end module, on boards that have one, such as the Heltec V4.","On for the best weak-signal reception; try Off if a strong nearby transmitter overloads the receiver.","An external LNA extends range, but very strong signals can swamp it."],"agc.reset.interval":["How often, in seconds, the receiver's automatic gain control is reset.","0 turns it off; otherwise enter a multiple of 4. A value of 4 is the usual fix.","A strong nearby signal can leave the receiver 'deaf' to weak ones; resetting the gain cures it."],"cad":["Channel activity detection: listening for LoRa activity just before transmitting.","Switch On or Off and Save.","Avoids starting a transmission on top of someone else's, which reduces collisions on a busy channel."],"int.thresh":["Interference threshold: how noisy the channel may be before this node holds back from transmitting.","0 turns it off; raise it (up to 50) to make the node more cautious.","Prevents transmitting into heavy interference, where the packet would be lost anyway."],"rxdelay":["Experimental: delays handling of weaker copies of a flood so the strongest copy is handled first.","0 is off. Try 0.5 to 20 only on a busy mesh and watch the results.","Lets the repeater with the best signal forward first, so weaker duplicates are suppressed and airtime is saved."],"multi.acks":["Sends each delivery acknowledgement twice.","Choose Off or On.","A second copy makes it more likely that a confirmation arrives over a busy or marginal link, at the cost of a little airtime."],"path.hash.mode":["How many bytes identify each repeater in recorded paths and adverts: 1, 2 or 3.","Leave it at 1 byte unless your mesh uses larger IDs. Larger IDs need repeaters on firmware 1.14 or newer along the path.","With a 1-byte ID two repeaters can share an ID. 2 or 3 bytes make clashes far rarer in a big mesh."],"scope":["A region tag added to the flood messages you send.","Type the exact region name, for example gb-yor (1 to 29 lowercase letters, digits or hyphens), or leave it blank for no scope.","Only repeaters that allow that region repeat your message, so local chat stays local and doesn't clog the wider mesh."],"advert.loc":["Whether your adverts include your location.","Choose Don't share or Share. When sharing, your coordinates come from the Map or Identity page.","Lets others place you on the map. Leave it off if you would rather not publish where you are."],"repeat":["Whether this node relays packets it hears for others.","On turns it into a repeater; Off means it only listens. A client may only repeat on 433.000, 869.495 and 918.000 MHz.","Relaying extends the mesh, but every repeat uses airtime and battery."],"contacts.manual":["Manual add only: new contacts wait for you instead of being added automatically.","On means only the types switched on below are added automatically; everything else waits on the Contacts page.","Keeps the contact list under your control and stops it filling with nodes you don't care about."],"autoadd.chat":["Add other people's nodes to your contacts automatically when their advert is heard.","Switch on or off.","Saves adding people by hand, but the list can fill quickly in a busy mesh."],"autoadd.repeater":["Add repeaters to your contacts automatically when their advert is heard.","Switch on or off.","Repeaters in your contacts can be traced and logged in to, and they make your route table useful."],"autoadd.room":["Add room servers to your contacts automatically.","Switch on or off.","Lets you join the rooms around you without hunting for them."],"autoadd.sensor":["Add sensor nodes to your contacts automatically.","Switch on or off.","Useful if you read sensors over the mesh; otherwise leave off to save contact slots."],"autoadd.overwrite":["When every contact slot is used, replace the oldest contact that isn't a favourite.","Switch on or off.","Keeps new nodes arriving instead of the list silently stopping. Turn it off to protect every existing contact."],"autoadd.maxhops":["How far away, in hops, a node may be to be added automatically.","0 means any distance, 1 means direct neighbours only, N means up to N-1 repeater hops.","Keeps your contacts local instead of collecting every node in the mesh."],"telemetry.base":["Who may ask this device for its battery and basic readings.","Choose Nobody, Favourite contacts or Everyone.","Telemetry reveals things about you or the device, so only allow what you are comfortable sharing."],"telemetry.loc":["Who may ask this device for its location.","Choose Nobody, Favourite contacts or Everyone.","Your position is sensitive. 'Favourite contacts' is a sensible middle ground."],"telemetry.env":["Who may ask this device for environment sensor readings (temperature, humidity, pressure).","Choose Nobody, Favourite contacts or Everyone.","Lets friends read a weather or garden sensor without making the data public."],"contacts.count":["How full the contact list, the channel list and the message queue are.","Read-only: shows contacts used out of the maximum, channels used, and messages waiting for an app to collect.","Tells you when the contact list is nearly full (remove some or allow overwrite) and whether an app has messages waiting."],"ble":["The Bluetooth Low Energy link to the MeshCore phone app.","Switch on, then pair from the app with the PIN shown on the display (or the fixed PIN below). Apply with a reboot if asked.","It is how the phone app talks to the radio. Turn it off to save power if you only use USB or WiFi."],"ble.pin":["A fixed 6-digit Bluetooth pairing PIN.","Enter 1 to 999999, or 0 for a new random PIN every boot, shown on the display. It applies after a reboot.","A fixed PIN lets you pair without seeing the screen; a random PIN is safer."],"ble.activepin":["The PIN Bluetooth is using right now.","Read-only: type it into your phone when pairing.","Handy when the PIN is random and the display is out of sight."],"app.tcp":["A WiFi (TCP) connection for apps, on port 5000.","Switch on; apps connect to this radio's IP address on port 5000. It serves the MeshCore app, meshcore-open, meshcore_py, meshcore-cli and Home Assistant.","Lets desktop and home-automation software use the radio over your network without Bluetooth."],"app.links":["Who is connected to the radio right now: Bluetooth, WiFi apps and messages waiting.","Read-only.","A quick check that your app is really connected."],"loop.detect":["Drops flood packets that look as if they are going round in circles.","Choose off, minimal (the default), moderate or strict. Stricter settings drop more.","Loops waste airtime. Stricter settings catch more of them but may drop legitimate traffic in a dense mesh."],"flood.max":["Floods that have already travelled this many hops are not repeated.","0 to 64. 64 is no extra limit; community guides suggest about 20 for a busy region.","Limits how far traffic spreads, protecting the wider mesh from congestion."],"flood.max.unscoped":["The hop limit for flood packets that carry no region.","0 to 64. The Yorkshire guide suggests 32.","Unscoped traffic is the least controlled, so it is worth limiting separately."],"flood.max.advert":["The hop limit for flooded adverts.","0 to 64; the default is 8. 0 stops adverts crossing the mesh.","Adverts are frequent. Limiting how far they travel saves a lot of airtime."],"group.hops.max":["How far public and group channel messages are relayed.","0 to 64. 64 is no extra limit; 0 means never relay them.","Public channel chatter can dominate a mesh. Limiting it keeps routing and private traffic fast."],"allow.read.only":["Allow read-only logins to a room server.","Switch on to let people read the room without being able to post.","Lets a community read announcements without giving everyone write access."],"txdelay":["A random wait before this repeater repeats a flood, scaled by this factor.","0 to 2; the default is 0.5. Raise it on a busy mesh.","Staggering repeats stops neighbouring repeaters transmitting at the same instant and colliding."],"direct.txdelay":["The same random wait, for direct (routed) packets.","0 to 2; the default is 0.2.","Direct packets are time-critical, so they wait less than floods."],"advert.interval":["How often a zero-hop advert is sent, in minutes. It reaches only direct neighbours.","0 turns it off; otherwise 60 to 240.","Announces the node so direct neighbours list it, without flooding the whole mesh."],"flood.advert.interval":["How often a flood advert travels across the mesh, in hours.","0 turns it off; otherwise 3 to 168. UK guidance is an odd number of hours, such as 51.","Lets distant nodes discover you. An odd interval stops neighbouring repeaters advertising at the same moment."],"name":["This node's name as others see it.","Up to 31 bytes, or 23 when a location is included. Type it and Save.","Names appear in contact lists, maps and traffic. A callsign and place make a good name."],"lat":["This node's latitude in decimal degrees.","-90 to 90. Round to two or three decimals; the Map page can pick the spot for you.","Puts the node on the mesh map. Rounding avoids revealing your exact address."],"lon":["This node's longitude in decimal degrees.","-180 to 180. Round to two or three decimals.","Together with latitude it places the node on the map and helps others judge coverage."],"owner.info":["Free text about the owner or site, shown to others who ask.","Type text. A '|' starts a new line.","Lets people contact you or understand the site: callsign, mast height, antenna."],"public.key":["This node's unique identity: a 64-digit hex key.","Read-only. Copy it when you need to identify this node, for example when binding it to a broker account.","Other nodes and servers recognise a device by this key, not by its name."],"role":["Which firmware role this device runs: repeater, room server or client.","Read-only. Changing role means flashing different firmware.","It decides which pages and settings apply."],"__adminpw":["The password that protects this web page, telnet and remote admin over the mesh.","Type at least 8 characters and Save. It is never shown again.","Anyone with it can reconfigure the node, so use a strong password that you don't use anywhere else."],"guest.password":["An optional password that gives guests read-only access to basic stats over the mesh.","Set one, or leave it blank to let anyone log in as a guest.","Lets people check on a repeater without admin rights. Admins can read it remotely, so never reuse another password here."],"mqtt.status":["The live state of MQTT: WiFi, time sync, area code and each broker.","Read-only. 'up' means connected, 'conn' means connecting, '-' means not set up.","The quickest way to check that uploads are working."],"mqtt.client_version":["The client name and version this node announces to brokers.","Read-only.","Brokers and maps use it to understand what software is reporting."],"mqtt.iata":["The area code (usually an airport code such as LBA) used in MQTT topics: meshcore/<code>/<device>/...","Type your code and Save. Brokers stay idle while it is UNSET. For UMC Net, every repeater in the same network uses the same code.","It groups repeaters by area and decides which repeaters share traffic."],"mqtt.owner":["Your 64-digit public key, sent as owner information to brokers that use JWT login.","Paste your key. Leave blank if your brokers don't ask.","Some public brokers use it to show who runs a node."],"mqtt.email":["A contact email sent to brokers that use JWT login.","Type an address, or leave blank.","Lets a broker's operator contact you about your node."],"mqtt.packets":["Publish a decoded summary of each packet to the broker.","Switch on or off.","Maps and analysers use these to show coverage and traffic."],"mqtt.raw":["Publish each packet's raw bytes (hex).","Switch on or off. Turn it on for UMC Net.","Raw packets let other repeaters re-send what you heard and let analysers decode everything themselves."],"mqtt.tx":["Also publish the packets this node transmits.","Switch on or off. For UMC Net leave it off.","With it off, only what you hear by radio is published, so the same packet doesn't arrive twice."],"mqtt.statuscfg":["Publish a periodic online/offline status message.","Switch on or off.","Lets maps show whether a repeater is currently alive."],"mqtt.meshmapper":["Send data to the global MeshMapper service.","Switch on. At most two brokers can be on at once.","Contributes your repeater's coverage to a public map."],"mqtt.waev":["Send data to the waev broker.","Switch on. At most two brokers can be on at once.","Contributes to that community's map and analysers."],"mqtt.eastmesh-au":["Send data to the EastMesh Australia broker.","Switch on. At most two brokers can be on at once.","For repeaters in the EastMesh Australian network."],"mqtt.letsmesh-eu":["Send data to the LetsMesh Europe analyser.","Switch on. At most two brokers can be on at once.","Shows your repeater on the LetsMesh Europe map."],"mqtt.letsmesh-us":["Send data to the LetsMesh USA analyser.","Switch on. At most two brokers can be on at once.","Shows your repeater on the LetsMesh USA map."],"mqtt.custom":["Use a broker of your own, such as the UMC Net server.","Switch on after filling in host, port, transport and login below.","Lets you run a private network, or link your own repeaters over the internet."],"mqtt.custom.host":["The broker's address, for example net.2e0lxy.uk.","Type the host name or IP address.","Where this node sends its data."],"mqtt.custom.port":["The broker's port.","Type it: 443 for a secure WebSocket (wss) through a web server, 1883 for plain MQTT.","It must match how the broker is exposed."],"mqtt.custom.transport":["How to talk to the broker: tcp (plain MQTT) or wss (MQTT inside an encrypted WebSocket).","Choose wss for a broker behind a web server such as Caddy, tcp for a plain broker on your network.","wss is encrypted and passes through firewalls on port 443."],"mqtt.custom.username":["The user name for the broker.","Type it, for example v3-repeater.","UMC Net gives every repeater its own account, so a stolen account can only act as that one repeater."],"mqtt.custom.password":["The password for the broker.","Type it and Save. It is never shown again.","Protects the broker from unwanted publishers."],"mqtt.custom.bridge":["UMC Net bridge: listen for the packets other repeaters publish and pass them on to the mesh as if they arrived by radio.","Switch on, with Raw payloads on and the custom broker connected. The mesh drops packets it has already seen, so nothing loops.","Lets repeaters in different places act as one mesh. Packets are sent over the air, so they count against your duty cycle; the rate limit protects it."],"mqtt.custom.rate":["The most packets a minute to pass on from the network to the mesh.","1 to 120; the default is 20. Extras are dropped and counted.","Stops a busy network using up this repeater's airtime."],"mqtt.custom.bridge.status":["How the UMC Net bridge is doing: on or off and how many packets were heard, passed on and dropped.","Read-only.","Shows whether packets are really arriving from other repeaters."],"bridge.type":["Which kind of bridge this firmware has (for example ESP-NOW).","Read-only.","Tells you which settings apply."],"bridge.enabled":["Switches the bridge on or off.","On to start it, Off to stop it.","A bridge joins two radio areas; leave it off until both ends are configured."],"bridge.source":["Which packets to bridge: those this node transmits (logTx, the default) or receives (logRx).","Pick one and Save.","Decides what the other area gets: what you send out, or everything you hear."],"bridge.delay":["A wait, in milliseconds, before a bridged packet enters the mesh.","0 to 10000; the default is 500.","Gives the local radio a chance to deliver the packet first, avoiding duplicates."],"bridge.channel":["The ESP-NOW WiFi channel (1 to 14).","Set the same channel on both ends. It must match your WiFi channel when connected (see Network).","ESP-NOW shares the WiFi radio, so a different channel won't work."],"bridge.secret":["A shared secret for the bridge, up to 15 characters.","Type the same text on both ends.","Stops a stranger's bridge joining your network."],"bridge.baud":["The speed of a serial (RS-232) bridge.","Choose the same baud rate at both ends.","Both ends must agree or the data is garbage."],"powersaving":["Sleep between packets to save power.","Switch on or off. On UMC builds WiFi keeps the processor awake, so the effect is small.","Can extend battery life on a node without WiFi."],"adc.multiplier":["A correction for the battery voltage reading.","0 uses the board's default. Compare with a meter and adjust.","Makes the battery gauge and low-battery warnings accurate."],"gps":["The GPS module, if one is fitted.","Switch on or off.","Gives an automatic position and time."],"gps.advert":["How the GPS position goes into adverts: not at all, share, or follow the preferences.","Choose an option.","Decides whether your position is broadcast."],"display.mode":["What the built-in screen shows.","Choose a mode and Save.","Sets what you see at a glance on the device."],"display.ip":["How long, in seconds, the flashing IP address screen shows.","Enter seconds.","Helps you find the device on your network."],"display.page":["How long each settings screen is shown, in seconds.","Enter seconds.","Sets the pace of the screen's rotation."],"display.traffic":["How long the live traffic screen is shown, in seconds.","Enter seconds.","Lets you watch packets on the device itself."],"display.timeout":["Blank the screen after this many seconds (0 means never).","Enter seconds.","A blank screen saves power and avoids burning in the display."],"__board":["The board this firmware was built for.","Read-only.","Confirms you have the right firmware for the hardware."],"pwrmgt.bootreason":["Why the device last restarted: power on, software reset, watchdog, brown-out and so on.","Read-only.","A watchdog or brown-out points to a fault or weak power supply."],"mqtt.control":["Remote control: lets the UMC Net dashboard run a short list of safe commands on this repeater through the broker.","Save the control key first, then switch on. Without a key it refuses to turn on. Each command is signed with the key and checked for age and order before it runs.","You can read and change this repeater from anywhere without visiting it. Secrets, passwords, WiFi, broker settings and firmware installs can never be run this way."],"__ctlkey":["The 64-character key that proves a command came from your dashboard.","Open the dashboard's Control tab, press Control setup for this repeater, and paste the key here (or paste the whole set of commands into the Console). It is never shown again.","Anyone with the key can run the allowed commands on this repeater, so keep it private. Renew it in the dashboard if it leaks."],"mqtt.control.status":["How remote control is doing: on or off, whether a key is set, and how many commands were obeyed or refused (bad signature, too old, not allowed).","Read-only.","A rising 'bad signature' count means something is sending commands with the wrong key."]},"x":{"dash:kpi:Received this hour":["How many packets this radio received over the air in the last hour, with the change against the hour before.","Read it, and watch the little line beside it for the shape of the last half hour.","A sudden drop can mean a fault (antenna, interference) and a rise means the channel is busier."],"dash:kpi:Sent this hour":["How many packets this radio transmitted in the last hour, with the change against the hour before.","Read it; a repeater's number is mostly the packets it forwarded for others.","Shows how hard the node is working for the mesh and helps you stay inside duty-cycle limits."],"dash:kpi:Airtime this hour":["The share of the last hour the radio spent on air, receiving or sending.","Read the percentage; the line below splits it into receiving and sending.","LoRa is slow, so airtime is the scarce resource. High sending airtime needs attention because of the legal duty-cycle limit."],"dash:kpi:Neighbours":["Repeaters this node has heard directly on air (their adverts arrived with no hops), with the best signal.","Read the count. If it is empty, the Neighbours panel below also shows who is in radio range.","Neighbours are the direct radio links that every route is built on."],"dash:kpi:In radio range":["The number of repeaters that handed this node packets directly in the last 24 hours (the last hop of what it received).","Shown when the radio's own neighbour list is empty. Leave the page open to build up the count.","A repeater can be clearly in range without having heard its advert with no hops; this finds it from real traffic."],"dash:kpi:Nodes known":["How many nodes this radio has heard an advert from, and how near the nearest is.","Read it; the Routes page lists them all.","Gives a sense of how big your part of the mesh is."],"dash:kpi:Contacts / channels":["Contacts saved on this client and channels set up.","Read it; the note says how many messages are waiting for an app.","Tells you if the contact list is nearly full."],"dash:kpi:Uptime":["How long the radio has been running since it last started.","Read it. The restart reason is shown beneath when known.","Frequent short uptimes mean crashes, brown-outs or power cuts."],"dash:kpi:Battery":["The battery voltage and a rough percentage full.","Read it; the dial below shows the same.","Warns you before a solar or battery node goes flat."],"dash:dial:Last signal (SNR)":["The signal-to-noise ratio of the last packet heard, in dB.","Higher is better: above 5 dB is good, below about -5 dB is marginal. LoRa can decode signals below zero.","Shows how clean the incoming signal is, regardless of how loud it is."],"dash:dial:Channel busy":["The share of the last hour the channel was busy with this radio's own transmitting and receiving.","Green below 10%, amber above 10%, red above 20%.","A busy channel means collisions and delays for everyone."],"dash:dial:Noise floor":["The background radio noise the receiver measures, in dBm.","Lower (more negative) is better. Around -110 is quiet; above about -95 means interference.","A high noise floor hides weak signals and shortens your range. Check antennas, cables and nearby electronics."],"dash:dial:WiFi signal":["How strong this radio's WiFi connection to your router is, in dBm.","Above about -60 is strong, below -80 is weak.","A weak link makes the web page, MQTT and updates unreliable."],"dash:dial:Memory free":["How much working memory (heap) is free in the radio, in KB.","Watch it stay steady. It falls while WiFi, web and MQTT are busy.","Very low free memory can cause restarts."],"dash:dial:Battery":["The battery charge as a percentage, with the voltage underneath.","Green above 50%, amber above 25%, red below.","Warns you before a solar or battery node goes flat."],"dash:Traffic":["A chart of packets per minute: green received, amber sent.","Touch or hover for exact values; the 1 h / 6 h / 24 h buttons change the range.","Shows busy periods and quiet spells, and whether a fault began at a particular time."],"dash:Airtime":["Bars showing how much of each couple of minutes was spent receiving (green) and transmitting (amber).","Read the height as a percentage of time.","Shows whether you are close to the duty-cycle limit."],"dash:Dials":["Six dials for the live values that matter most: battery, signal, channel busy, noise floor, WiFi and memory.","Green is healthy, amber needs watching, red needs action.","Faster to read than numbers when you glance at the page."],"dash:Data flow":["A picture of what is connected and moving: the LoRa radio on the left, this node in the middle, and its links on the right.","A line moves only while its link is up, and faster the more packets a minute pass. Grey means off or not connected.","Shows at a glance whether WiFi, MQTT and the bridge are really working."],"dash:Connections":["The links this radio has, each with a coloured light.","Green is working, amber is trying, grey is off or not set up, red is a fault. WiFi (station) is your router connection; Hotspot (AP) is the radio's own network.","The first place to look when something stops working."],"dash:Traffic mix":["The types of packet in the radio's recent log: adverts, channel messages, direct messages, acknowledgements and so on.","Hover the legend; bigger slices are more common.","A mesh dominated by adverts or floods may need its limits tightened."],"dash:Flood and direct":["How many packets were flooded (sent everywhere) and how many were direct (sent along a known route), received and sent, since the radio started.","Read the percentages.","Direct packets are efficient; a lot of flooding means routes aren't being learned."],"dash:Signal":["A chart of the noise floor and the last signal strength over time, in dBm.","The green line should sit well above the orange one. Touch for values.","Shows interference arriving or an antenna problem developing."],"dash:Neighbours":["Repeaters heard directly, repeaters in radio range, and the nearest known nodes.","Heard directly is the radio's own list. In radio range lists repeaters that handed us packets directly. Nearest known nodes are sorted by hops.","Tells you who you are connected to and how near the rest of the mesh is."],"dash:In radio range":["Repeaters that passed packets straight to this node, counted over the last 24 hours in this browser.","Read packets heard, best SNR and when last heard.","These are real radio neighbours, even when no zero-hop advert has been heard."],"dash:Nearest known nodes":["The nodes this radio knows about, nearest first, with type, hops, signal and when they last announced themselves.","Read it; the Routes page has the whole table.","Shows how far out your view of the mesh reaches."],"dash:Radio":["The client radio's frequency, last RSSI and SNR, and transmit power.","Read it; the Radio page changes them.","Confirms you are on the right channel."],"dash:Recent activity":["The last packets this radio received (RX) and sent (TX), newest first.","From is the sender: an advert names its sender, other packets give a short code matched to a known node. Via is the repeater that handed it to us.","Shows who is on the channel and how packets reach you. Requests and responses are encrypted, so only a short code is visible."],"dash:Quick actions":["Buttons for common jobs.","Flood advert announces this node across the mesh; Zero-hop advert announces it to direct neighbours only. The clock note shows when the radio's time comes from the internet.","Adverts make other nodes list you; the clock matters for message ordering."],"radio:LoRa parameters":["The settings that decide which radios can hear each other.","See each setting's ? for details.","Wrong values here mean you hear nobody."],"radio:Interference handling":["Settings that help a repeater live near strong signals and noise.","Change one at a time and watch the Noise floor dial.","They cure deafness and reduce collisions."],"radio:Receive timing":["Experimental timing for handling duplicate copies of a message.","Leave it off unless your mesh asks for it.","Can reduce wasted repeats on a busy mesh."],"radio:Actions":["One-off radio tools.","Temporary radio test tries settings for a number of minutes and then puts the old ones back.","Lets you try a different channel without risking losing contact."],"msgset:Sending":["How this client sends and announces itself.","See each setting's ?.","Affects reliability and privacy."],"msgset:New contacts":["Rules for adding nodes to your contact list automatically.","Switch on the types you want, or use Manual add only.","Controls clutter and storage."],"msgset:Telemetry sharing":["Who may ask this device for its battery, location and sensors.","Choose Nobody, Favourite contacts or Everyone for each.","Privacy: only share what you are happy to."],"msgset:Storage":["How full the contact list, channel list and message queue are.","Read-only.","Warns when the radio is running out of room."],"apps:Bluetooth":["The Bluetooth link to the phone app.","Switch on and pair with the PIN.","Needed for the phone app."],"apps:App connections":["Network and web connections for apps.","Bluetooth, USB, WiFi (TCP port 5000) and this page all work together.","Lets apps and scripts use the radio."],"apps:Actions":["Restart the radio.","Reboot applies settings such as a new Bluetooth PIN.","Some settings only apply after a restart."],"mesh:Forwarding":["Rules for what this repeater relays and how far.","See each setting's ?.","The most important controls for a healthy mesh."],"mesh:Timing":["How long this repeater waits before repeating.","Raise the factors on a busy mesh.","Prevents neighbouring repeaters colliding."],"mesh:Adverts":["How often this repeater announces itself.","Zero-hop adverts reach neighbours; flood adverts cross the mesh.","Too frequent wastes airtime; too rare means nobody knows you."],"mesh:Actions":["Send an advert now, discover neighbours, or apply recommended settings.","Send flood advert announces across the mesh; Send zero-hop advert tells direct neighbours; Discover neighbours asks nearby repeaters to announce themselves; Yorkshire mesh recommended settings applies the Yorkshire guide after showing you what it will run.","Handy right after install, and for a quick start that matches the Yorkshire mesh."],"id:Node":["This node's name, position, owner text and identity.","See each setting's ?.","How others know and find you."],"id:Passwords":["Passwords that protect this node.","The admin password protects this page, telnet and remote admin; the guest password gives read-only stats.","Keeps strangers from changing your node."],"id:Actions":["Identity tools such as setting the position from the map.","Press the button and follow the prompts.","Quicker than typing coordinates."],"regions:Region tree":["The regions this repeater knows and whether each is allowed to flood.","Each row has a Flooding switch, Set home and Remove. The * row is traffic with no region. Press Save regions to keep changes after a reboot.","Decides which messages this repeater repeats, keeping local chat local."],"regions:LocalMesh presets":["One-click region sets that follow the community conventions (Great Britain and Ireland).","Press the preset for your area.","Uses the exact names other repeaters use, which matters because names are case-sensitive."],"regions:Edit":["Add, change or remove regions by hand.","Add a region under a parent, or define a tree in one line such as: gb gb-yor|gb gb-nwk.","For areas the presets don't cover."],"net:Status":["The radio's live network state: WiFi, address, hotspot, hostname and time.","Read-only.","Shows whether you can be reached and have the right time."],"net:WiFi":["The WiFi radio on/off and its power saving.","Turn WiFi off to save power (this also stops the hotspot except during setup). Power saving trades speed for energy.","WiFi is how this page, MQTT and updates reach you."],"net:WiFi networks":["Up to three saved WiFi networks.","Scan lists nearby networks; pick one, enter its password and Save. The radio tries them in order. Passwords are never shown again.","Lets the radio move between homes and sites, and recover if one network is down."],"net:IP address":["How the radio gets its address on your network, and its name.","Automatic (DHCP) is the default. Choose a fixed address if you want it to stay the same; the hostname makes it reachable as name.local.","A fixed address or a name makes the radio easy to find."],"net:Access point":["The radio's own WiFi hotspot at 192.168.4.1.","Auto starts it for first setup and as a rescue if no saved network connects for a minute; On keeps it always up; Off never (setup still uses it). Rescue and always-on hotspots use the access-point password, or the device PIN.","A way back in when your router changes or fails."],"net:Services":["The web interface, command-line and other network services.","Web page on/off and its idle sign-out time; telnet (plain text, trusted networks only); the classic HTTPS panel.","Turn off what you don't use to save memory and reduce exposure."],"net:Time":["Where the radio gets the time, and the timezone for local display.","On WiFi it syncs from internet time servers. Without WiFi, set it from your browser on the Dashboard or Firmware page.","The mesh runs on UTC. A wrong clock disorders messages, and the V3 has no backup battery for the clock."],"mqtt:Status":["The live state of MQTT uploads.","Read-only. up = connected, conn = connecting.","Check here first if maps don't show you."],"mqtt:Identity":["The area code and the owner details used with brokers.","Set the area code; owner key and email are only for brokers that ask.","Brokers stay idle until an area code is set."],"mqtt:What to publish":["Which data to send: packets, raw payloads, packets this node transmits, and periodic status.","Switch each on or off. For UMC Net: raw on, transmitted off.","Decides what the world, or your other repeaters, can see."],"mqtt:Brokers":["Public brokers and maps this repeater can feed, at most two at once.","Switch on the ones that match your network.","Brokers draw coverage maps and analysers from your repeater's traffic."],"mqtt:Custom broker":["A broker of your own, for example UMC Net.","Fill in host, port, transport and login and switch it on. Then the UMC Net settings turn on the bridge.","Lets you run a private network or link repeaters over the internet."],"mqtt:UMC Net":["Joins your repeaters over the internet through your broker.","Turn on the bridge and set the rate limit; check the counters.","A mesh in two places can act as one."],"bridge:Bridge":["A link between two LoRa areas through ESP-NOW or a serial cable.","Set the type-specific options, the same channel and secret at both ends, then enable.","Joins areas that can't hear each other on LoRa."],"power:Power":["Power saving and battery calibration.","See each setting's ?.","Makes batteries last and the gauge honest."],"power:Display":["Settings for the built-in screen.","Choose what is shown, for how long, and when it blanks.","Saves power and shows what you need on the device."],"power:Hardware":["Information about the board and its optional hardware.","Read-only, plus GPS if fitted.","Confirms what you have."],"power:Actions":["Hardware actions such as powering off.","Press the button and confirm.","A safe shutdown before removing power."],"neigh:Neighbours":["Repeaters heard directly, with name, signal and how long ago.","A neighbour restored after a reboot shows 'name not heard yet' until its next advert. Forget removes one; Discover neighbours asks for fresh adverts.","Your direct radio links are the foundation of every route."],"routes:Routes":["Every node this repeater has heard an advert from, with the repeaters its advert travelled through.","Type in Find to filter. Pin your own route, Unpin to go back to the learned one, or Forget a node.","Shows how far each node is and by which path."],"routes:Trace":["Sends a test packet out along a route and back, collecting the signal quality at every hop.","Press Trace on a node or enter a list of repeater keys. No answer in 30 seconds means a hop could not be reached.","Finds the weak link in a route."],"traffic:Live traffic":["The last 16 packets received and sent, with type, flood or direct, hops, signal and size.","Refreshes every 3 seconds. Filter by RX, TX or type, and press Pause to read a busy moment.","Shows exactly what is on the channel."],"console:Console":["A command line for this radio.","Type a command (for example ver, get radio, stats-core) and press Enter. get reads a value, set changes it.","Does anything the pages don't, at the risk of changing anything."],"fw:Firmware":["The installed firmware version and board.","Read-only.","Tells you if you are up to date."],"fw:Update through this browser":["Your browser downloads the latest build for this exact board and sends it to the radio.","Press Check, then Download & install. The device needs no internet; identity and settings are kept.","The most reliable update method: works on every board."],"fw:Update from the internet (by the device)":["The radio downloads and installs the latest build itself, and can do so automatically.","Press Check for updates, then Install latest, or choose a daily check. Needs WiFi with internet access and enough free memory.","Hands-off updates, but needs internet on the radio."],"fw:Update from a file":["Install a firmware file you chose.","Choose the non-merged .bin for this board and role, then Upload & install. The radio rolls back if the new firmware fails to start.","For a specific version, or when the radio has no internet."],"fw:Maintenance":["Housekeeping actions: restart, set the clock, factory reset.","Press the button and confirm.","Occasional fixes and a clean start."],"backup:Backup":["Saves this node's identity and settings to a file.","Press Download. Keep the file private: it contains the private key.","Lets you rebuild or replace a node without losing its identity."],"backup:Restore":["Loads a backup file onto this node.","Choose the file and press Restore. The node restarts.","Moves a node to new hardware or recovers from a failure."],"channels:Channels":["Group chat channels this radio has.","Pick one on the Messages page. Remove one you no longer need.","Separate conversations for separate groups."],"channels:Add a channel":["Create or join a channel.","Enter a name and key, or a #hashtag name (its key is made from the name). Share the key only with people who should read it.","Everyone with the same key can read the channel."],"contacts:Contacts":["The nodes this radio knows.","Open a contact for message, status, trace and remove. Star favourites to protect them.","You need a contact to message someone or log in to a repeater."],"clregion:Region":["Your region setup.","Choose a preset or type the region.","Keeps your messages local."],"clregion:Set up for your region":["Quick presets for your country or area.","Press yours.","Uses the exact names your local repeaters use."],"clregion:Region scope for everything this radio sends":["The region tag added to every flood message you send.","Type the exact region, such as gb-yor, or leave blank.","Only repeaters allowing that region repeat your messages."],"clregion:Room servers":["Room servers you can join, if any are known.","Open one and log in.","Rooms are shared message boards hosted by a node."],"clroutes:Routes to your contacts":["The path to each contact: hops, signal and when last heard.","Find a contact, then Trace or pin a route.","Explains why a contact is slow or unreachable."],"clroutes:Trace any path":["Trace a list of repeaters you type.","Enter repeater key prefixes such as a1,b2,a1 and press Trace.","Tests a route you choose."],"clroutes:Repeater ids":["The repeaters this client knows, with their short IDs.","Use the IDs when building a path.","Short IDs are what paths and traces use."],"net:field:Network 1 (primary)":["The first saved WiFi network: its name (SSID) and password.","Press Scan to list nearby networks, pick one, type the password and Save. The password is never shown again.","The radio tries network 1 first, so put your usual one here."],"net:field:Network 2":["A second saved WiFi network.","Fill in the name and password and Save.","A fallback if network 1 is down, or a second site."],"net:field:Network 3":["A third saved WiFi network.","Fill in the name and password and Save.","Another fallback; the radio tries them in order."],"net:field:WiFi enabled":["Turns the WiFi radio on or off.","Off also stops the hotspot, except during first setup.","Switch it off to save power, or on a node you only use over USB."],"net:field:WiFi power saving":["How much the WiFi radio sleeps between packets: none, min or max.","Choose none for the fastest page, max for the least power.","More saving means a slower web page and a later reply to commands."],"net:field:IP configuration":["How the radio gets its network address: automatic (DHCP) or a fixed address.","Leave on automatic, or enter an address, mask, gateway and DNS.","A fixed address keeps the radio at the same place on your network."],"net:field:Hostname":["The radio's name on your network.","Leave blank for an automatic name (umc- plus the node name), or type your own.","Lets you reach it as name.local instead of by number."],"net:field:mDNS (.local name)":["Announces the hostname on your network so it can be found by name.","Switch on or off.","Makes http://name.local/ work on most computers and phones."],"net:field:AP mode":["When the radio's own WiFi hotspot runs: auto, on or off.","Auto starts it for first setup and as a rescue if no saved network connects; on keeps it always up; off never (setup still uses it).","The hotspot (192.168.4.1) is a way back in when your router changes or fails."],"net:field:Rescue after (seconds offline)":["How long without a WiFi connection before the rescue hotspot starts, in seconds.","Enter seconds; the default is 60.","A short wait gets you back in quickly; a long one avoids starting it during a brief router blip."],"net:field:AP password":["The password of the rescue and always-on hotspot.","Type at least 8 characters, or leave blank to use the device PIN.","Stops neighbours joining your hotspot."],"net:field:Device PIN":["An 8-digit PIN shown on the display, used as the hotspot password when none is set.","Enter 8 digits to change it.","Proves you are standing at the device."],"net:field:Web session timeout (min)":["How many idle minutes before this web page signs you out.","Enter minutes; the default is 30.","Protects the node if you leave a computer open."],"net:field:Telnet CLI (port 23)":["A password-protected command line over the network, on port 23.","Switch on only on a trusted network; it starts only once the admin password is not the default.","Telnet is plain text, so anyone on the network could read the password."],"net:field:Stats history (web panel)":["Keeps a history for the classic EastMesh web panel's charts.","Switch on or off.","Uses memory; leave it off unless you use the classic panel."],"net:field:Bluetooth auto-off (min idle)":["Turns Bluetooth off after this many minutes without a connection.","Enter minutes, 0 for never.","Saves battery on a client."],"net:field:NTP server 1":["The first internet time server.","Leave the default (uk.pool.ntp.org) or enter another.","The radio sets its clock from the internet; the mesh runs on correct UTC time."],"net:field:NTP server 2":["The second time server.","Leave the default or enter another.","Used if the first doesn't answer."],"net:field:NTP server 3":["The third time server.","Leave the default or enter another.","A further fallback."],"net:field:Time zone":["The timezone used to show local time (not for the mesh, which uses UTC).","Enter a POSIX timezone, for example GMT0BST,M3.5.0/1,M10.5.0.","Makes times on the display and page match your clock."],"regions:field:Add region":["Creates a new region under a parent.","Type the name (lowercase letters, digits and hyphens, case-sensitive), choose the parent, and press Add.","Regions let you scope flood traffic; the name must match the other repeaters exactly."],"regions:field:Region":["The region you are adding or editing.","Type its exact name.","Region names are case-sensitive, 1 to 29 characters."],"regions:field:Define in one line":["Builds the whole region tree from one line of text.","Write parent and child pairs separated by |, for example: gb gb-yor|gb gb-nwk.","Quicker than adding each region by hand."],"fw:field:Automatic":["Checks for new firmware once a day and, if you choose, installs it.","Choose off, check only, or check and install.","Keeps the radio current without you remembering; a bad update rolls back by itself."],"clregion:field:*":["A region preset: the region name your messages will carry.","Press it to set that region as your scope.","Matches the names your local repeaters use, so they repeat your messages."],"mqtt:Remote control":["Settings for letting the UMC Net dashboard control this repeater.","Paste the control key, then switch on.","Off by default so a repeater never obeys anything unless you chose it."]}};

const helpFor = (kind, key) => HELP[kind] && HELP[kind][key];
const qBtn = (kind, key) => helpFor(kind, key) ? `<button type="button" class="q" data-hk="${kind}" data-hv="${esc(key)}" aria-label="What is this?" title="What is this? Press for the full explanation">?</button>` : "";
const helpHtml = (e, order) => order.map((t, i) => `<h4>${t}</h4><p>${esc(e[i])}</p>`).join("");
const HOW = ["What it is", "How to use it", "Why it matters"], SECORDER = ["What it is", "Why you would use it", "How to use it"];
function aboutHtml(id) {
  const e = HELP.sec[id]; if (!e) return "";
  const shut = localStorage.getItem("umc_about") === "0";
  return `<div class="about${shut ? " shut" : ""}" id="aboutBox"><button type="button" aria-expanded="${!shut}">About this page</button><div class="ab">${SECORDER.map((t, i) => `<div><h4>${t}</h4><p>${esc(e[i])}</p></div>`).join("")}</div></div>`;
}
let popEl = null;
const closePop = () => { if (popEl) { popEl.remove(); popEl = null; } };
document.addEventListener("keydown", e => { if (e.key === "Escape") closePop(); });
document.addEventListener("click", e => {
  const ab = e.target.closest("#aboutBox > button");
  if (ab) { const box = ab.parentElement; box.classList.toggle("shut"); ab.setAttribute("aria-expanded", !box.classList.contains("shut")); localStorage.setItem("umc_about", box.classList.contains("shut") ? "0" : "1"); return; }
  const b = e.target.closest(".q");
  if (!b) { if (!e.target.closest(".helppop")) closePop(); return; }
  e.preventDefault(); e.stopPropagation();
  const entry = helpFor(b.dataset.hk, b.dataset.hv); if (!entry) return;
