function controlHtml(f, id) {
  const a = `id="${id}" data-k="${esc(f.k)}"`;
  switch (f.type) {
    case "toggle": return `<label class="switch"><input type="checkbox" ${a}><span></span></label><span class="val" id="${id}_v"></span>`;
    case "select": return `<select ${a}>${f.options.map(o => Array.isArray(o) ? `<option value="${esc(o[0])}">${esc(o[1])}</option>` : `<option>${esc(o)}</option>`).join("")}</select>`;
    case "number": return `<input type="number" ${a} ${f.min != null ? `min="${f.min}"` : ""} ${f.max != null ? `max="${f.max}"` : ""} step="${f.step ?? 1}">`;
    case "password": return `<input type="password" ${a} autocomplete="new-password" placeholder="${f.secret ? "unchanged" : ""}">`;
    case "textarea": return `<textarea ${a}></textarea>`;
    case "readonly": return `<span class="val" ${a} style="font-size:13px;color:var(--ink)"></span>`;
    case "radio": return `<div style="width:100%"><select id="${id}_p" style="margin-bottom:6px"><option value="">Custom</option>${PRESETS.map((p, i) => `<option value="${i}">${esc(p[0])} — ${p[1]} MHz, ${p[2]} kHz, SF${p[3]}</option>`).join("")}</select>
      <div class="row"><input type="number" id="${id}_f" step="0.001" min="150" max="2500" style="max-width:130px" title="MHz"> MHz
      <select id="${id}_b" style="max-width:110px">${BWS.map(b => `<option>${b}</option>`).join("")}</select> kHz
      SF<select id="${id}_s" style="max-width:70px">${[5,6,7,8,9,10,11,12].map(s => `<option>${s}</option>`).join("")}</select>
      CR 4/<select id="${id}_c" style="max-width:60px">${[5,6,7,8].map(s => `<option>${s}</option>`).join("")}</select></div></div>`;
    default: return `<input type="text" ${a} ${f.placeholder ? `placeholder="${esc(f.placeholder)}"` : ""}>`;
  }
}

function setControl(f, id, raw) {
  const v = f.parse ? f.parse(val(raw)) : val(raw);
  const el = $("#" + id);
  if (!el && f.type !== "radio") return;
  if (isErr(raw)) { const m = $("#" + id + "_m"); if (m) { m.textContent = "not supported"; m.className = "msg"; } }
  switch (f.type) {
    case "toggle": el.checked = v === (f.on || "on") || v === "1" || v === "true"; $("#" + id + "_v").textContent = isErr(raw) ? "" : v; break;
    case "readonly": el.textContent = v; break;
    case "password": el.value = ""; break;
    case "radio": {
      const [fr, bw, sf, cr] = v.split(",").map(Number);
      $("#" + id + "_f").value = fr ? fr.toFixed(3) : ""; $("#" + id + "_b").value = String(bw); $("#" + id + "_s").value = String(sf); $("#" + id + "_c").value = String(cr);
      const p = presetFor(fr, bw, sf, cr) || presetLoose(fr, bw, sf); $("#" + id + "_p").value = p ? PRESETS.indexOf(p) : "";
      break;
    }
    case "select":
      if (![...el.options].some(o => o.value === v) && v) el.add(new Option(v, v));
      el.value = v; break;
    default: el.value = v;
  }
}

function readControl(f, id) {
  const el = $("#" + id);
  switch (f.type) {
    case "toggle": return el.checked ? (f.on || "on") : (f.off || "off");
    case "radio": return [$("#" + id + "_f").value, $("#" + id + "_b").value, $("#" + id + "_s").value, $("#" + id + "_c").value].join(",");
    default: return el.value.trim();
  }
}

      html += `<div class="field" id="${id}_row"><label for="${id}">${esc(f.label)}${qBtn("f", f.hk || (f.get === "get mqtt.statuscfg" ? "mqtt.statuscfg" : f.k))}</label><div class="ctl">${controlHtml(f, id)}<span class="msg" id="${id}_m"></span></div>
        <div class="act">${editable ? `<button class="btn sm" data-save="${id}">Save</button>` : ""}</div>${f.help ? `<div class="help">${esc(f.help)}</div>` : ""}</div>`;

  const dirty = new Set();

// Accepts "53.726, -1.574", Google Maps links (@lat,lon or q=lat,lon) and OpenStreetMap links (#map=z/lat/lon, mlat/mlon).
function parseCoords(text) {
  const s = String(text || "").trim();
  const pats = [/@(-?\d+\.\d+),\s*(-?\d+\.\d+)/, /[?&](?:q|query|ll)=(-?\d+\.\d+),\s*(-?\d+\.\d+)/, /#map=\d+\/(-?\d+\.\d+)\/(-?\d+\.\d+)/,
    /mlat=(-?\d+\.\d+).*?mlon=(-?\d+\.\d+)/, /!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/, /^(-?\d+(?:\.\d+)?)\s*[, ]\s*(-?\d+(?:\.\d+)?)$/];
  for (const p of pats) {
    const m = s.match(p);
    if (m) { const lat = +m[1], lon = +m[2]; if (Math.abs(lat) <= 90 && Math.abs(lon) <= 180) return [lat.toFixed(3), lon.toFixed(3)]; }
  }
  return null;
}
async function askLocation() {
  if (window.isSecureContext && navigator.geolocation) {
    const pos = await new Promise(res => navigator.geolocation.getCurrentPosition(p => res([p.coords.latitude.toFixed(3), p.coords.longitude.toFixed(3)]), () => res(null), {timeout: 15000}));
    if (pos) return pos;
  }
  window.open("https://www.openstreetmap.org/", "_blank", "noopener");
  const t = prompt("Find your location on the map that just opened, then paste coordinates or the map link here.\nExamples: 53.726, -1.574  or a Google Maps / OpenStreetMap link.\nIt is rounded to about 100 m.");
  if (t == null) return null;
  const c = parseCoords(t);
  if (!c) toast("Couldn't find coordinates in that text", "bad");
  return c;
}

async function runAction(act, reload) {
  if (act === "geo") {
    const c = await askLocation(); if (!c) return;
    const r = await api.cli([`set lat ${c[0]}`, `set lon ${c[1]}`]);
    toast(`Location set to ${c[0]}, ${c[1]}`, r.some(isErr) ? "bad" : "ok"); reload && reload();
    return;
  }
  if (act === "prvkey") {
    if (!confirm("Show this node's PRIVATE key? Anyone with it can impersonate the node.")) return;
    const k = val(await one("get prv.key"));
    const nk = prompt("Private key (copy it somewhere safe). Paste a new 64-hex key to replace it, or Cancel:", k);
    if (nk && nk !== k) { const r = await one(`set prv.key ${nk}`); toast(r, isErr(r) ? "bad" : "ok"); }
    return;
  }
  if (act === "setperm") {
    const pk = prompt("Companion public key (hex):"); if (!pk) return;
    const perm = prompt("Permission: 0 guest, 1 read-only, 2 read-write, 3 admin, blank = remove", "3"); if (perm === null) return;
    const r = await one(`setperm ${pk} ${perm}`.trim()); return toast(r, isErr(r) ? "bad" : "ok");
  }
  if (act === "yorkshire") {
    // From the MeshCore Yorkshire guide: https://docs.meshcoreyorkshire.uk/repeaters/suggested-repeater-commands/
    const cmds = ["set flood.max 20", "set flood.max.advert 0", "set flood.max.unscoped 32", "set path.hash.mode 2",
      "set loop.detect minimal", "set flood.advert.interval 0", "set advert.interval 60", "set dutycycle 10"];
    const regions = ["region put gb", "region put gb-yor gb", "region allowf gb", "region allowf gb-yor", "region home gb-yor", "region default gb-yor", "region save"];
    const withRegions = confirm(`Apply the Yorkshire mesh recommendations?\n\n${cmds.join("\n")}\n\nOK also adds the regions:\n${regions.join("\n")}\n\nCancel to stop, or Cancel then use the Regions page for regions only.`);
    if (!withRegions) return;
    const all = cmds.concat(regions);
    const r = await api.cli(all);
    const bad = all.map((c, i) => [c, r[i]]).filter(([, x]) => isErr(x));
    toast(bad.length ? `Applied, ${bad.length} rejected: ${bad.map(([c]) => c.split(" ")[1]).join(", ")}` : "Yorkshire recommendations applied", bad.length ? "bad" : "ok");
    reload && reload();
    return;
  }
  if (act === "tempradio") {
    const s = prompt("Temporary radio: freq,bw,sf,cr,minutes", "869.618,62.5,8,8,10"); if (!s) return;
    const r = await one(`tempradio ${s}`); return toast(r, isErr(r) ? "bad" : "ok");
  }
  const r = await one(act); toast(r || "Sent", isErr(r) ? "bad" : "ok");
}

D.resolve = (hex, routes) => {                 // a one-byte hash or a key prefix -> the node it probably is
  if (!hex) return null; const h = hex.toLowerCase(), hits = (routes || []).filter(r => r.key.toLowerCase().startsWith(h));

};
D.who = (p, routes) => {
  if (p.tx) return (D.self || p.name || "this node") + " (this node)";
  if (p.key) { const r = D.resolve(p.key, routes); if (r && r.sure) return r.name; }
  if (p.name) return p.name;
  if (p.key) return p.key;
  if (p.src) { const a = D.resolve(p.src, routes), b = p.dst ? D.resolve(p.dst, routes) : null; return a.name + (b ? " → " + b.name : ""); }

D.via = (p, routes) => p.tx ? "—" : p.via ? D.resolve(p.via, routes).name : p.hops === 0 ? "direct" : "—";
D.hopKey = () => "umc_hops1:" + (INFO ? INFO.name : "");
D.hops = null;
D.noteHops = (packets, nowMs) => {              // each received packet's last hop is a repeater we hear directly
  if (!D.hops) { try { D.hops = JSON.parse(localStorage.getItem(D.hopKey()) || "null") || {n: {}, seen: []}; } catch { D.hops = {n: {}, seen: []}; } }
  const h = D.hops, seen = new Set(h.seen);
  for (const p of packets || []) {
    if (p.tx || !p.via) continue;
    const sig = [p.type, p.rssi, p.snr, p.len, p.via, Math.round((nowMs / 1000 - p.age) / 2)].join("|");
    if (seen.has(sig)) continue; seen.add(sig); h.seen.push(sig);
    const e = h.n[p.via] || (h.n[p.via] = {n: 0, snr: -99, rssi: -999, last: 0});
    e.n++; e.snr = Math.max(e.snr, +p.snr); e.rssi = Math.max(e.rssi, p.rssi); e.last = Math.max(e.last, Math.round(nowMs / 1000 - p.age));

    snap = {...stats, name: g.name, tx: g.tx, net, links, cc, neigh, tf, conn, freq: `${fr ? fr.toFixed(3) : "?"} MHz · SF${sf}`, bridge: has("bridge") ? val(g.bridge) || "off" : "", mqttText: mqTxt, mqttUp: mqUp};

  view.addEventListener("mousemove", e => {                               // a tooltip on the charts
    const c = e.target.closest(".chart"), tip = c && c.querySelector(".tip"); view.querySelectorAll(".tip").forEach(t => { if (t !== tip) t.style.display = "none"; }); if (!c) return;

    const t = m.x0 + (x - m.L) / ((m.W - m.L - m.R) || 1) * (m.x1 - m.x0); if (t < m.x0 - 60 || t > m.x1 + 60) { tip.style.display = "none"; return; }
    const rows = m.s.map(s => { const p = s.d.reduce((b, q) => Math.abs(q[0] - t) < Math.abs(b[0] - t) ? q : b, s.d[0] || [0, 0]); return `<span style="color:${s.c}">●</span> ${esc(s.n)}: <b>${D.fmt(p[1])}${esc(m.f)}</b>`; }).join("<br>");
    tip.innerHTML = `${D.hm(t)}<br>${rows}`; tip.style.display = "block"; tip.style.left = Math.min(e.clientX - c.getBoundingClientRect().left + 14, c.clientWidth - 170) + "px"; tip.style.top = "8px";
  });

      <td>${p.flood ? "flood" : "direct"}</td><td><b>${esc(D.who(p, D.routes))}</b></td><td>${esc(D.via(p, D.routes))}</td><td>${p.tx ? "—" : p.hops}</td><td>${p.tx ? "—" : p.rssi}</td><td>${p.tx ? "—" : (+p.snr).toFixed(1)}</td><td>${p.len}</td></tr>`).join("")
      || `<tr><td colspan="10" class="val">No packets yet.</td></tr>`;

async function renderRoutes(view) {
  view.innerHTML = `<div class="card"><h2>Routes</h2><p class="sub">Every node this repeater has heard an advert from, and the chain of repeaters that advert came through. Reverse it for the route <i>to</i> that node. Hops are shown by their key prefix, with the repeater's name when known.</p>
      <div class="row" style="margin-bottom:10px"><input type="text" id="rtFind" placeholder="Find by name or key…" style="max-width:260px"><button class="btn" id="rtRef">Refresh</button><span class="val" id="rtCount"></span></div>
      <div style="overflow-x:auto"><table><thead><tr><th>Node</th><th>Route to node</th><th>Hops</th><th>Heard</th><th>SNR</th><th></th></tr></thead><tbody id="rtBody"></tbody></table></div></div>
    <div class="card"><h2>Trace</h2><p class="sub">Sends a trace packet out and back along a route. Every repeater on the way reports the signal quality (SNR) it received. <b>Trace</b> on a row uses that node's pinned route, or the learned one.</p>
      <div class="row"><input type="text" id="trPath" placeholder="custom path, e.g. a1,b2,a1" style="max-width:260px"><button class="btn" id="trGo">Trace custom path</button></div>
      <div id="trOut" style="margin-top:12px"></div></div>`;
  let routes = [];
  const nameFor = hex => { const r = routes.find(x => x.key.startsWith(hex.toLowerCase())); return r && r.name ? r.name : ""; };
  const hopLabel = hex => { const n = nameFor(hex); return `<code>${esc(hex)}</code>${n ? ` <span class="val">${esc(n)}</span>` : ""}`; };
  const ago = s => s < 0 ? "before reboot" : s < 120 ? s + " s" : s < 7200 ? Math.round(s / 60) + " min" : s < 172800 ? Math.round(s / 3600) + " h" : Math.round(s / 86400) + " days";
  const render = () => {
    const q = $("#rtFind").value.trim().toLowerCase();
    const list = routes.filter(r => !q || r.name.toLowerCase().includes(q) || r.key.startsWith(q)).sort((a, b) => a.ago - b.ago);
    $("#rtCount").textContent = `${list.length} of ${routes.length} node(s)`;
    $("#rtBody").innerHTML = list.map(r => {
      const hops = r.path ? r.path.split(",").reverse() : [];
      const chain = hops.length ? `this repeater → ${hops.map(hopLabel).join(" → ")} → node` : `<span class="val">direct (heard without repeaters)</span>`;
      return `<tr><td><b>${esc(r.name || "?")}</b> <span class="pill">${esc(r.type)}</span><br><code class="val">${esc(r.key)}</code></td>
        <td>${chain}${r.pin ? `<br><span class="pill ok">pinned trace: ${esc(r.pin)}</span>` : ""}</td>
        <td>${r.hops}</td><td>${r.ago < 0 ? ago(r.ago) : ago(r.ago) + " ago"}</td><td>${(+r.snr).toFixed(1)}</td>
        <td class="row" style="justify-content:flex-end"><button class="btn sm" data-trace="${esc(r.key)}">Trace</button><button class="btn sm" data-pin="${esc(r.key)}">${r.pin ? "Edit route" : "Add route"}</button>${r.pin ? `<button class="btn sm" data-unpin="${esc(r.key)}">Unpin</button>` : ""}<button class="btn sm danger" data-forget="${esc(r.key)}">Forget</button></td></tr>`;
    }).join("") || `<tr><td colspan="6" class="val">No nodes heard yet. Adverts arrive over time; press <b>Send flood advert</b> on the dashboard to prompt replies.</td></tr>`;
  };
  const load = async () => { routes = (await api.routes()).routes || []; render(); };
  let poll = null;
  const showTrace = async () => {
    const s = val(await one("get trace"));
    const out = $("#trOut");
    if (s.startsWith("waiting")) { out.innerHTML = `<p class="val">Waiting for the trace to come back… (${esc(s.split(" ")[1])})</p>`; return false; }
    if (s.startsWith("timeout")) { out.innerHTML = `<p class="msg bad">No answer within 30 s — a repeater on the path didn't hear or forward it. Path: ${esc((s.match(/path:(\S+)/) || [])[1] || "")}</p>`; return true; }
    if (s.startsWith("done")) {
      const path = ((s.match(/path:(\S+)/) || [])[1] || "").split(",").filter(Boolean);
      const snr = ((s.match(/snr:(\S+)/) || [])[1] || "").split(",").map(Number);
      const fin = +((s.match(/final:(-?[\d.]+)/) || [])[1]);
      const secs = (s.match(/done ([\d.]+)s/) || [])[1];
      const bar = v => `<span style="display:inline-block;height:8px;width:${Math.max(4, Math.min(100, (v + 20) * 3))}px;background:${v >= 5 ? "var(--ok)" : v >= -5 ? "var(--warn)" : "var(--bad)"};border-radius:4px;vertical-align:middle"></span>`;
      out.innerHTML = `<p class="msg ok">Trace completed in ${esc(secs)} s</p><table><thead><tr><th>#</th><th>Heard by</th><th>SNR</th></tr></thead><tbody>
        ${path.map((h, i) => `<tr><td>${i + 1}</td><td>${hopLabel(h)}</td><td>${isNaN(snr[i]) ? "—" : snr[i].toFixed(1) + " dB " + bar(snr[i])}</td></tr>`).join("")}
        <tr><td>↩</td><td>back at this repeater</td><td>${isNaN(fin) ? "—" : fin.toFixed(1) + " dB " + bar(fin)}</td></tr></tbody></table>`;
      return true;
    }
    out.innerHTML = ""; return true;
  };
  const startTrace = async cmd => {
    const r = await one(cmd); toast(r, isErr(r) ? "bad" : "ok"); if (isErr(r)) return;
    clearInterval(poll); let n = 0;
    poll = setInterval(async () => { n++; const fin = await showTrace().catch(() => true); if (fin || n > 35) clearInterval(poll); }, 1000);
  };
  window.addEventListener("hashchange", () => clearInterval(poll), {once: true});
  $("#rtFind").addEventListener("input", render);
  view.addEventListener("click", async e => {
    const b = e.target.closest("button"); if (!b) return;
    try {
      if (b.id === "rtRef") return load();
      if (b.id === "trGo") { const p = $("#trPath").value.trim(); if (!p) return toast("Enter hop key prefixes, e.g. a1,b2,a1", "bad"); return startTrace(`trace ${p}`); }
      if (b.dataset.trace) return startTrace(`trace route ${b.dataset.trace}`);
      if (b.dataset.pin) {
        const r = routes.find(x => x.key === b.dataset.pin);
        const learned = r && r.path ? r.path.split(",").map(h => h.slice(0, 2)) : [];
        const suggestion = r && r.pin ? r.pin : [...learned.slice().reverse(), ...(r && r.type === "repeater" ? [r.key.slice(0, 2)] : []), ...learned].join(",");
        const p = prompt(`Route used when tracing ${r ? r.name || r.key : ""}.\nEnter the full out-and-back list of repeater key prefixes (2 hex digits each), e.g. a1,b2,a1:`, suggestion);
        if (p == null) return;
        const x = await one(`route pin ${b.dataset.pin} ${p}`); toast(x, isErr(x) ? "bad" : "ok"); return load();
      }
      if (b.dataset.unpin) { toast(await one(`route unpin ${b.dataset.unpin}`)); return load(); }
      if (b.dataset.forget) { if (!confirm("Forget this node's route?")) return; toast(await one(`route forget ${b.dataset.forget}`)); return load(); }
    } catch (err) { toast(err.message, "bad"); }
  });
  await load();
  showTrace().catch(() => {});
}

      <div class="field"><label>Add region</label><div class="ctl"><input id="rName" type="text" maxlength="29" pattern="[a-z0-9-]+" placeholder="gb-local" style="max-width:180px"> under <input id="rParent" type="text" maxlength="29" pattern="[a-z0-9-]+" placeholder="parent (blank = *)" style="max-width:180px"></div><div class="act"><button class="btn sm" id="rPut">Add</button></div><div class="help">1-29 lowercase letters, digits or hyphens. Public names match exactly.</div></div>

      <div class="field"><label>Define in one line</label><div class="ctl"><input id="rDef" type="text" placeholder="gb gb-yor|gb gb-nwk"></div><div class="act"><button class="btn sm" id="rDefBtn">Apply</button></div><div class="help">Uses <code>region def</code>: each name becomes a child of the previous; <code>name|jump</code> moves back up.</div></div>
    </div>`;
  let tree = [];  // [{name, depth, home, flood}]

  const load = async () => {
    // `region` prints one line per region, indented one space per level: "name[^] [F]"
    const raw = String(await one("region")).replace(/^\s*>\s?/, "");

        <td><label class="switch"><input type="checkbox" data-flood="${i}" ${r.flood ? "checked" : ""}><span></span></label></td>

async function renderConsole(view) {
  view.innerHTML = `<div class="card"><h2>Console</h2><p class="sub">Runs commands exactly like the USB serial CLI. ↑/↓ for history. Try <code>help</code>, <code>ver</code>, <code>stats-radio</code>.</p>
    <div class="term" id="term"></div><div class="row" style="margin-top:8px"><input type="text" id="cmd" placeholder="command" style="max-width:none;flex:1;font-family:ui-monospace,Consolas,monospace" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="btn pri" id="run">Run</button></div></div>`;
  const hist = JSON.parse(sessionStorage.getItem("umc_hist") || "[]"); let hi = hist.length;
  const term = $("#term"), inp = $("#cmd");
  const print = (t, cls) => { const d = document.createElement("div"); d.textContent = t; if (cls) d.style.color = cls; term.appendChild(d); term.scrollTop = term.scrollHeight; };
  const run = async () => {
    const c = inp.value.trim(); if (!c) return; inp.value = ""; hist.push(c); if (hist.length > 50) hist.shift(); hi = hist.length; sessionStorage.setItem("umc_hist", JSON.stringify(hist));
    print("> " + c, "#7ee787");
    try { const r = await one(c); print(r || "(no reply)", isErr(r) ? "#ff7b72" : null); } catch (err) { print(err.message, "#ff7b72"); }
  };
  $("#run").onclick = run;
  inp.addEventListener("keydown", e => {
    if (e.key === "Enter") run();
    else if (e.key === "ArrowUp" && hi > 0) { inp.value = hist[--hi]; e.preventDefault(); }
    else if (e.key === "ArrowDown") { hi = Math.min(hist.length, hi + 1); inp.value = hist[hi] || ""; e.preventDefault(); }
  });
  inp.focus();
}

      <div class="warnbox hidden" id="fwWarn"></div>
      <div class="progress" style="margin-top:10px"><i id="fwBar"></i></div><p class="msg" id="fwMsg"></p></div>
    <div class="card"><h2>Maintenance</h2><div class="row">
      <button class="btn" data-m="clock">Set clock from browser</button><button class="btn" data-m="reboot">Reboot</button>
      <button class="btn" data-m="clear stats">Clear stats</button><button class="btn" data-m="log start">Start packet log</button><button class="btn" data-m="log stop">Stop packet log</button><button class="btn" data-m="log erase">Erase packet log</button>
      <button class="btn" data-m="start ota">Legacy OTA hotspot</button><button class="btn" data-m="setup start">Re-run setup wizard</button>

      <p class="sub" style="margin-top:10px">Device clock: ${esc(val(r[3]))}</p></div>`;
  // ---- update through the browser: fetch from GitHub Pages (CORS allowed), upload to /api/ota ----

    let u = val(await one("get update.url"));

      const b = (d.builds || []).find(x => x.env === INFO.env);
      if (!b) return webStatus(`No published build for this board and firmware type (${INFO.env}).`);
      const newer = !String(d.commit || "").startsWith(INFO.commit || "~");

      webStatus(newer ? `Update available: ${d.version} (build ${webBuild.commit}, ${new Date(d.built).toLocaleString()}). This device: ${INFO.umc} (build ${INFO.commit}).`

      if (!res.ok) throw new Error(`download failed (HTTP ${res.status})`);
      const total = +res.headers.get("content-length") || 0;
      const reader = res.body.getReader(); const parts = []; let got = 0;
      for (;;) {
        const {done, value} = await reader.read(); if (done) break;
        parts.push(value); got += value.length;

        xhr.onload = () => { let d = {}; try { d = JSON.parse(xhr.responseText); } catch {} xhr.status === 200 ? resolve() : reject(new Error(d.error || "install failed")); };
        xhr.onerror = () => reject(new Error("connection lost while sending to the device"));

      });
      webStatus("Installed. The device is rebooting — this page reconnects in about 20 s.");

    } catch (err) {
      webStatus(`Update failed: ${err.message}`);

  // ---- internet update ----
  let updPoll = null;

    const human = s.startsWith("available") ? `Update available: ${s.replace(/^available /, "")}`

      : s.startsWith("installed") ? "Installed — rebooting. This page reconnects automatically."
      : s.startsWith("error") ? `Problem: ${s.replace(/^error /, "")}`
      : s.startsWith("checking") ? "Checking…"
      : s.startsWith("restarting") ? "Restarting into update mode — this page reconnects when the device is back (about a minute)."

    if (busy && !updPoll) updPoll = setInterval(() => updRefresh().catch(() => {}), 2000);
    if (!busy && updPoll) { clearInterval(updPoll); updPoll = null; }
  };
  $("#updCheck").onclick = async () => { toast(await one("update check")); updRefresh(); };
  $("#updInstall").onclick = async () => {
    if (!confirm("Download and install the latest firmware now? The device reboots when done (about a minute).")) return;
    const r = await one("update install"); toast(r, isErr(r) ? "bad" : "ok"); updRefresh();

  updRefresh().catch(() => {});
  const stopPoll = () => { if (updPoll) { clearInterval(updPoll); updPoll = null; } };
  window.addEventListener("hashchange", stopPoll, {once: true});

  const file = $("#fwFile"), go = $("#fwGo");

    const f = file.files[0]; go.disabled = !f; const w = $("#fwWarn"); w.classList.add("hidden");
    if (!f) return;

    const board = (INFO.board || "").toLowerCase();
    if (board.includes("v3") && n.includes("v4")) notes.push("File looks like a Heltec V4 build but this board is a V3.");
    if (board.includes("v4") && n.includes("v3")) notes.push("File looks like a Heltec V3 build but this board is a V4.");
    const role = INFO.role.replace("_", "");
    if (["repeater", "companion", "roomserver", "room_server"].some(x => n.includes(x)) && !n.replace("_", "").includes(role)) notes.push(`File name suggests a different role than this device (${INFO.role}).`);
    if (notes.length) { w.innerHTML = notes.map(esc).join("<br>"); w.classList.remove("hidden"); }
  };
  go.onclick = () => {
    const f = file.files[0]; if (!f || !confirm(`Install ${f.name} (${Math.round(f.size / 1024)} KB)? The device reboots when done.`)) return;
    go.disabled = true; const msg = $("#fwMsg"), bar = $("#fwBar");
    const xhr = new XMLHttpRequest(); xhr.open("POST", "/api/ota"); if (TOKEN) xhr.setRequestHeader("X-Auth-Token", TOKEN);
    xhr.upload.onprogress = e => { if (e.lengthComputable) { bar.style.width = (e.loaded / e.total * 100).toFixed(1) + "%"; msg.textContent = `Uploading ${Math.round(e.loaded / 1024)} / ${Math.round(e.total / 1024)} KB`; } };
    xhr.onload = () => {
      let d = {}; try { d = JSON.parse(xhr.responseText); } catch {}
      if (xhr.status === 200) { msg.className = "msg ok"; msg.textContent = "Installed. Rebooting — reconnecting in 20 s…"; setTimeout(() => location.reload(), 20000); }
      else { msg.className = "msg bad"; msg.textContent = d.error || "Upload failed"; go.disabled = false; }
    };
    xhr.onerror = () => { msg.className = "msg bad"; msg.textContent = "Connection lost during upload"; go.disabled = false; };
    xhr.send(f);
  };
  view.addEventListener("click", async e => {
    const m = e.target.closest("[data-m]")?.dataset.m; if (!m) return;
    try {
      if (m === "clock") { const x = await one(`time ${Math.floor(Date.now() / 1000)}`); return toast(x, isErr(x) ? "bad" : "ok"); }
      if (m === "factory") {
        if (prompt("Factory reset erases the identity, all settings, WiFi and regions. Type ERASE to confirm.") !== "ERASE") return;
        toast(await one("factory reset confirm"), "bad"); return;
      }
      if (["reboot", "poweroff", "start ota", "setup start"].includes(m) && !confirm(`Run '${m}'?`)) return;
      const x = await one(m); toast(x || "Sent", isErr(x) ? "bad" : "ok");
      if (m === "setup start") setTimeout(() => location.reload(), 1500);
    } catch (err) { toast(err.message, "bad"); }
  });
}

  },
  parseHops(text) {
    const hops = String(text).split(/[\s,>]+/).map(s => s.trim().toLowerCase()).filter(Boolean);
    if (!hops.length) throw new Error("Enter hop ids, e.g. a1,b2,c3");

  },
  // Sets the route used for direct messages to this contact (what "define route" means in the apps).
  async setRoute(c, hops) {

function decodeLpp(b) {

  const T = {0: ["Digital in", 1, 1, ""], 1: ["Digital out", 1, 1, ""], 2: ["Analog in", 2, 0.01, "", 1], 3: ["Analog out", 2, 0.01, "", 1], 100: ["Generic", 4, 1, ""],
    101: ["Light", 2, 1, " lux"], 102: ["Presence", 1, 1, ""], 103: ["Temperature", 2, 0.1, " °C", 1], 104: ["Humidity", 1, 0.5, " %"], 115: ["Pressure", 2, 0.1, " hPa"],
    116: ["Voltage", 2, 0.01, " V"], 117: ["Current", 2, 0.001, " A"], 118: ["Frequency", 4, 1, " Hz"], 120: ["Percentage", 1, 1, " %"], 121: ["Altitude", 2, 1, " m", 1],
    125: ["Concentration", 2, 1, " ppm"], 128: ["Power", 2, 1, " W"], 130: ["Distance", 4, 0.001, " m"], 131: ["Energy", 4, 0.001, " kWh"], 132: ["Direction", 2, 1, "°"],
    133: ["Time", 4, 1, ""], 142: ["Switch", 1, 1, ""]};
  let o = 0;
  while (o + 2 <= b.length) {
    const ch = b[o], type = b[o + 1]; o += 2;
    if (T[type]) { const [name, n, mult, unit, signed] = T[type]; if (o + n > b.length) break; const v = be(o, n, signed) * mult; o += n;
      out.push({ch, name, value: type === 133 ? new Date(v * 1000).toLocaleString() : (Math.round(v * 1000) / 1000) + unit}); }
    else if (type === 136) { if (o + 9 > b.length) break; out.push({ch, name: "GPS", value: `${(be(o, 3, 1) / 1e4).toFixed(4)}, ${(be(o + 3, 3, 1) / 1e4).toFixed(4)} · ${(be(o + 6, 3, 1) / 100).toFixed(1)} m`}); o += 9; }
    else if (type === 113 || type === 134) { if (o + 6 > b.length) break; const m = type === 113 ? 0.001 : 0.01; out.push({ch, name: type === 113 ? "Accelerometer" : "Gyro", value: [0, 2, 4].map(i => (be(o + i, 2, 1) * m).toFixed(2)).join(", ")}); o += 6; }
    else if (type === 135) { if (o + 3 > b.length) break; out.push({ch, name: "Colour", value: "#" + hex(b.subarray(o, o + 3))}); o += 3; }

}

}
const ago = secs => { secs = Math.max(0, secs); return secs < 90 ? Math.round(secs) + " s" : secs < 5400 ? Math.round(secs / 60) + " min" : secs < 129600 ? Math.round(secs / 3600) + " h" : Math.round(secs / 86400) + " days"; };
const hopsLabel = c => c.hops < 0 ? "flood (no path)" : c.hops === 0 ? "direct" : `${c.hops} hop${c.hops > 1 ? "s" : ""}`;
const convName = conv => {

  const c = MC.contactByPrefix(conv.slice(2)); return c ? c.name : conv.slice(2);
};

  const offCli = (() => { const fn = (prefix, m) => { const c = open && MC.contacts.get(open); const t = $("#dtTerm"); if (c && t && c.key.startsWith(prefix)) { t.textContent += (t.textContent ? "\n" : "") + m.text; t.scrollTop = t.scrollHeight; } }; MC.cliFns.add(fn); return () => MC.cliFns.delete(fn); })();
  const offChange = MC.onChange(() => { if (!document.body.contains(view)) { offChange(); offCli(); return; } draw(); });
  view.addEventListener("input", e => { if (e.target.id === "ctSearch") { filter = e.target.value; draw(); } if (e.target.id === "ctType") { type = e.target.value; draw(); } });
  view.addEventListener("change", e => { if (e.target.id === "ctType") { type = e.target.value; draw(); } });
  view.addEventListener("click", async e => {
    const o = e.target.closest("[data-open]"); if (o) { e.preventDefault(); open = o.dataset.open; $("#ctDetail").innerHTML = ""; draw(); $("#ctDetail").scrollIntoView({behavior: "smooth"}); return; }
    const ad = e.target.closest("[data-add]");
    if (ad) { e.preventDefault(); const c = MC.pending.get(ad.dataset.add); try { await MC.request(u8(9, c.raw.subarray(0, 147)), [CODE.OK]); MC.pending.delete(c.key); await MC.listContacts(); toast(`Added ${c.name}`, "ok"); draw(); } catch (err) { toast(err.message, "bad"); } return; }
    const b = e.target.closest("button"); if (!b) return;
    const c = open && MC.contacts.get(open), out = $("#dtOut");
    const busy = t => { if (out) out.innerHTML = `<p class="val">${esc(t)}</p>`; };
    try {
      if (b.id === "ctRefresh") { await MC.refreshAll(); toast("Contacts reloaded", "ok"); }
      else if (b.id === "ctAdvZ") { await MC.request(u8(7), [CODE.OK]); toast("Zero-hop advert sent", "ok"); }
      else if (b.id === "ctAdvF") { await MC.request(u8(7, 1), [CODE.OK]); toast("Flood advert sent", "ok"); }
      else if (b.id === "ctMe") { const uri = await MC.exportContact(null); prompt("Your contact (share this with others, they paste it into Add contact):", uri); }
      else if (b.id === "ctImport") {
        const t = prompt("Paste a contact (meshcore://… from an app or this page):"); if (!t) return;
        const raw = unhex(t.replace(/^meshcore:\/\//i, "").replace(/[^0-9a-f]/gi, ""));
        if (raw.length < 100) return toast("That doesn't look like an exported contact", "bad");
        await MC.request(u8(18, raw), [CODE.OK]); await MC.listContacts(); toast("Contact added", "ok"); draw();
      }
      else if (!c) return;
      else if (b.dataset.d === "msg") { MC.activeConv = "c:" + c.prefix; go("chat"); }
      else if (b.dataset.d === "login") { const pw = prompt(`Password for ${c.name} (blank = guest):`, ""); if (pw === null) return; busy("Logging in over the mesh…"); const r = await MC.login(c, pw); out.innerHTML = `<p class="msg ok">Logged in${r.admin ? " as admin" : ""}.</p>`; }
      else if (b.dataset.d === "status") {
        busy("Requesting status over the mesh…"); const s = await MC.status(c);
        out.innerHTML = statGrid({"Battery": (s.battery_mv / 1000).toFixed(2) + " V", "Uptime": fmtUp(s.uptime_secs), "Noise floor": s.noise_floor + " dBm", "Last RSSI / SNR": `${s.last_rssi} / ${s.last_snr ?? "—"}`,
          "Packets rx / tx": `${s.packets_recv} / ${s.packets_sent}`, "Flood rx / tx": `${s.recv_flood} / ${s.sent_flood}`, "Direct rx / tx": `${s.recv_direct} / ${s.sent_direct}`,
          "TX airtime": s.tx_air_secs + " s", "RX airtime": (s.rx_air_secs ?? "—") + " s", "TX queue": s.tx_queue, "Duplicates (flood/direct)": `${s.flood_dups ?? "—"} / ${s.direct_dups ?? "—"}`, "Errors": s.errors});
      }
      else if (b.dataset.d === "telem") { busy("Requesting telemetry over the mesh…"); const t = await MC.telemetry(c); out.innerHTML = t.length ? statGrid(Object.fromEntries(t.map(x => [`${x.name} (ch ${x.ch})`, x.value]))) : `<p class="val">No telemetry shared (the node may only share it with favourites / contacts).</p>`; }
      else if (b.dataset.d === "trace") {
        busy("Tracing…"); out.innerHTML = traceTable(await MC.trace(c));
      }
      else if (b.dataset.d === "discover") {
        busy("Discovering the path (flood request)…"); const p = await MC.discoverPath(c);
        const names = hs => hs.map(h => { const r = [...MC.contacts.values()].find(x => x.key.startsWith(h)); return r ? r.name : h; }).join(" → ") || "direct";
        out.innerHTML = `<p><b>Out:</b> ${esc(names(p.out.hashes))} (${p.out.hops} hops)<br><b>Back:</b> ${esc(names(p.back.hashes))} (${p.back.hops} hops)</p>`;
        await MC.listContacts(); MC.emitChange();
      }
      else if (b.dataset.d === "route") {
        const now = MC.pathHops(c).join(",");
        const t = prompt(`Route to ${c.name}: repeater ids in order from here, e.g. a1,b2,c3 (see Routes & trace for ids). Blank = flood and learn.`, now);
        if (t === null) return;
        await MC.setRoute(c, t.trim() ? MC.parseHops(t) : []);
        toast(t.trim() ? `Route set: ${t.trim()}` : "Route cleared - the next message floods", "ok"); $("#ctDetail").innerHTML = ""; draw();
      }
      else if (b.dataset.d === "tracecustom") {
        const hops0 = MC.pathHops(c);
        const t = prompt("Hops to trace (out and back), e.g. a1,b2,a1", hops0.concat(hops0.slice(0, -1).reverse()).join(","));
        if (!t) return;
        busy("Tracing…"); out.innerHTML = traceTable(await MC.traceHops(MC.parseHops(t)));
      }
      else if (b.dataset.d === "reset") { await MC.request(u8(13, unhex(c.key)), [CODE.OK]); await MC.listContacts(); toast("Path reset - the next message floods and learns a new route", "ok"); draw(); }
      else if (b.dataset.d === "share") { await MC.request(u8(16, unhex(c.key)), [CODE.OK]); toast(`Shared ${c.name} with nodes in direct range`, "ok"); }
      else if (b.dataset.d === "export") { prompt(`Contact for ${c.name} (copy and share):`, await MC.exportContact(c)); }
      else if (b.dataset.d === "fav") { await MC.setFavourite(c, !c.fav); $("#ctDetail").innerHTML = ""; draw(); }
      else if (b.dataset.d === "remove") { if (!confirm(`Remove ${c.name} from this device?`)) return; await MC.request(u8(15, unhex(c.key)), [CODE.OK]); MC.contacts.delete(c.key); open = null; draw(); toast("Removed", "ok"); }
      else if (b.dataset.d === "cli") {
        const inp = $("#dtCmd"), cmd = inp.value.trim(); if (!cmd) return; inp.value = "";
        const t = $("#dtTerm"); t.textContent += (t.textContent ? "\n" : "") + "> " + cmd; t.scrollTop = t.scrollHeight;
        MC.addMsg("c:" + c.prefix, {t: Date.now(), ts: nowSecs(), dir: "out", text: cmd, kind: "cli"}, true); MC.saveStore();
        await MC.request(u8(2, 1, 0, le32(nowSecs()), unhex(c.prefix), cmd), [CODE.SENT]);
      }
    } catch (err) { if (out && b.dataset.d && b.dataset.d !== "cli") out.innerHTML = `<p class="msg bad">${esc(err.message)}</p>`; else toast(err.message, "bad"); }
  });
  draw();
  if (!MC.self) await MC.refreshAll().catch(err => toast(err.message, "bad"));
  draw();
}

        ${c.hops > 0 ? `<button class="btn sm" data-rt="trace" data-k="${c.key}">Trace</button>` : ""}<button class="btn sm" data-rt="reset" data-k="${c.key}">Reset</button></td></tr>`;

    $("#rtIds").innerHTML = ids.length ? ids.map(c => `<span class="pill">${TYPE_ICO[c.type]} ${esc(c.name)} <code>${c.key.slice(0, 2)}</code> <code>${c.key.slice(0, 4)}</code></span>`).join(" ")

      const c = MC.contacts.get(b.dataset.k); if (!c) return;
      if (b.dataset.rt === "set") {
        const t = prompt(`Route to ${c.name}: repeater ids in order from here, e.g. a1,b2. Blank = flood and learn.`, MC.pathHops(c).join(","));
        if (t === null) return;

      else if (b.dataset.rt === "discover") { toast(`Discovering the route to ${c.name}…`); await MC.discoverPath(c); await MC.listContacts(); toast("Route updated", "ok"); }

// ---------------------------------------------------------------- Map (client and repeater)
// Map tiles come from OpenStreetMap, so the browser needs internet access (the device does not).
function loadLeaflet() {
  if (window.L) return Promise.resolve();
  return new Promise((resolve, reject) => {
    const css = document.createElement("link");
    css.rel = "stylesheet"; css.href = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css";
    document.head.appendChild(css);
    const js = document.createElement("script");
    js.src = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js";
    js.onload = resolve; js.onerror = () => reject(new Error("Couldn't load the map (this browser needs internet access)"));
    document.head.appendChild(js);
  });
}
async function renderMap(view) {
  document.querySelector("main").style.maxWidth = "none";                    // a map wants the whole window
  view.innerHTML = `<div class="card" style="padding:0;overflow:hidden"><div id="mapBox" style="height:calc(100vh - 190px);min-height:380px"></div></div>
    <p class="val" id="mapNote" style="margin:8px 2px 0">Loading map…</p>`;
  const points = [];
  if (isClient()) {
    MC.start();
    if (!MC.self) await MC.refreshAll().catch(() => {});
    if (MC.self && (MC.self.lat || MC.self.lon)) points.push({lat: MC.self.lat, lon: MC.self.lon, name: MC.self.name + " (this radio)", kind: "me"});
    for (const c of MC.contacts.values()) if (c.lat || c.lon) points.push({lat: c.lat, lon: c.lon, name: c.name, kind: TYPES[c.type], sub: hopsLabel(c)});
  } else {
    const r = await api.cli(["get lat", "get lon", "get name"]);
    const lat = parseFloat(val(r[0])), lon = parseFloat(val(r[1]));
    if (lat || lon) points.push({lat, lon, name: val(r[2]) + " (this repeater)", kind: "me"});
    try { for (const x of (await api.routes()).routes || []) if (x.lat != null && (x.lat || x.lon)) points.push({lat: x.lat, lon: x.lon, name: x.name || x.key, kind: x.type, sub: `${x.hops} hop(s)`}); } catch {}
  }
  try { await loadLeaflet(); }
  catch (err) {
    $("#mapBox").style.height = "auto";
    $("#mapBox").innerHTML = `<div style="padding:14px"><p class="msg bad">${esc(err.message)}</p><table><tbody>${points.map(p =>
      `<tr><td>${esc(p.name)}</td><td>${esc(p.kind || "")}</td><td><a href="https://www.openstreetmap.org/?mlat=${p.lat}&mlon=${p.lon}#map=13/${p.lat}/${p.lon}" target="_blank" rel="noopener">${p.lat.toFixed(4)}, ${p.lon.toFixed(4)}</a></td></tr>`).join("")}</tbody></table></div>`;
    $("#mapNote").textContent = "";
    return;
  }
  const map = L.map("mapBox");
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom: 18, attribution: "© OpenStreetMap contributors"}).addTo(map);
  const colour = k => k === "me" ? "#0b6bcb" : /repeater/.test(k || "") ? "#d97706" : /room/.test(k || "") ? "#16a34a" : "#7c3aed";
  const bounds = [];
  for (const p of points) {
    L.circleMarker([p.lat, p.lon], {radius: p.kind === "me" ? 9 : 7, color: "#fff", weight: 2, fillColor: colour(p.kind), fillOpacity: 0.95})
      .addTo(map).bindPopup(`<b>${esc(p.name)}</b><br>${esc(p.kind || "")}${p.sub ? " · " + esc(p.sub) : ""}`);
    bounds.push([p.lat, p.lon]);
  }
  if (bounds.length > 1) map.fitBounds(bounds, {padding: [30, 30]});
  else map.setView(bounds[0] || [54.0, -2.0], bounds.length ? 12 : 6);
  $("#mapNote").textContent = `${points.length} node(s) with a location. Blue = this device, orange = repeaters, green = room servers, purple = people.`;
}

  view.addEventListener("click", async e => {
    const sh = e.target.closest("[data-show]");
    if (sh) { e.preventDefault(); const ch = MC.channels.find(c => c.idx === +sh.dataset.show); const code = view.querySelector(`[data-sec="${ch.idx}"]`); code.textContent = code.textContent.startsWith("•") ? hex(ch.secret) : "••••••••"; return; }
    const b = e.target.closest("button"); if (!b) return;
    try {
      if (b.dataset.chat) { MC.activeConv = "ch:" + b.dataset.chat; go("chat"); }
      else if (b.dataset.scope) {
        const ch = MC.channels.find(c => c.idx === +b.dataset.scope);
        const v = prompt(`Region scope for ${ch.name} (e.g. gb-yor). Use 1-29 lowercase letters, digits or hyphens. Blank = none.`, MC.channelScope(ch.idx));
        if (v === null) return;
        if (v.trim() && !validRegion(v.trim())) return toast("Use 1-29 lowercase letters, digits or hyphens", "bad");
        MC.setChannelScope(ch.name, v.trim());
        toast(v.trim() ? `${ch.name} messages are scoped to ${v.trim()}` : `${ch.name} is no longer scoped`, "ok");
        draw();
      }
      else if (b.dataset.share) { const ch = MC.channels.find(c => c.idx === +b.dataset.share); prompt(`Share "${ch.name}" - the other person adds it with "Join with a shared secret":`, `${ch.name} ${hex(ch.secret)}`); }
      else if (b.dataset.del) { const ch = MC.channels.find(c => c.idx === +b.dataset.del); if (!confirm(`Remove channel ${ch.name}?`)) return; await setChannel(ch.idx, "", new Uint8Array(16)); toast("Channel removed", "ok"); }
      else if (b.id === "chAdd") {
        const kind = $("#chKind").value; let name = $("#chName").value.trim(), secret;
        const idx = freeSlot(); if (idx < 0) return toast("All 40 channel slots are in use", "bad");
        if (kind === "hash") { if (!name) return toast("Enter a name", "bad"); if (!name.startsWith("#")) name = "#" + name; secret = hashtagKey(name); }
        else if (kind === "public") { secret = b64ToU8("izOH6cXN6mrJ5e26oRXNcg=="); name = name || "Public"; }
        else if (kind === "private") { if (!name) return toast("Enter a name", "bad"); secret = crypto.getRandomValues(new Uint8Array(16)); }
        else { secret = parseSecret($("#chSecret").value); if (!name || !secret) return toast("Enter a name and a 32-hex-character secret", "bad"); }
        if (MC.channels.some(c => hex(c.secret) === hex(secret))) return toast("That channel is already added", "bad");
        await setChannel(idx, name, secret); $("#chName").value = ""; $("#chSecret").value = "";
        toast(`Added ${name}${kind === "private" ? " - use Share to give others the secret" : ""}`, "ok");
      }
      else if (b.id === "chExport") { prompt("Channel list (keep private - it contains the secrets):", JSON.stringify(MC.channels.map(c => ({name: c.name, secret: hex(c.secret)})))); }
      else if (b.id === "chImportAll") {
        const t = prompt("Paste an exported channel list:"); if (!t) return;
        let list; try { list = JSON.parse(t); } catch { return toast("Not a channel list", "bad"); }
        let n = 0;
        for (const it of list) { const s = parseSecret(it.secret || ""); if (!s || MC.channels.some(c => hex(c.secret) === hex(s))) continue; const idx = freeSlot(); if (idx < 0) break; await setChannel(idx, String(it.name).slice(0, 31), s); n++; }
        toast(`Imported ${n} channel(s)`, "ok");
      }
    } catch (err) { toast(err.message, "bad"); }
  });
  draw();
  if (!MC.self) await MC.refreshAll().catch(err => toast(err.message, "bad"));
  draw();
}

// ================================================================ setup wizard
const W = {step: 0, data: {}};
function wizardSteps() {
  const s = ["welcome", "radio", "identity", "security", "wifi", "services", "finish"];
  return s;
}
async function showWizard() {
  $("#wizard").classList.remove("hidden"); $("#app").classList.add("hidden"); $("#login").classList.add("hidden");
  const r = await api.cli(["get radio", "get tx", "get name", "get lat", "get lon", "get dutycycle", "get wifi.ssid", "get pin", "get mqtt.iata", "get guest.password", "get telnet"]);
  const [fr, bw, sf, cr] = val(r[0]).split(",").map(Number);
  const duty = parseFloat(val(r[5])) || 10;
  const guest = isErr(r[9]) ? "" : val(r[9]);
  Object.assign(W.data, {fr, bw, sf, cr, tx: +val(r[1]) || 22, name: val(r[2]), lat: val(r[3]), lon: val(r[4]),
    // UK/EU 869.40–869.65 MHz sub-band is limited to 10 % duty cycle: suggest it (the user can still change it).
    duty: fr >= 869.4 && fr <= 869.65 && duty > 10 ? 10 : duty,
    ssid: val(r[6]) === "-" ? "" : val(r[6]), pin: val(r[7]), iata: isErr(r[8]) ? "" : val(r[8]),
    guest, guest0: guest, telnet: val(r[10]) === "on"});
  W.data.orig = {name: W.data.name, lat: W.data.lat, lon: W.data.lon, tx: W.data.tx, duty, ssid: W.data.ssid, telnet: W.data.telnet, iata: W.data.iata};
  const p = presetLoose(fr, bw, sf);
  W.data.preset = p ? PRESETS.indexOf(p) : "";
  W.data.preset0 = W.data.preset;
  renderWizard();
}
function renderWizard() {
  const steps = wizardSteps(), st = steps[W.step], d = W.data;
  const bar = `<div class="steps">${steps.map((_, i) => `<i class="${i <= W.step ? "on" : ""}"></i>`).join("")}</div>`;
  const nav = (next = "Next") => `<div class="row" style="margin-top:18px;justify-content:space-between">${W.step ? `<button class="btn" id="wBack">Back</button>` : "<span></span>"}<button class="btn pri" id="wNext">${next}</button></div>`;
  let h = "";
  if (st === "welcome") h = `<h1>Welcome</h1><p>Let's set up this <b>${esc(INFO.board)}</b> as a <b>${esc(INFO.role.replace("_", " "))}</b>.</p>
    <div class="stat"><b>${isClient() ? "Ultimate MeshCore Client" : "Ultimate MeshCore"} ${esc(INFO.umc)}</b></div>
    <p>Existing settings (name, radio, identity) are kept and pre-filled. Nothing is saved until the last step.</p>${nav("Start")}`;
  if (st === "radio") h = `<h1>Region &amp; radio</h1><p>Choose the preset used by your local mesh. Currently: ${d.fr ? d.fr.toFixed(3) : "?"} MHz, ${d.bw} kHz, SF${d.sf}, CR 4/${d.cr}.</p><div class="stack">
    <div><label>Preset</label><select id="wPreset"><option value="">Keep current settings</option>${PRESETS.map((p, i) => `<option value="${i}" ${d.preset === i ? "selected" : ""}>${esc(p[0])} — ${p[1]} MHz · ${p[2]} kHz · SF${p[3]}${i === d.preset0 ? " (current)" : ""}</option>`).join("")}</select></div>
    <div><label>TX power (dBm)</label><input type="number" id="wTx" min="1" max="22" value="${d.tx}"></div>
    ${roleOk(RS) ? `<div><label>Duty cycle limit (%)</label><input type="number" id="wDuty" min="1" max="100" value="${d.duty}"><div class="val">UK/EU 869.4–869.65 MHz: 10%.</div></div>` : ""}</div>${nav()}`;
  if (st === "identity") h = `<h1>Name &amp; location</h1><div class="stack">
    <div><label>Node name</label><input type="text" id="wName" value="${esc(d.name)}" maxlength="31"></div>
    <div><label>Location (optional)</label><div class="row"><input type="number" id="wLat" step="any" placeholder="latitude" value="${esc(d.lat)}" style="max-width:160px"><input type="number" id="wLon" step="any" placeholder="longitude" value="${esc(d.lon)}" style="max-width:160px"><button class="btn sm" id="wGeo">Pick from map…</button></div>
      <div class="val">Rounded to 3 decimals (~100 m) so your exact address isn't published.</div></div></div>${nav()}`;
  if (st === "security") h = `<h1>Admin password</h1><p>Protects ${roleOk(RS) ? "remote admin over the mesh, " : ""}this web page and telnet. At least 8 characters.</p><div class="stack">
    <div><label>New admin password</label><input type="password" id="wPw" autocomplete="new-password" value="${esc(d.pw || "")}"></div>
    <div><label>Confirm</label><input type="password" id="wPw2" autocomplete="new-password" value="${esc(d.pw || "")}"></div>
    ${roleOk(RS) ? `<div><label>Guest password (optional)</label><input type="text" id="wGuest" value="${esc(d.guest || "")}"><div class="val">Blank lets anyone view basic stats. Don't reuse other passwords.</div></div>` : ""}
    <p class="msg bad" id="wErr"></p></div>${nav()}`;
  if (st === "wifi") h = `<h1>Home WiFi</h1><p>Connect the device to your network so you can manage it from anywhere on the LAN. You can skip this and keep using this hotspot.</p><div class="stack">
    <div class="row" style="justify-content:space-between"><b>Networks nearby</b><button class="btn sm" id="wScan">Scan</button></div><div class="list" id="wList"><div class="val" style="padding:8px">Press Scan.</div></div>
    <div><label>Network name (SSID)</label><input type="text" id="wSsid" value="${esc(d.ssid)}"></div>
    <div><label>WiFi password</label><input type="password" id="wWpw" autocomplete="new-password" value="${esc(d.wpw || "")}"><div class="val">Leave blank for an open network, or to keep a saved password.</div></div></div>${nav()}`;
  if (st === "services") h = `<h1>Services</h1><div class="stack">
    <label class="row"><input type="checkbox" id="wTelnet" ${d.telnet ? "checked" : ""}> Telnet command line on port 23</label>
    ${has("mqtt") ? `<div><label>MQTT location code (IATA)</label><input type="text" id="wIata" value="${esc(d.iata === "UNSET" ? "" : d.iata)}" placeholder="e.g. LBA"><div class="val">Leave blank to keep MQTT off. Brokers can be chosen later on the MQTT page.</div></div>` : ""}
    <p class="val">The device clock will be set from this ${/Mobi/.test(navigator.userAgent) ? "phone" : "computer"} (${new Date().toUTCString()}).</p></div>${nav()}`;
  if (st === "finish") h = `<h1>Review</h1><pre id="wPlan"></pre><p class="msg" id="wMsg"></p>${nav("Apply & finish")}`;
  $("#wiz").innerHTML = bar + h;
  const g = id => $("#" + id);
  if (st === "identity") g("wGeo").onclick = async () => { const c = await askLocation(); if (c) { g("wLat").value = c[0]; g("wLon").value = c[1]; } };
  if (st === "wifi") g("wScan").onclick = async () => {
    g("wList").innerHTML = `<div class="val" style="padding:8px">Scanning… the hotspot may blink briefly.</div>`;
    let res = await api.scan(true).catch(() => null); for (let i = 0; i < 12 && res === null; i++) { await new Promise(r => setTimeout(r, 1000)); res = await api.scan(false).catch(() => null); }
    const m = new Map(); (res || []).forEach(n => { if (!m.has(n.ssid) || m.get(n.ssid).rssi < n.rssi) m.set(n.ssid, n); });
    g("wList").innerHTML = [...m.values()].sort((a, b) => b.rssi - a.rssi).map(n => `<button data-ss="${esc(n.ssid)}"><span>${esc(n.ssid)}</span><span class="val">${n.rssi} dBm · ${esc(n.auth)}</span></button>`).join("") || `<div class="val" style="padding:8px">Nothing found.</div>`;
    g("wList").onclick = e => { const b = e.target.closest("[data-ss]"); if (b) { g("wSsid").value = b.dataset.ss; g("wWpw").focus(); } };
  };
  if (st === "finish") $("#wPlan").textContent = wizardPlan().map(c => c.replace(/^(password|set wifi\.pwd|set guest\.password) .*/, "$1 ••••••")).join("\n");
  const back = $("#wBack"); if (back) back.onclick = () => { collect(st); W.step--; renderWizard(); };
  $("#wNext").onclick = async () => {
    if (!collect(st)) return;
    if (st === "finish") return applyWizard();
    W.step++; renderWizard();
  };
}
function collect(st) {
  const d = W.data, g = id => $("#" + id);
  if (st === "radio") { d.preset = g("wPreset").value === "" ? "" : +g("wPreset").value; d.tx = +g("wTx").value; if (g("wDuty")) d.duty = +g("wDuty").value; }
  if (st === "identity") { d.name = g("wName").value.trim(); d.lat = g("wLat").value; d.lon = g("wLon").value; }
  if (st === "security") {
    const a = g("wPw").value, b = g("wPw2").value;
    if (a.length < 8) { g("wErr").textContent = "Use at least 8 characters."; return false; }
    if (a !== b) { g("wErr").textContent = "Passwords don't match."; return false; }
    if (a === "password") { g("wErr").textContent = "Choose something other than the default."; return false; }
    d.pw = a; if (g("wGuest")) d.guest = g("wGuest").value;
  }
  if (st === "wifi") { d.ssid = g("wSsid").value.trim(); d.wpw = g("wWpw").value; }
  if (st === "services") { d.telnet = g("wTelnet").checked; if (g("wIata")) d.iata = g("wIata").value.trim().toUpperCase(); }
  return true;
}
function wizardPlan() {
  const d = W.data, o = d.orig || {}, c = [];
  // Only send what actually changes, so re-running setup never disturbs working settings.
  if (d.preset !== "" && d.preset !== d.preset0) { const p = PRESETS[d.preset]; c.push(`set radio ${p[1]},${p[2]},${p[3]},${p[4]}`); }
  if (d.tx !== o.tx) c.push(`set tx ${d.tx}`);
  if (d.duty !== o.duty) c.push(`set dutycycle ${d.duty}`);
  if (d.name && d.name !== o.name) c.push(`set name ${d.name}`);
  if (d.lat !== "" && d.lon !== "" && (d.lat !== o.lat || d.lon !== o.lon)) c.push(`set lat ${(+d.lat).toFixed(3)}`, `set lon ${(+d.lon).toFixed(3)}`);
  if (roleOk(RS) && d.guest != null && d.guest !== d.guest0) c.push(`set guest.password ${d.guest}`);
  if (d.ssid && d.ssid !== o.ssid) c.push(`set wifi.ssid ${d.ssid}`);
  if (d.ssid && d.wpw) c.push(`set wifi.pwd ${d.wpw}`);
  if (d.telnet !== o.telnet) c.push(`set telnet ${d.telnet ? "on" : "off"}`);
  if (has("mqtt") && d.iata && d.iata !== o.iata) c.push(`set mqtt.iata ${d.iata}`);
  c.push(`time ${Math.floor(Date.now() / 1000)}`);
  c.push(`password ${d.pw}`);
  return c;
}
async function applyWizard() {
  const msg = $("#wMsg"); $("#wNext").disabled = true; msg.className = "msg"; msg.textContent = "Applying…";
  try {
    const plan = wizardPlan(); const r = await api.cli(plan);
    const bad = plan.map((c, i) => [c, r[i]]).filter(([, x]) => isErr(x) && !/time/.test(x));
    if (bad.length) { msg.className = "msg bad"; msg.textContent = "Some settings were rejected: " + bad.map(([c, x]) => `${c.split(" ")[1]}: ${x}`).join("; "); $("#wNext").disabled = false; return; }
    const lg = await api.login(W.data.pw); TOKEN = lg.token; sessionStorage.setItem("umc_token", TOKEN);
    const done = await one("setup done");
    if (isErr(done)) throw new Error(done);
    INFO = await api.info();
    const host = INFO.net && INFO.net.hostname;
    $("#wiz").innerHTML = `<h1>All set 🎉</h1><p>Settings saved. ${W.data.ssid ? `The device is joining <b>${esc(W.data.ssid)}</b>. Once your phone or computer is back on that network, open:` : "Keep using this hotspot, or add WiFi later from the Network page."}</p>
      ${W.data.ssid ? `<pre>http://${esc(host)}.local/</pre><p class="val">If .local names don't work on your device, use the IP shown on the Network page or the device display.</p>` : ""}
      <p class="val">Some radio changes may need a reboot to take effect.</p><div class="row"><button class="btn" id="wReboot">Reboot now</button><button class="btn pri" id="wOpen">Open dashboard</button></div>`;
    $("#wOpen").onclick = () => { $("#wizard").classList.add("hidden"); startApp(); };
    $("#wReboot").onclick = async () => { await one("reboot").catch(() => {}); toast("Rebooting…"); };
  } catch (err) { msg.className = "msg bad"; msg.textContent = err.message; $("#wNext").disabled = false; }
}

// ================================================================ shell
let current = "dash";
function buildNav() {
  $("#navItems").innerHTML = SECTIONS.filter(s => has(s.feature) && roleOk(s.roles)).map(s => `<button data-sec="${s.id}"><span class="ico">${s.ico}</span>${esc(s.title)}</button>`).join("");
  $("#navItems").onclick = e => { const b = e.target.closest("[data-sec]"); if (b) { go(b.dataset.sec); $("#nav").classList.remove("open"); } };
}
async function go(id) {
  current = id; location.hash = id; clearInterval(dashTimer);
  document.querySelector("main").style.maxWidth = "";
  document.querySelectorAll("#navItems button").forEach(b => b.classList.toggle("on", b.dataset.sec === id));
  const sec = SECTIONS.find(s => s.id === id) || SECTIONS[0];
  $("#title").textContent = sec.title; closePop(); $("#about").innerHTML = aboutHtml(sec.id);
  const old = $("#view"), view = old.cloneNode(false); old.replaceWith(view);  // drop old listeners
  view.className = "";                                                       // cloneNode copies the class: the dashboard's must not leak onto other pages
  view.innerHTML = `<p class="val">Loading…</p>`;
  try {
    const fn = {dash: renderDash, clregion: renderClientRegion, clroutes: renderClientRoutes, map: renderMap, chat: renderChat, contacts: renderContacts, channels: renderChannels, neigh: renderNeigh, routes: renderRoutes, traffic: renderTraffic, regions: renderRegions, net: renderNet, console: renderConsole, fw: renderFw, backup: renderBackup}[sec.special];
    if (fn) await fn(view); else await renderSchemaSection(sec, view);
  } catch (err) { view.innerHTML = `<div class="card"><h2>Couldn't load</h2><p class="msg bad">${esc(err.message)}</p></div>`; }
}
function updatePills() {
  const n = INFO.net || {}, sta = n.sta || {};
  const p = $("#pillNet"); p.className = "pill " + (sta.connected ? "ok" : n.ap && n.ap.active ? "warn" : "bad");
  p.textContent = sta.connected ? `WiFi · ${sta.ip}` : n.ap && n.ap.active ? `Hotspot · ${n.ap.ssid}` : "Offline";
  $("#pillRole").textContent = `${INFO.name} · ${INFO.role}`;
  $("#navSub").textContent = `${INFO.board} · v${INFO.umc}`;
  const brand = isClient() ? "Ultimate MeshCore Client" : "Ultimate MeshCore";
  document.title = `${INFO.name} · ${brand}`;
  document.querySelector("#nav .brand").firstChild.textContent = brand;
}
function showLogin() {
  $("#app").classList.add("hidden"); $("#wizard").classList.add("hidden"); $("#login").classList.remove("hidden");
  if (INFO) $("#loginInfo").textContent = `${INFO.name} — ${INFO.board} ${INFO.role}. Sign in with the admin password.`;
  if (INFO && INFO.default_pw) $("#loginMsg").textContent = "Admin password is still the default — change it over USB or re-run setup from the hotspot.";
  $("#pw").focus();
}
async function startApp() {
  $("#login").classList.add("hidden"); $("#app").classList.remove("hidden");
  buildNav(); updatePills();
  MC.start();  // client: collect messages in the background on every page
  const id = location.hash.slice(1); await go(SECTIONS.some(s => s.id === id && roleOk(s.roles)) ? id : isClient() ? "chat" : "dash");
  setInterval(async () => { try { INFO = await api.info(); updatePills(); } catch {} }, 30000);
}
async function boot() {
  try { INFO = await api.info(); }
  catch (err) { return; }  // showOffline() already took over
  if (INFO.setup && !INFO.auth_required) return showWizard();
  if (INFO.auth_required) return showLogin();
  startApp();
}
$("#loginBtn").onclick = async () => {
  $("#loginMsg").textContent = "";
  try { const r = await api.login($("#pw").value); TOKEN = r.token; sessionStorage.setItem("umc_token", TOKEN); $("#pw").value = ""; INFO = await api.info(); startApp(); }
  catch (err) { $("#loginMsg").textContent = err.message; }
};
$("#pw").addEventListener("keydown", e => { if (e.key === "Enter") $("#loginBtn").click(); });
$("#logoutBtn").onclick = async () => { await api.logout().catch(() => {}); TOKEN = ""; sessionStorage.removeItem("umc_token"); showLogin(); };
$("#menuBtn").onclick = () => $("#nav").classList.toggle("open");
boot();
</script>
